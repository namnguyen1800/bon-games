<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bon's Fishtank</title>
<style>
  /* Game 4 của Bon: hồ cá sống, mở lên thấy hồ ngay; Bon vẽ con gì → thành sticker → thả vào hồ, mỗi loài đi một kiểu. Không thắng thua, con vật không bao giờ đói hay chết.
     canvas #tank kín màn cho hồ; chọn loài / xưởng vẽ / Ta-da / Album là lớp HTML phủ lên. Nút to bên phải (Bon chơi iPad tay phải). */
  :root { color-scheme: light; --ink: #1f3b40; --edge: #2e6b73; --card: #ffffff; --go: #f59e0b; --water: #2aa3c0; --yes: #22c55e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--water); color: var(--ink); font-family: -apple-system, "Segoe UI", sans-serif;
         -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  [hidden] { display: none !important; }
  canvas { display: block; }
  #tank { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  button { font: inherit; color: inherit; border: 4px solid var(--edge); border-radius: 18px; background: var(--card); cursor: pointer;
           box-shadow: 0 5px 0 rgba(46,107,115,0.5); touch-action: manipulation; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(46,107,115,0.5); }
  .corner { position: fixed; z-index: 5; width: 56px; height: 56px; font-size: 28px; border-radius: 16px; }
  #homeBtn { top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
  #muteBtn { top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
  #drawBtn { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
             width: 128px; height: 128px; border-radius: 34px; background: var(--go); color: #fff; font-size: 30px; font-weight: 900;
             display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  #drawBtn b { font-size: 54px; line-height: 1; }
  #removeBtn { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 142px);
               width: 128px; height: 70px; border-radius: 22px; font-size: 21px; font-weight: 900; }
  #removeBtn.on { background: var(--yes); color: #fff; }
  #albumBtn { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 226px);
              width: 128px; height: 70px; border-radius: 22px; font-size: 21px; font-weight: 900; }
  #lampBtn { top: calc(max(10px, env(safe-area-inset-top)) + 68px); right: max(12px, env(safe-area-inset-right)); background: #fde68a; }
  #lampBtn.off { background: #334155; border-color: #0f172a; }
  #drawBtn.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #banner { position: fixed; z-index: 6; left: 50%; top: 14px; transform: translateX(-50%); background: #fee2e2; border: 4px solid #dc2626; color: #991b1b; border-radius: 18px; padding: 8px 20px; font-size: 26px; font-weight: 900; white-space: nowrap; pointer-events: none; }
  #ask { z-index: 11; }
  #ask .panel { max-width: 460px; }
  #askCv { width: 100%; height: 220px; background: linear-gradient(#a9ecee, #4cc0d3); border-radius: 18px; }
  #askYes, #askNo { flex: 1; height: 84px; font-size: 30px; font-weight: 900; }
  #askYes { background: #ef4444; color: #fff; }
  #tip { position: fixed; z-index: 4; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(255,255,255,0.92); border: 4px solid var(--edge);
         border-radius: 18px; padding: 8px 18px; font-size: 24px; font-weight: 800; white-space: nowrap; transition: opacity 0.5s; pointer-events: none; }
  #tip.off { opacity: 0; }
  #notSaved { position: fixed; z-index: 4; left: 12px; bottom: 8px; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none; }
  /* lớp phủ: chọn loài + Ta-da */
  .veil { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
          background: rgba(10,50,70,0.55); }
  .panel { width: 100%; max-width: 1000px; max-height: 100%; display: flex; flex-direction: column; gap: 10px; background: #fffdf7; border: 5px solid var(--go); border-radius: 26px; padding: 14px; }
  .panel h2 { font-size: 32px; color: #b45309; text-align: center; }
  #kinds { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 9px; padding: 4px 6px 10px 2px; }
  .kind { padding: 4px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 17px; font-weight: 800; touch-action: pan-y; border-width: 3px; box-shadow: 0 3px 0 rgba(46,107,115,0.5); }
  .kind canvas { width: 92px; height: 69px; }
  .kind.any { background: #fef3c7; }
  .back { height: 56px; font-size: 22px; font-weight: 800; }
  /* xưởng vẽ */
  #studio { position: fixed; inset: 0; z-index: 12; display: flex; gap: 12px; background: #8fd8e2;
            padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  #paperBox { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #paperIn { position: relative; background: #fff; border: 5px solid var(--edge); border-radius: 20px; overflow: hidden; }
  #guide, #paper { position: absolute; inset: 0; width: 100%; height: 100%; }
  #paper { touch-action: none; }
  #guideBtn { position: absolute; right: 8px; top: 8px; width: 52px; height: 52px; font-size: 24px; border-width: 3px; border-radius: 14px; box-shadow: none; }
  #say { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(255,255,255,0.95); border: 3px solid var(--edge); border-radius: 14px; padding: 4px 14px; font-size: 20px; font-weight: 800; white-space: nowrap; pointer-events: none; }
  #tools { width: 250px; flex: none; display: flex; flex-direction: column; gap: 9px; justify-content: safe center; overflow-y: auto; touch-action: pan-y; }
  #colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  #colors button { aspect-ratio: 1; border-radius: 14px; border-width: 3px; box-shadow: none; }
  #colors button.on { outline: 4px solid #f59e0b; outline-offset: 1px; }
  #sizes, .row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .row2 { grid-template-columns: repeat(2, 1fr); }
  #sizes button { height: 52px; display: flex; align-items: center; justify-content: center; box-shadow: none; border-width: 3px; }
  #sizes i { display: block; background: var(--ink); border-radius: 50%; }
  .tool { height: 58px; font-size: 19px; font-weight: 800; border-width: 3px; box-shadow: 0 3px 0 rgba(46,107,115,0.5); }
  .on.tool, #sizes .on { background: #fde68a; border-color: #b45309; }
  #doneBtn { height: 78px; background: var(--yes); color: #fff; font-size: 34px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  /* Album */
  #album .panel { height: 100%; }
  #albumGrid { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows: 140px; gap: 10px; padding: 4px; }
  .alb { position: relative; }
  .albPut { position: absolute; inset: 0; padding: 6px; display: flex; align-items: center; justify-content: center; background: linear-gradient(#c8f7f2, #7be3e3); touch-action: pan-y; }
  .albPut img { max-width: 100%; max-height: 100%; }
  .albDel { position: absolute; right: -4px; top: -4px; width: 46px; height: 46px; font-size: 20px; border-radius: 14px; border-width: 3px; border-color: #dc2626; box-shadow: none; }
  #albumEmpty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--edge); text-align: center; }
  /* Ta-da */
  #tada { z-index: 14; } /* phủ lên xưởng vẽ */
  #tada .panel { max-width: 640px; }
  #tadaCv { width: 100%; height: min(46vh, 340px); background: linear-gradient(#a9ecee, #4cc0d3); border-radius: 18px; }
  #moves { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tadaRow { display: flex; gap: 10px; }
  #flipBtn { width: 150px; height: 84px; font-size: 24px; font-weight: 800; flex: none; }
  #goBtn { flex: 1; height: 84px; background: var(--yes); color: #fff; font-size: 30px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  @media (max-height: 620px) and (orientation: landscape) {
    #tools { gap: 5px; width: 230px; }
    #colors { grid-template-columns: repeat(6, 1fr); gap: 4px; }
    #colors button { border-radius: 8px; border-width: 2px; }
    #sizes button { height: 34px; }
    .tool { height: 38px; font-size: 15px; box-shadow: none; }
    #doneBtn { height: 46px; font-size: 22px; }
    #drawBtn { width: 92px; height: 92px; font-size: 20px; }
    #drawBtn b { font-size: 38px; }
    #removeBtn { width: 92px; height: 50px; font-size: 15px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 104px); }
    #albumBtn { width: 92px; height: 50px; font-size: 15px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 164px); }
    #tadaCv { height: 36vh; }
    #flipBtn, #goBtn { height: 56px; }
    .back { height: 42px; font-size: 18px; }
    #tada .panel { gap: 6px; padding: 8px; }
    #tada h2 { display: none; }
  }
  /* đứng dọc / điện thoại: công cụ xuống đáy */
  @media (max-width: 760px), (orientation: portrait) {
    #studio { flex-direction: column; }
    #tools { width: 100%; }
    #colors { grid-template-columns: repeat(12, 1fr); gap: 4px; }
    #colors button { border-radius: 8px; }
    .tool { height: 50px; font-size: 16px; }
    #sizes button { height: 44px; }
    #doneBtn { height: 62px; font-size: 28px; }
    #drawBtn { width: 104px; height: 104px; font-size: 24px; }
    #drawBtn b { font-size: 44px; }
    #tip, #banner { top: calc(max(10px, env(safe-area-inset-top)) + 64px); font-size: 19px; padding: 6px 12px; max-width: 94vw; white-space: normal; text-align: center; width: max-content; }
  }
</style>

<body>
<canvas id="tank"></canvas>
<button id="homeBtn" class="corner" aria-label="Home">🏠</button>
<button id="muteBtn" class="corner" aria-label="Sound">🔊</button>
<button id="lampBtn" class="corner" aria-label="Lamp">💡</button>
<button id="drawBtn"><b>✏️</b>Draw</button>
<button id="removeBtn">🗑 Remove</button>
<button id="albumBtn">📒 Album</button>
<div id="banner" hidden>Tap one to put it in the album</div>
<div id="tip" class="off"></div>
<div id="notSaved" hidden>Not saved on this iPad</div>

<div id="pick" class="veil" hidden><div class="panel">
  <h2>What will you draw?</h2>
  <div id="kinds"></div>
  <button id="pickBack" class="back">Back to the tank</button>
</div></div>

<div id="ask" class="veil" hidden><div class="panel">
  <h2 id="askTitle">Put this one in the album?</h2>
  <canvas id="askCv"></canvas>
  <div class="tadaRow"><button id="askYes">Yes</button><button id="askNo">No</button></div>
</div></div>

<div id="album" class="veil" hidden><div class="panel">
  <h2>Album</h2>
  <div id="albumGrid"></div>
  <div id="albumEmpty" hidden>Nothing here yet</div>
  <button id="albumBack" class="back">Back to the tank</button>
</div></div>

<div id="studio" hidden>
  <div id="paperBox"><div id="paperIn"><canvas id="guide" width="960" height="720"></canvas><canvas id="paper" width="960" height="720"></canvas><button id="guideBtn" aria-label="Guide">👁</button><div id="say" hidden></div></div></div>
  <div id="tools">
    <div id="colors"></div>
    <div id="sizes"></div>
    <div class="row2"><button class="tool" data-tool="pen">✏️ Pen</button><button class="tool" data-tool="fill">🪣 Fill</button></div>
    <div class="row2"><button class="tool" data-tool="eraser">🧽 Erase</button><button class="tool" data-tool="eye">👀 Eyes</button></div>
    <div class="row2"><button id="undoBtn" class="tool">↩ Undo</button><button id="clearBtn" class="tool">🗑 Clear</button></div>
    <button id="doneBtn">Done!</button>
    <button id="studioBack" class="tool">✕ Back</button>
  </div>
</div>

<div id="tada" class="veil" hidden><div class="panel">
  <h2 id="tadaTitle">Ta-da!</h2>
  <canvas id="tadaCv"></canvas>
  <div id="moves" hidden></div>
  <div class="tadaRow"><button id="flipBtn">↔ Flip</button><button id="goBtn">Let it swim!</button></div>
  <button id="redoBtn" class="back">Keep drawing</button>
</div></div>

<script src="froggy3d/sprites.js"></script>
<script src="friends3d/sprites.js"></script>
<script src="friends3d/sounds.js"></script>
<script>
(function(){
  'use strict';
  const TEST = /[?&]test/.test(location.search);
  const HOME = location.protocol !== 'file:'; // nút 🏠 về trang chủ bon-games/ — mở file trên máy thì không có trang chủ → giấu
  const TAU = Math.PI * 2;
  const $ = function(id) { return document.getElementById(id); };
  function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function dayNo(d) { return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5; } // số ngày LỊCH theo giờ máy → đổi giờ mùa hè không lệch

  const MAX_TANK = 40, BIRTH_CAP = 30, BIRTH_DAYS = 2, MAX_ALBUM = 200, BABY_SIZE = 0.42; // mốc thử, Nam đổi được

  // ================= LƯU TRÊN MÁY =================
  // IndexedDB vì ảnh to: đo 25 hình mẫu trung bình ~98 nghìn ký tự, 40 con ~3,9 triệu, localStorage không đủ chắc.
  // 4 ngăn: pics (ảnh to) · thumbs (ảnh nhỏ cho Album) · tank (từng con, album:true = đang nằm trong Album) · meta (lastBirthDay, draft, lamp, mute).
  // Thả con mới = 1 giao dịch gồm ảnh + bản ghi + xóa bản nháp: xong hết mới tính là đã lưu. Không lưu được → game vẫn chạy, hiện dòng nhỏ cho bố.
  const DB_NAME = 'bon_fishtank', DB_VER = 1;
  const save = { mute: false, lastBirthDay: null, lamp: null };
  const picCache = new Map(); // picId → { img, thumb }
  let db = null, dbOff = false, failNext = 0, failBorn = false; // 2 cờ cuối chỉ ?test dùng để giả lỗi
  function dbFail() { $('notSaved').hidden = false; }
  function dbOpen() {
    return new Promise(function(res) {
      if (dbOff) { dbFail(); res(false); return; }
      let q;
      try { q = indexedDB.open(DB_NAME, DB_VER); } catch (e) { dbFail(); res(false); return; }
      q.onupgradeneeded = function() {
        const d = q.result;
        for (const n of ['pics', 'thumbs', 'meta']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n);
        if (!d.objectStoreNames.contains('tank')) d.createObjectStore('tank', { keyPath: 'id' });
      };
      q.onerror = function() { dbFail(); res(false); };
      q.onsuccess = function() { db = q.result; db.onclose = function() { db = null; }; res(true); };
    });
  }
  function dbRun(stores, fn, retried) { // 1 giao dịch ghi; trả true khi đã ghi xong HẲN. Kết nối rớt (iPad hay rớt khi app ngủ) → mở lại, thử đúng 1 lần nữa
    return new Promise(function(res) {
      let done = false;
      const fail = function() {
        if (done) return; done = true;
        if (retried) { dbFail(); res(false); return; }
        db = null; dbOpen().then(function() { dbRun(stores, fn, true).then(res); });
      };
      if (!db) { fail(); return; }
      let t;
      try { t = db.transaction(stores, 'readwrite'); } catch (e) { fail(); return; }
      t.oncomplete = function() { if (!done) { done = true; res(true); } };
      t.onabort = t.onerror = fail;
      try { fn(t); if (failNext > 0) { failNext--; t.abort(); } } catch (e) { try { t.abort(); } catch (e2) {} }
    });
  }
  function dbReadAll(store) {
    return new Promise(function(res) {
      try { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = function() { res(r.result || []); }; r.onerror = function() { res([]); }; } catch (e) { res([]); }
    });
  }
  function dbRead(store, key) {
    return new Promise(function(res) {
      try { const r = db.transaction(store).objectStore(store).get(key); r.onsuccess = function() { res(r.result); }; r.onerror = function() { res(undefined); }; } catch (e) { res(undefined); }
    });
  }
  function metaSave(key, value) { return dbRun(['meta'], function(t) { if (value === null) t.objectStore('meta').delete(key); else t.objectStore('meta').put(value, key); }); }
  function loadImg(src) { return new Promise(function(res) { const im = new Image(); im.onload = function() { res(im); }; im.onerror = function() { res(null); }; im.src = src; }); }
  async function picOf(id) { // ảnh to của 1 con: trong bộ nhớ thì lấy luôn, không thì nạp từ máy
    const c = picCache.get(id);
    if (c && c.img) return c;
    const png = await dbRead('pics', id);
    if (!png) return null;
    const img = await loadImg(png);
    if (!img) return null;
    const v = { img: img, thumb: c ? c.thumb : null }; picCache.set(id, v); return v;
  }
  let askedPersist = false;
  function askPersist() { // xin trình duyệt đừng tự xoá; Safari không hứa, nên không coi đây là bảo đảm
    if (askedPersist) return; askedPersist = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function() {}); } catch (e) {}
  }

  // ================= LOÀI =================
  // Bon vẽ gì cũng được; chọn loài chỉ để biết con đó đi đứng ra sao (move) và hiện gợi ý mờ trên giấy. Đầu con vật quy ước bên PHẢI.
  // baby: true = có thể đẻ con (đồ vật, tàu ngầm, nàng tiên cá, thợ lặn thì không).
  const KINDS = [
    { id: 'any',     name: 'Anything!',  move: null,    maxW: 320, speed: 1, baby: true },
    { id: 'fish',    name: 'Fish',       move: 'swim',  maxW: 330, speed: 1, baby: true },
    { id: 'shark',   name: 'Shark',      move: 'swim',  maxW: 420, speed: 1.5, wave: 0.7, baby: true },
    { id: 'hammer',  name: 'Hammerhead', move: 'swim',  maxW: 400, speed: 1.3, wave: 0.7, baby: true },
    { id: 'sword',   name: 'Swordfish',  move: 'swim',  maxW: 400, speed: 1.7, wave: 0.8, baby: true },
    { id: 'angler',  name: 'Anglerfish', move: 'swim',  maxW: 280, speed: 0.5, tempo: 0.7, baby: true },
    { id: 'puffer',  name: 'Pufferfish', move: 'swim',  maxW: 230, speed: 0.6, puff: true, baby: true },
    { id: 'whale',   name: 'Whale',      move: 'swim',  maxW: 460, speed: 0.55, tempo: 0.5, baby: true },
    { id: 'narwhal', name: 'Narwhal',    move: 'swim',  maxW: 420, speed: 0.8, tempo: 0.6, baby: true },
    { id: 'dolphin', name: 'Dolphin',    move: 'swim',  maxW: 340, speed: 1.6, baby: true },
    { id: 'penguin', name: 'Penguin',    move: 'swim',  maxW: 240, speed: 1.4, wave: 0.6, baby: true },
    { id: 'turtle',  name: 'Turtle',     move: 'flap',  maxW: 300, speed: 0.6, tempo: 0.55, baby: true },
    { id: 'ray',     name: 'Stingray',   move: 'flap',  maxW: 340, speed: 0.9, baby: true },
    { id: 'eel',     name: 'Eel',        move: 'eel',   maxW: 430, speed: 0.8, baby: true },
    { id: 'horse',   name: 'Seahorse',   move: 'hover', maxW: 170, speed: 0.3, baby: true },
    { id: 'shrimp',  name: 'Shrimp',     move: 'dart',  maxW: 190, speed: 1, baby: true },
    { id: 'octo',    name: 'Octopus',    move: 'pulse', maxW: 270, baby: true },
    { id: 'squid',   name: 'Squid',      move: 'pulse', maxW: 240, baby: true },

  function curve(p, closed) { // đường cong qua các điểm → nét liền như tay vẽ
    const out = [], n = p.length, at = function(i) { return closed ? p[(i + n) % n] : p[Math.max(0, Math.min(n - 1, i))]; };
    const end = closed ? n : n - 1;
    for (let i = 0; i < end; i++) {

      for (let s = 0; s < steps; s++) {
        const t = s / steps, t2 = t * t, t3 = t2 * t;
        out.push(0.5 * (2 * b[0] + (c[0] - a[0]) * t + (2 * a[0] - 5 * b[0] + 4 * c[0] - d[0]) * t2 + (3 * b[0] - a[0] - 3 * c[0] + d[0]) * t3),

      }
    }
    if (closed) out.push(out[0], out[1]); else out.push(p[n - 1][0], p[n - 1][1]);
    return out;

  function drawRows(g, c, top, h, fn) { // fn(v) ghi R.dx (xô ngang) + R.k (co giãn ngang) cho hàng v (0 = đỉnh, 1 = đáy)
    const N = c.n, im = c.img, sh = im.height / N, ky = h / im.height;
    fn(0); let dx0 = R.dx;
    for (let j = 0; j < N; j++) {
      fn((j + 1) / N); const dx1 = R.dx;
      fn((j + 0.5) / N); const w = c.dw * R.k, sy = j * sh, ch = Math.min(sh + 1.5 / Math.max(0.15, ky), im.height - sy);
      g.save(); g.transform(w / im.width, 0, (dx1 - dx0) / sh, ky, -w / 2 + dx0, top + j * h / N);
      g.drawImage(im, 0, sy, im.width, ch, 0, 0, im.width, ch); g.restore();
      dx0 = dx1;
    }
    eyesAt(g, c, function(u, v) { fn(v); return [(u - 0.5) * c.dw * R.k + R.dx, top + v * h]; });
  }
  const DRAW = {
    swim: function(g, c) {
      const wave = c.K.wave || 1, ph = c.ph, B = 0.1 * c.dh * wave * (1 + c.boost * 0.5), A = 0.95 * wave;
      drawCols(g, c, function(t) { return Math.cos(A * t * t * Math.sin(ph - 4.6 * t)); }, function(t) { return B * t * t * Math.sin(ph - 4.6 * t); });
    },
    eel: function(g, c) {
      const ph = c.ph, B = 0.26 * c.dh;
      drawCols(g, c, function(t) { return 1 - 0.1 * Math.abs(Math.sin(ph - 8 * t)); }, function(t) { return B * (0.25 + 0.75 * t) * Math.sin(ph - 8 * t); });
    },
    flap: function(g, c) { // cá đuối, rùa: cánh vỗ = mỗi dải dọc co giãn chiều cao, sóng chạy từ đầu ra đuôi
      const N = c.n, im = c.img, sw = im.width / N, dw = c.dw, dh = c.dh, ph = c.ph;
      const ky = function(u) { return 1 - 0.3 * (0.5 + 0.5 * Math.sin(ph + u * 2.6)); };
      for (let i = 0; i < N; i++) { const u = (i + 0.5) / N, h = dh * ky(u); g.drawImage(im, i * sw, 0, Math.min(sw * (1 + 1.5 * N / dw), im.width - i * sw), im.height, -dw / 2 + i * dw / N, -h / 2, dw / N + 1.5, h); }
      eyesAt(g, c, function(u, v) { return [(u - 0.5) * dw, (v - 0.5) * dh * ky(u)]; });
    },
    hover: function(g, c) {
      const ph = c.ph;
      g.translate(0, Math.sin(ph * 0.7) * 6 * U);
      drawRows(g, c, -c.dh / 2, c.dh, function(v) { const e = v * v; R.dx = Math.sin(ph * 1.1 - v * 4) * e * c.dw * 0.09; R.k = 1 + Math.sin(ph * 2) * 0.03; });
    },
    dart: function(g, c) {
      const ph = c.ph, sn = c.snap > 0 ? 1 : 0;
      drawCols(g, c, function(t) { return 1 - sn * 0.22 * t; }, function(t) { return Math.sin(ph - 3 * t) * t * c.dh * 0.04 + sn * t * t * c.dh * 0.14; });
    },
    drive: function(g, c) {
      g.rotate(clamp(c.vy / (160 * U), -0.14, 0.14));
      g.drawImage(c.img, -c.dw / 2, -c.dh / 2, c.dw, c.dh);
      eyesAt(g, c, function(u, v) { return [(u - 0.5) * c.dw, (v - 0.5) * c.dh]; });
    },
    pulse: function(g, c) {
      const p = c.pt % 1, s = p < 0.24 ? Math.sin(Math.PI * p / 0.24) : 0, rel = p >= 0.24 ? Math.sin(Math.PI * (p - 0.24) / 0.76) : 0;
      const wk = 1 - 0.2 * s + 0.07 * rel, hk = 1 + 0.15 * s - 0.04 * rel, h = c.dh * hk, ph = c.ph, dw = c.dw;
      drawRows(g, c, -h / 2, h, function(v) {
        const arm = clamp((v - 0.42) / 0.58, 0, 1);
        R.dx = Math.sin(ph - v * 5) * arm * arm * dw * 0.08;
        R.k = wk * (1 + arm * (0.26 * rel - 0.14 * s));
      });
    },
    walk: function(g, c) {
      const moving = c.rest > 0 ? 0.15 : 1, ph = c.ph, b = Math.abs(Math.sin(ph)) * 3 * U * moving;
      drawRows(g, c, -c.dh - b, c.dh, function(v) { const leg = clamp((v - 0.55) / 0.45, 0, 1); R.dx = Math.sin(ph * 1.3 + v * 7) * leg * c.dw * 0.05 * moving; R.k = 1; });
    },
    crawl: function(g, c) {
      const ph = c.ph, dw = c.dw;
      drawRows(g, c, -c.dh, c.dh, function(v) { const foot = clamp((v - 0.5) / 0.5, 0, 1); R.k = 1 + Math.sin(ph) * 0.09 * foot; R.dx = Math.sin(ph) * dw * 0.035 * foot; });
    },
    sway: function(g, c) {
      const ph = c.ph, a = (c.amp || (c.K && c.K.amp) || 1) * 0.11 * c.dw;
      drawRows(g, c, -c.dh, c.dh, function(v) { const t = 1 - v; R.dx = Math.sin(ph + t * 2) * t * t * a; R.k = 1; });
    },
    still: function(g, c) {
      g.drawImage(c.img, -c.dw / 2, -c.dh, c.dw, c.dh);
      eyesAt(g, c, function(u, v) { return [(u - 0.5) * c.dw, -c.dh + v * c.dh]; });
    },
  };
  function drawCreature(g, c) {
    g.save(); g.translate(c.x, c.y);
    const faced = FACING[c.move];
    if (faced) {
      const t = Math.abs(c.turn) < 0.06 ? (c.turn < 0 ? -0.06 : 0.06) : c.turn;
      g.scale(t, 1);
      if (!GROUND[c.move] && c.move !== 'hover') { c.tilt += (clamp(c.vy / (Math.abs(c.vx) + 60 * U), -0.28, 0.28) - c.tilt) * 0.08; g.rotate(c.tilt + (c.dir - c.turn) * 0.1); } // nghiêng người trước khi quay đầu
    }
    let k = 1 + (c.gulp > 0 ? Math.sin(c.gulp / 0.28 * Math.PI) * 0.1 : 0);
    if (c.wig > 0) k *= 1 + Math.sin(c.wig * 30) * 0.05;
    if (c.K && c.K.puff && c.puff > 0) k *= 1 + 0.45 * Math.min(1, c.puff * 2);
    if (k !== 1) g.scale(k, k);
    DRAW[c.move](g, c);
    g.restore();
  }

  // ---- hiệu ứng ----
  function bubble(x, y, r) { if (bubbles.length < 90) bubbles.push({ x: x, y: y, r: r, ph: rnd(0, TAU), v: rnd(36, 70) * U }); }
  function splash(x, y) { for (let i = 0; i < 16; i++) bubble(x + rnd(-40, 40) * U, y + rnd(-10, 26) * U, rnd(3, 11) * U); noise('plop'); }
  function dropFood(x, y) { for (let i = 0; i < 3; i++) foods.push({ x: x + rnd(-18, 18) * U, y: y + rnd(-10, 10) * U, v: rnd(30, 44) * U, ph: rnd(0, TAU), life: 16 }); noise('pop'); }
  function stepFx(dt) {
    for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.y -= b.v * dt; b.ph += dt * 3; b.x += Math.sin(b.ph) * 12 * U * dt; if (b.y < surfaceY) bubbles.splice(i, 1); }
    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i], fl = groundAt(f.x) + 6 * U;
      if (f.y < fl) { f.y += f.v * dt; f.ph += dt * 2.4; f.x += Math.sin(f.ph) * 14 * U * dt; } else f.life -= dt;
      if (f.life <= 0) foods.splice(i, 1);
    }
    for (let i = hearts.length - 1; i >= 0; i--) { const h = hearts[i]; h.t += dt; h.y -= 34 * U * dt; if (h.t > 1) hearts.splice(i, 1); }
    if (Math.random() < dt * 2.2) bubble(W * 0.62 + rnd(-30, 30) * U, groundY, rnd(2, 6) * U); // sủi từ đá như máy sủi trong hồ thật
  }

  // ---- bạn thú bông ghé hồ: bơi ngang qua, sát 1 con của Bon thì tim bay lên ----
  let visitor = null, visitT = 12, visitI = Math.floor(Math.random() * 4);
  const CHARS = ['froggy', 'babyfrog', 'chicken', 'pillow'];
  function stepVisitor(dt) {
    if (!visitor) {
      visitT -= dt;
      if (visitT <= 0) {
        const id = CHARS[visitI++ % CHARS.length], dir = visitI % 2 ? 1 : -1, r = 34 * U;
        const swimmers = creatures.filter(function(c) { return !GROUND[c.move]; }), pal = swimmers.length ? swimmers[Math.floor(Math.random() * swimmers.length)] : null;
        visitor = { a: makeActor(id, r), x: dir > 0 ? -90 * U : W + 90 * U, y0: rnd(0.25, 0.6) * H, y: 0, dir: dir, t: 0, hop: 0, pal: pal, met: false };
      }
      return;
    }
    const v = visitor, a = v.a;
    v.t += dt; v.x += v.dir * 62 * U * dt;
    if (v.pal && creatures.indexOf(v.pal) >= 0) {
      v.y0 += (v.pal.y - v.y0) * Math.min(1, dt * 0.6);
      if (!v.met && Math.hypot(v.pal.x - v.x, v.pal.y - v.y) < 130 * U) { v.met = true; v.hop = 0.5; v.pal.wide = 0.6; v.pal.awake = 6; for (let i = 0; i < 3; i++) hearts.push({ x: (v.x + v.pal.x) / 2 + rnd(-24, 24) * U, y: v.y - rnd(20, 50) * U, t: rnd(0, 0.3) }); }
    }
    v.y = v.y0 + Math.sin(v.t * 1.3) * 18 * U;
    if (v.hop > 0) v.hop -= dt;
    a.face = v.hop > 0 ? 'wink' : (v.t % 3.2 < 0.14 ? 'blink' : 'idle');
    for (let i = 0; i < 4; i++) a.skirt[i] = 0.28 * Math.sin(v.t * 3.4 + i);
    a.hat = 0.12 * Math.sin(v.t * 2.6); a.wing += dt * 5; a.leg += dt * 5;
    if (Math.random() < dt * 1.6) bubble(v.x + v.dir * 26 * U, v.y - 8 * U, rnd(3, 7) * U);
    if (v.x < -130 * U || v.x > W + 130 * U) { visitor = null; visitT = rnd(40, 80); }
  }
  function drawVisitor(g) {
    if (!visitor) return;
    const v = visitor;
    g.save(); g.translate(v.x, v.y - (v.hop > 0 ? Math.sin(v.hop * 6) * 16 * U : 0)); g.rotate(Math.sin(v.t * 1.3 + 1) * 0.1);
    if (v.dir < 0) g.scale(-1, 1);
    ctx = g; drawActor(v.a); g.restore();
  }

  // ================= NGÀY ĐÊM (theo giờ thật của máy) =================
  // 7h–17h30 sáng hẳn · 17h30–19h tối dần · 19h–5h30 tối hẳn · 5h30–7h sáng dần (Nam chốt: tối hẳn 7pm).
  // Nút đèn: bật = sáng + cá dậy, tắt = tối + cá ngủ, giữ nguyên tới mốc 7h hoặc 19h kế tiếp, kể cả tắt game; hết mốc thì về theo giờ.
  // Mã pha có ngày: pha ngày của ngày n = 2n, pha đêm bắt đầu tối ngày n = 2n+1 (0h–6h59 vẫn thuộc đêm của hôm trước).
  let dark = 0, zT = 0, wantDark = 0, nightT = 0;
  const zs = [];
  function nightLevel(d) {
    const h = d.getHours() + d.getMinutes() / 60;
    if (h >= 7 && h < 17.5) return 0;
    if (h >= 17.5 && h < 19) return (h - 17.5) / 1.5;
    if (h >= 5.5 && h < 7) return 1 - (h - 5.5) / 1.5;
    return 1;
  }
  function phaseOf(d) { const h = d.getHours(), n = dayNo(d); return h >= 7 && h < 19 ? n * 2 : h >= 19 ? n * 2 + 1 : (n - 1) * 2 + 1; }
  function targetDark(d) { const L = save.lamp; return L && L.phase === phaseOf(d) ? (L.on ? 0 : 1) : nightLevel(d); }
  function lampUi() { $('lampBtn').classList.toggle('off', wantDark >= 0.5); }
  function refreshNight() {
    const d = new Date();
    if (save.lamp && save.lamp.phase !== phaseOf(d)) { save.lamp = null; metaSave('lamp', null); } // qua mốc 7h/19h: về theo giờ
    wantDark = targetDark(d); lampUi();
  }
  function stepNight(dt) {
    nightT -= dt;
    if (nightT <= 0) { nightT = 1; refreshNight(); }
    dark += clamp(wantDark - dark, -dt * 1.5, dt * 1.5);
    if (asleep()) {
      zT -= dt;
      if (zT <= 0 && creatures.length) { zT = rnd(1.2, 2.6); const c = creatures[Math.floor(Math.random() * creatures.length)]; if (c.awake <= 0 && c.move !== 'still' && c.move !== 'sway' && c.move !== 'drive') zs.push({ x: c.x + c.dw * 0.3, y: c.y - (GROUND[c.move] ? c.dh : c.dh * 0.5), t: 0 }); }
    }
    for (let i = zs.length - 1; i >= 0; i--) { const z = zs[i]; z.t += dt; z.y -= 22 * U * dt; z.x += Math.sin(z.t * 3) * 10 * U * dt; if (z.t > 1.6) zs.splice(i, 1); }
  }
  function asleep() { return dark > 0.6; }
  function drawNight(g) {
    if (dark <= 0.01) return;
    g.fillStyle = 'rgba(9,20,72,' + (0.66 * dark).toFixed(3) + ')'; g.fillRect(0, 0, W, H);
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5 * dark;
    const gr = g.createRadialGradient(W * 0.8, -40, 10, W * 0.8, -40, H * 0.75); gr.addColorStop(0, 'rgba(170,200,255,0.5)'); gr.addColorStop(1, 'rgba(170,200,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
    g.fillStyle = '#e0e7ff'; g.font = '900 ' + Math.round(22 * U) + 'px sans-serif'; g.textAlign = 'center';
    for (const z of zs) { g.globalAlpha = Math.min(1, 1.6 - z.t); g.fillText('z', z.x, z.y); } g.globalAlpha = 1;
  }

  // ================= CÁ ĐẺ CON =================
  // Mỗi BIRTH_DAYS ngày lịch tối đa 1 con nhỏ giống hệt con Bon vẽ (dùng chung ảnh), bơi theo bố mẹ; con nhỏ không đẻ tiếp, không lớn thêm.
  // Hồ từ BIRTH_CAP con trở lên thì ngừng đẻ. Lâu không mở thì mở lại cũng chỉ 1 con, không đuổi bù. Đồng hồ máy lùi → đặt lại mốc, không kẹt.
  let birthT = 60;
  function parentsOn(today) {
    return creatures.filter(function(c) { return !c.baby && c.K.baby && c.move !== 'still' && c.move !== 'sway' && (today - c.born >= 1 || c.born > today); }); // born > today: đồng hồ từng bị lùi
  }
  function makeBaby(p, today) { // dựng con nhỏ, chưa thả vào hồ
    const c = buildCreature(p.kind, p.st, p.move, BABY_SIZE);
    c.id = nextId(); c.picId = p.picId; c.baby = true; c.parent = p.id; c.born = today; c.awake = 20;
    return c;
  }
  function showBaby(c, p) {
    placeCreature(c, clamp(p.x + rnd(-60, 60) * U, c.dw, W - c.dw), GROUND[c.move] ? 0 : clamp(p.y + rnd(-40, 40) * U, surfaceY + c.dh, groundY - c.dh));
    for (let i = 0; i < 6; i++) hearts.push({ x: c.x + rnd(-34, 34) * U, y: c.y - rnd(0, 40) * U, t: rnd(0, 0.5) });
    for (let i = 0; i < 8; i++) bubble(c.x + rnd(-30, 30) * U, c.y, rnd(2, 6) * U);
    noise('ding');
    tip('A baby ' + (p.K.id === 'any' ? 'friend' : p.K.name.toLowerCase()) + ' was born!', 5);
  }
  let birthBusy = false;
  function birthCheck() {
    if (save.lastBirthDay === null || birthBusy) return;
    const today = dayNo(new Date());
    if (today < save.lastBirthDay) { save.lastBirthDay = today; metaSave('lastBirthDay', today); return; } // đồng hồ máy bị lùi: đặt lại mốc, không kẹt
    if (today - save.lastBirthDay < BIRTH_DAYS || creatures.length >= BIRTH_CAP) return;
    const list = parentsOn(today);
    if (!list.length) return;
    const p = list[Math.floor(Math.random() * list.length)], c = makeBaby(p, today);
    let born = false; birthBusy = true;
    dbRun(['pics', 'tank', 'meta'], function(t) { // đọc + quyết + ghi trong cùng 1 giao dịch: 2 cửa sổ cùng mở cũng không sinh trùng, ảnh bố mẹ chắc chắn còn
      born = false; // dbRun có thể thử lại lần 2
      const last = t.objectStore('meta').get('lastBirthDay'), all = t.objectStore('tank').getAll(), pic = t.objectStore('pics').count(p.picId);
      pic.onsuccess = function() {
        const live = all.result.filter(function(r) { return !r.album; }).length, here = all.result.some(function(r) { return r.id === p.id && !r.album; });
        if (typeof last.result !== 'number' || today - last.result < BIRTH_DAYS || live >= BIRTH_CAP || pic.result < 1 || !here) return;
        t.objectStore('tank').put(recOf(c)); t.objectStore('meta').put(today, 'lastBirthDay'); born = true;
        if (failBorn) { failBorn = false; t.abort(); db.transaction(['meta'], 'readwrite').objectStore('meta').put(today, 'lastBirthDay'); } // ?test: hỏng sau khi đã đặt cờ, cửa sổ khác kịp ghi mốc
      };
    }).then(function(ok) {
      birthBusy = false;
      if (ok && born) { save.lastBirthDay = today; showBaby(c, p); }
    });
  }


  // ================= VẼ HỒ =================
  function render() {
    const g = tg; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.drawImage(bg, 0, 0, W, H);
    // tia sáng từ trên xuống
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < (lowQ ? 0 : 5); i++) {
      const x = W * (0.1 + i * 0.21) + Math.sin(clock * 0.2 + i) * 30 * U, a = 0.32 + 0.22 * Math.sin(clock * 0.33 + i * 1.7);
      g.globalAlpha = a; g.save(); g.translate(x, -20); g.rotate(0.16); g.drawImage(rayImg, -70 * U, 0, (110 + i * 22) * U, H * 0.92); g.restore();
    }
    g.restore();
    for (const s of stones) g.drawImage(s.img, s.x - s.dw / 2, s.y - s.dh, s.dw, s.dh);
    const swayPlant = function(p) { g.save(); g.translate(p.x, p.y); DRAW.sway(g, p); g.restore(); };
    for (const p of plants) if (!p.front) { p.ph += 0; swayPlant(p); }
    for (const c of creatures) if (GROUND[c.move]) drawCreature(g, c);
    for (const c of creatures) if (!GROUND[c.move]) drawCreature(g, c);
    drawVisitor(g);
    for (const p of plants) if (p.front) swayPlant(p);
    for (const f of foods) { const s = 13 * U; g.drawImage(foodImg, f.x - s / 2, f.y - s / 2, s, s); }
    for (const b of bubbles) g.drawImage(bubbleImg, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    for (const h of hearts) { const s = 26 * U * (0.7 + h.t * 0.5); g.globalAlpha = 1 - h.t; g.drawImage(heartImg, h.x - s / 2, h.y - s / 2, s, s); g.globalAlpha = 1; }
    drawNight(g);
    if (removing) for (const c of creatures) { // chế độ xóa: dấu ✕ đỏ trên từng con
      const r = 15 * U, x = c.x + c.dw * 0.34, y = (GROUND[c.move] ? c.y - c.dh : c.y - c.dh * 0.5) + r * 0.4;
      g.fillStyle = '#ef4444'; g.strokeStyle = '#fff'; g.lineWidth = 3 * U; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.stroke();
      g.strokeStyle = '#fff'; g.lineWidth = 3.4 * U; g.beginPath(); g.moveTo(x - r * 0.42, y - r * 0.42); g.lineTo(x + r * 0.42, y + r * 0.42); g.moveTo(x + r * 0.42, y - r * 0.42); g.lineTo(x - r * 0.42, y + r * 0.42); g.stroke();
    }
    // mặt nước
    g.fillStyle = 'rgba(255,255,255,0.4)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, surfaceY);
    for (let x = 0; x <= W + 16; x += 16) g.lineTo(x, surfaceY + Math.sin(x / (46 * U) + clock * 1.3) * 3.5 * U + Math.sin(x / (19 * U) - clock * 1.9) * 1.6 * U);
    g.lineTo(W, 0); g.closePath(); g.fill();
  }

  // Khối chép nguyên từ number_memory.html (HÌNH 4 BABY + TIẾNG) — dựa vào ctx, TAU, save.mute.
  let ctx = null;
  const FROG_IMG = {}; let frogReady = false;
  (function() {
    const src = window.FROG_SPRITES || {}, keys = Object.keys(src); let left = keys.length;
    for (const k of keys) { const im = new Image(); im.onload = function() { if (--left === 0) frogReady = true; }; im.src = src[k]; FROG_IMG[k] = im; }
  })();
  const FROG_FRAME = 3.4, FROG_CAMZ = 0.15;
  const FRIEND_IMG = {}, FRIEND_META = {}, friendReady = {};
  (function() {
    const src = window.FRIEND_SPRITES || {};
    for (const id of Object.keys(src)) {
      FRIEND_IMG[id] = {}; FRIEND_META[id] = src[id].meta; friendReady[id] = false;
      const keys = Object.keys(src[id].img); let left = keys.length;
      for (const k of keys) { const im = new Image(); im.onload = function() { if (--left === 0) friendReady[id] = true; }; im.src = src[id].img[k]; FRIEND_IMG[id][k] = im; }
    }
  })();
  function is3D(id) { return id === 'froggy' ? frogReady : !!friendReady[id]; }
  function part(b, name, x, z, ang) {
    const im = FRIEND_IMG[b.id][name], m = FRIEND_META[b.id][name];

    showSay(kindId === 'any' ? 'Draw anything you want!' : 'Trace it, or draw your own!', 2400);
  }
  function paperXY(e) { const r = paper.getBoundingClientRect(); return [(e.clientX - r.left) * PW / r.width, (e.clientY - r.top) * PH / r.height]; }
  paper.addEventListener('pointerdown', function(e) {
    if (stroke) return;
    sfxUnlock();
    const p = paperXY(e);
    if (tool === 'fill') { const op = { t: 'fill', x: Math.round(p[0]), y: Math.round(p[1]), color: color }; ops.push(op); applyOp(op); refresh(); noise('pop'); saveDraft(); return; }
    if (tool === 'eye') { ops.push({ t: 'eye', x: Math.round(p[0]), y: Math.round(p[1]), r: 34 }); refresh(); noise('pop'); saveDraft(); return; }
    try { paper.setPointerCapture(e.pointerId); } catch (err) {}
    stroke = { id: e.pointerId, pts: [Math.round(p[0]), Math.round(p[1])], t: tool === 'eraser' ? 'erase' : 'stroke', color: color, size: tool === 'eraser' ? Math.max(30, brush * 1.6) : brush };
    liveStroke();
  });
  function liveStroke() { // nét bút hiện trên giấy, chốt vào lớp mực khi nhấc tay; tẩy thì xóa thẳng từng đoạn, KHÔNG dựng lại cả tranh (đo 232ms mỗi lần di ngón)
    if (stroke && stroke.t === 'erase') {
      const q = stroke.pts, n = q.length, seg = n >= 4 ? q.slice(n - 4) : q;
      strokeTo(inkG, seg, '#000', stroke.size, true); strokeTo(fillG, seg, '#000', stroke.size, true);
    }
    refresh();
    if (stroke && stroke.t === 'stroke') strokeTo(paperG, stroke.pts, stroke.color, stroke.size, false);
  }
  paper.addEventListener('pointermove', function(e) {
    if (!stroke || e.pointerId !== stroke.id) return;
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (list.length ? list : [e])) { const p = paperXY(ev); stroke.pts.push(Math.round(p[0]), Math.round(p[1])); if (stroke.t === 'erase') liveStroke(); }
    if (stroke.t === 'stroke') liveStroke();
  });
  function endStroke(e) {
    if (!stroke || (e && e.pointerId !== stroke.id)) return;
    const q = stroke.pts, n = q.length, done = stroke;
    if (done.t === 'stroke' && n > 40 && Math.hypot(q[0] - q[n - 2], q[1] - q[n - 1]) < 80) q.push(q[0], q[1]); // nét gần khép kín → tự nối, tô được
    delete done.id;
    stroke = null; ops.push(done);
    if (done.t === 'stroke') applyOp(done); // tẩy thì đã xóa xong từ lúc kéo
    refresh(); saveDraft();
  }
  let draftTimer = 0;
  function saveDraft() { // bản đang vẽ: tắt game giữa chừng, mở lại vẫn còn
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function() { metaSave('draft', ops.length ? { kind: curKind, ops: ops } : null); }, 250);
  }
  paper.addEventListener('pointerup', endStroke);
  paper.addEventListener('pointercancel', endStroke);
  function isBlank() { return !ops.length || ops[ops.length - 1].t === 'clear'; }
  $('undoBtn').addEventListener('click', function() { endStroke(); ops.pop(); replay(); refresh(); saveDraft(); });
  $('clearBtn').addEventListener('click', function() { endStroke(); if (!isBlank()) { const op = { t: 'clear' }; ops.push(op); applyOp(op); refresh(); saveDraft(); } }); // Clear là 1 thao tác: Undo lấy lại được
  $('studioBack').addEventListener('click', function() { endStroke(); closeStudio(); openPick(); });
  $('guideBtn').addEventListener('click', function() { const g = $('guide'); g.hidden = !g.hidden; this.textContent = g.hidden ? '🚫' : '👁'; });
  function closeStudio() { $('studio').hidden = true; studioOpen = false; if (tileQueue.length) setTimeout(paintTiles, 0); }
  function openPick() { $('pick').hidden = false; if (tileQueue.length) setTimeout(paintTiles, 0); }
  $('drawBtn').addEventListener('click', function() {
    sfxUnlock(); askPersist(); noise('click');
    if (creatures.length >= MAX_TANK) { tip('The tank is full! Move some to the album.', 5); return; }
    hideTip(); this.classList.remove('pulse'); openPick();
  });
  $('pickBack').addEventListener('click', function() { $('pick').hidden = true; });
  window.addEventListener('resize', function() { buildScene(); if (studioOpen) fitPaper(); });

  // ================= TA-DA =================
  let pv = null, pvMove = null, pvSt = null;
  $('doneBtn').addEventListener('click', function() {
    endStroke();
    const st = makeSticker();
    if (!st) { showSay('Draw something first!'); noise('click'); return; }
    noise('ding'); pvSt = st; pvMove = KIND[curKind].move;
    const avg = st.eyes.length ? st.eyes.reduce(function(s, e) { return s + e.u; }, 0) / st.eyes.length : 1;
    if (avg < 0.46 && pvMove && FACING[pvMove]) flipSticker(st); // có mắt bên trái → đầu bên trái → tự lật
    showTada();
  });
  function showTada() {
    const anyK = curKind === 'any', mv = pvMove || 'swim';
    $('tada').hidden = false;
    const M = $('moves'); M.hidden = !anyK; M.textContent = '';
    if (anyK) ANY_MOVES.forEach(function(m) {
      const b = document.createElement('button'); b.className = 'tool' + (m.id === mv ? ' on' : ''); b.textContent = m.label;
      b.addEventListener('click', function() { pvMove = m.id; showTada(); }); M.appendChild(b);
    });
    $('flipBtn').hidden = !FACING[mv];
    $('goBtn').textContent = mv === 'still' || mv === 'sway' ? 'Put it in!' : 'Let it swim!';
    pv = buildCreature(curKind, pvSt, mv); pv.turn = pv.dir = 1; pv.awake = 999;
  }
  $('flipBtn').addEventListener('click', function() { flipSticker(pvSt); noise('click'); showTada(); });
  $('redoBtn').addEventListener('click', function() { $('tada').hidden = true; pv = null; });
  $('goBtn').addEventListener('click', function() {
    const today = dayNo(new Date()), c = buildCreature(curKind, pvSt, pvMove || 'swim'), first = save.lastBirthDay === null;
    c.id = nextId(); c.picId = c.id; c.born = today; c.awake = 30; // đèn đang tắt: con mới vẫn thức một lúc cho Bon thấy nó bơi
    $('tada').hidden = true; closeStudio(); pv = null;
    if (GROUND[c.move]) { placeCreature(c, rnd(0.15, 0.8) * W, 0); splash(c.x, c.y - c.dh * 0.5); }
    else { c.dir = 1; placeCreature(c, W * 0.5, surfaceY + 10 * U); c.drop = 1.1; c.vy = 320 * U; splash(c.x, surfaceY + 24 * U); }
    const name = curKind === 'any' ? 'friend' : KIND[curKind].name.toLowerCase();
    tip('Your ' + name + ' loves the water!', 4);
    const png = pvSt.img.toDataURL('image/png'), thumb = makeThumb(pvSt.img, pvSt.eyes), id = c.picId, rec = recOf(c);
    picCache.set(id, { img: pvSt.img, thumb: thumb });
    ops = []; replay(); clearTimeout(draftTimer); // giấy trắng cho lần vẽ sau
    if (first) save.lastBirthDay = today;
    dbRun(['pics', 'thumbs', 'tank', 'meta'], function(t) { // trọn gói 1 giao dịch: hỏng thì nháp vẫn còn trên máy
      t.objectStore('pics').put(png, id); t.objectStore('thumbs').put(thumb, id); t.objectStore('tank').put(rec); t.objectStore('meta').delete('draft');
      if (first) t.objectStore('meta').put(today, 'lastBirthDay');
    });
  });
  function renderPreview(dt) {
    const cv = $('tadaCv'), d = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h || !pv) return;
    if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
    const k = Math.min(1, Math.min(w * 0.72 / pv.dw, h * 0.8 / pv.dh));
    if (pv.move === 'swim' || pv.move === 'eel') pv.ph += dt * 7; else if (pv.move === 'pulse') { pv.pt += dt / 2; pv.ph += dt * 2.6; } else pv.ph += dt * 3;
    pv.vx = 40; pv.vy = 0;
    g.save(); g.translate(w / 2, GROUND[pv.move] ? h * 0.92 : h / 2); g.scale(k, k); pv.x = 0; pv.y = 0; drawCreature(g, pv); g.restore();
    if (FACING[pv.move]) { const ax = w - 46 + Math.sin(clock * 5) * 6; g.fillStyle = '#b45309'; g.font = '900 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('➜', ax, 28); }
  }

  // ================= CHỈ ?test: con mẫu đi qua đúng đường Bon vẽ → sticker → thả (dùng cho test + hình ô trang chủ, không lưu) =================
  function seed(kindId, x, y, scale) {
    const c = onLayers(spareL, function() {
      const a = Art(4); ART[kindId](a); replay(a.ops);
      const st = makeSticker(a.ops); if (!st) return null;
      const k = buildCreature(kindId, st, null, scale); k.id = nextId(); k.picId = k.id; return k;
    });
    if (c) placeCreature(c, x * W, y * H);
    return c;
  }
  function seedDemo() {
    const list = [['fish', 0.3, 0.26, 0.62], ['shark', 0.68, 0.17, 0.62], ['turtle', 0.46, 0.46, 0.6], ['ray', 0.2, 0.52, 0.6], ['octo', 0.8, 0.42, 0.6], ['jelly', 0.1, 0.24, 0.55],
                  ['horse', 0.56, 0.62, 0.7], ['crab', 0.3, 0, 0.7], ['snail', 0.52, 0, 0.7], ['star', 0.8, 0, 0.7], ['weed', 0.1, 0, 0.8], ['coral', 0.92, 0, 0.7], ['castle', 0.42, 0, 0.62]];
    for (const s of list) seed(s[0], s[1], s[2], s[3]);
  }

  // ================= VÒNG LẶP =================
  let last = performance.now(), clock = 0, lowQ = false, slowSum = 0, slowN = 0;
  function frame(now) {
    const raw = Math.max(0, (now - last) / 1000), dt = Math.min(0.05, raw); last = now; clock += dt;
    if (!lowQ && (!studioOpen)) { // máy yếu (trung bình >30ms/khung): tự bớt dải + tia sáng, chỉ hạ 1 lần
      slowSum += raw; slowN++;
      if (slowN >= 180) { if (slowSum / slowN > 0.03) { lowQ = true; for (const c of creatures) if (c.n > 1) c.n = Math.max(5, Math.ceil(c.n * 0.6)); } slowSum = 0; slowN = 0; }
    }
    tick(dt);
    requestAnimationFrame(frame);
  }
  function tick(dt) {
    if (tipT > 0) { tipT -= dt; if (tipT <= 0) hideTip(); }
    birthT -= dt; if (birthT <= 0) { birthT = 60; birthCheck(); }
    if (!studioOpen || !$('tada').hidden) { // đang ở xưởng vẽ (che kín màn) thì hồ đứng, đỡ tốn pin
      if (!removing) for (const c of creatures) stepCreature(c, asleep() && c.awake <= 0 ? dt * 0.2 : dt);
      for (const p of plants) p.ph += dt * 1.1;
      stepNight(dt); stepFx(dt); stepVisitor(dt); render();
    }
    if (pv) renderPreview(dt);
  }

  document.addEventListener('pointerdown', sfxUnlock, true);
  document.addEventListener('touchend', sfxUnlock, true); // iOS: mở khoá tiếng thêm ở touchend + click (game nhớ số từng câm khi chỉ mở ở pointerdown)
  document.addEventListener('click', sfxUnlock, true);
  document.addEventListener('keydown', sfxUnlock, true);
  $('muteBtn').addEventListener('click', function() { save.mute = !save.mute; this.textContent = save.mute ? '🔇' : '🔊'; metaSave('mute', save.mute); if (!save.mute) noise('click'); });
  document.addEventListener('visibilitychange', function() { if (!document.hidden) { refreshNight(); birthCheck(); } }); // app ngủ dậy không tải lại trang
  $('homeBtn').hidden = !HOME;
  $('homeBtn').addEventListener('click', function() { location.href = '../'; });

  async function boot() { // mở lên thấy hồ ngay; các con hiện ra ngay khi nạp xong
    buildScene(); refreshNight(); dark = wantDark;
    requestAnimationFrame(frame);
    if (await dbOpen()) {
      const m = await dbReadAll('tank');
      const mute = await dbRead('meta', 'mute'), lamp = await dbRead('meta', 'lamp'), last2 = await dbRead('meta', 'lastBirthDay'), draft = await dbRead('meta', 'draft');
      if (mute) { save.mute = true; $('muteBtn').textContent = '🔇'; }
      if (lamp) save.lamp = lamp;
      if (typeof last2 === 'number') save.lastBirthDay = last2;
      if (draft && draft.ops) { ops = draft.ops; if (KIND[draft.kind]) curKind = draft.kind; replay(); }
      for (const r of m.sort(function(a, b) { return a.id - b.id; })) {
        if (r.id > seq) seq = r.id;
        if (!KIND[r.kind] || !STEP[r.move]) continue;
        if (r.album) { album.push(r); continue; }
        const p = await picOf(r.picId);
        if (!p) continue; // bản ghi mất ảnh: bỏ qua, không làm hỏng cả hồ
        const c = fromRec(r, p.img);
        placeCreature(c, GROUND[c.move] ? clamp(r.x * W, c.dw / 2, W - c.dw / 2) : rnd(0.15, 0.85) * W, rnd(0.18, 0.7) * H, GROUND[c.move] ? r.yOff * H : undefined);
      }
    }
    refreshNight(); dark = wantDark;
    if (!creatures.length) { tip(album.length ? 'Tap Draw, or bring a friend back from the album!' : 'Draw your first fish!', 9999); $('drawBtn').classList.add('pulse'); }
    else tip(wantDark >= 0.5 ? 'Shh, they are sleeping. Tap 💡 to wake them!' : 'Tap the water to feed!', 5);
    birthCheck();
    booted = true;
  }
  let booted = false;

  if (TEST) {
    window.__g = {
      get: function() {
        return { n: creatures.length, album: album.length, kinds: creatures.map(function(c) { return c.kind + ':' + c.move; }), babies: creatures.filter(function(c) { return c.baby; }).length,
                 foods: foods.length, W: W, H: H, U: U, ops: ops.length, visitor: visitor ? visitor.a.id : null, dark: dark, want: wantDark, lamp: save.lamp, lastBirthDay: save.lastBirthDay,
                 removing: removing, lowQ: lowQ, booted: booted, notSaved: !$('notSaved').hidden, tip: $('tip').classList.contains('off') ? '' : $('tip').textContent, mute: save.mute };
      },
      creature: function(i) { const c = creatures[i]; return c ? { id: c.id, kind: c.kind, move: c.move, x: c.x, y: c.y, dw: c.dw, dh: c.dh, baby: c.baby, parent: c.parent, picId: c.picId, born: c.born, awake: c.awake, n: c.n, ground: !!GROUND[c.move], yOff: c.yOff } : null; },
      art: function(id, jit) { const a = Art(jit || 0); ART[id](a); ops = a.ops; replay(); refresh(); return ops.length; },
      sticker: function() { const s = makeSticker(); return s ? { w: s.img.width, h: s.img.height, png: s.img.toDataURL('image/png').length, eyes: s.eyes.length } : null; },
      paintAll: function() { while (tileQueue.length) paintTile(tileQueue.shift()); },
      seedOne: function(id, x, y) { return !!seed(id, x === undefined ? 0.5 : x, y === undefined ? 0.5 : y, 1); },
      seedDemo: seedDemo, kindsList: function() { return KINDS.map(function(k) { return k.id; }); },
      film: function(id, n, step) { // dải khung hình của ĐÚNG hàm vẽ thật
        const c = onLayers(spareL, function() { const a = Art(3); ART[id](a); replay(a.ops); return buildCreature(id, makeSticker(a.ops)); }); c.turn = c.dir = 1; c.vx = 40; c.vy = 0; c.x = 0; c.y = 0; c.rest = 0; c.awake = 99;
        const cw = 200, ch = 180, cv = mk(cw * n, ch), g = cv.getContext('2d'); g.fillStyle = '#4cc0d3'; g.fillRect(0, 0, cv.width, ch);
        const rate = { swim: 7, eel: 7, flap: 3.2, hover: 3, dart: 9, pulse: 2.6, walk: 16, crawl: 2.6, sway: 1.5, still: 0, drive: 3 }[c.move], k = Math.min(1, Math.min(cw * 0.86 / c.dw, ch * 0.84 / c.dh));
        for (let i = 0; i < n; i++) { g.save(); g.translate(cw * (i + 0.5), GROUND[c.move] ? ch * 0.94 : ch * 0.5); g.scale(k, k); drawCreature(g, c); g.restore(); c.ph += step * rate; c.pt += step / 2.6; }
        return cv.toDataURL('image/png');
      },
      pick: function(x, y) { const c = pickAt(x, y); return c ? c.kind : null; },
      place: function(i, x, y) { const c = creatures[i]; c.x = x; c.y = y; c.vx = c.vy = 0; c.tx = x; c.ty = y; c.wt = 99; if (GROUND[c.move]) c.yOff = y - groundAt(x); },
      z: function(i, z) { creatures[i].z = z; creatures.sort(function(a, b) { return a.z - b.z; }); },
      freeze: function() { for (const c of creatures) { c.wt = 9999; c.tx = c.x; c.ty = c.y; c.rest = 9999; } },
      setBorn: function(d) { for (const c of creatures) c.born = d; dbRun(['tank'], function(t) { for (const c of creatures) t.objectStore('tank').put(recOf(c)); }); },
      birthCheck: birthCheck, busy: function() { return birthBusy; }, refreshNight: refreshNight, dayNo: function(iso) { return dayNo(new Date(iso)); }, phaseOf: function(iso) { return phaseOf(new Date(iso)); }, nightLevel: function(iso) { return nightLevel(new Date(iso)); },
      snapDark: function() { dark = wantDark; }, asleep: asleep,
      dbOff: function() { dbOff = true; db = null; }, failNext: function(n) { failNext = n || 2; }, failBorn: function() { failBorn = true; },
      dbRaw: async function() { return { tank: (await dbReadAll('tank')).length, pics: (await dbReadAll('pics')).length, thumbs: (await dbReadAll('thumbs')).length, draft: !!(await dbRead('meta', 'draft')) }; },
      albumFill: function(n) { while (album.length < n) album.push({ id: 900000 + album.length, kind: 'fish', move: 'swim', picId: 900000 + album.length, baby: false, parent: 0, x: 0.5, yOff: 0, bw: 100, bh: 100, eyes: [], born: 0, album: true }); },
      paperSnap: function() { window.__snap = paper.getContext('2d').getImageData(0, 0, PW, PH).data; },
      paperDiff: function() { const d = paper.getContext('2d').getImageData(0, 0, PW, PH).data, s = window.__snap; let n = 0; for (let i = 3; i < d.length; i += 4) if (Math.abs(d[i] - s[i]) > 40) n++; return n; }, // số điểm ảnh đổi, so TỪNG điểm
      imgHeld: function(id) { const v = picCache.get(id); return !!(v && v.img); },
      dropPic: function(id) { return dbRun(['pics'], function(t) { t.objectStore('pics').delete(id); }); },
      homeBtnRect: function() { const b = $('homeBtn'); if (b.hidden) return null; const r = b.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; },
      tick: function(n, dt) { for (let i = 0; i < (n || 1); i++) tick(dt || 1 / 60); },
      eyesNow: function() { return eyesOf().length; },
      opsList: function() { return ops.map(function(o) { return o.t; }); },
      sprites: function() { return { frog: frogReady, chicken: !!friendReady.chicken, babyfrog: !!friendReady.babyfrog, pillow: !!friendReady.pillow }; },
      sfx: function() { return SFX.log.slice(); },
    };
  }

  boot();
})();
</script>
