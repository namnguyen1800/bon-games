<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bon's Maze</title>
<style>
@font-face{font-family:Fredoka;src:url(maze/fonts/fredoka-600.ttf);font-weight:600}
@font-face{font-family:Fredoka;src:url(maze/fonts/fredoka-700.ttf);font-weight:700}
html,body{margin:0;height:100%;background:#06070b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Fredoka,system-ui,sans-serif;color:#e8e6f0}
#wrap{position:fixed;inset:0;display:flex}
#stage{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{width:158px;flex:none;background:linear-gradient(#12141c,#0a0b10);border-left:1px solid #23263a;padding:calc(var(--ti, env(safe-area-inset-top)) + 8px) 8px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
:where(button){font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb{height:50px;border-radius:13px;border:2px solid #2a2e43;background:#161926;color:#cfd2e3;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;position:relative}
.tb .ic{font-size:20px;line-height:1.1}
.tb.on{border-color:#ffd24d;background:#2b2511;color:#fff;box-shadow:0 0 12px #ffd24d55}
.tb.row{flex-direction:row;gap:5px;height:44px}
.tb.row .ic{font-size:18px}
.tb.glow{border-color:#7dffa8;background:#13281b;color:#fff;box-shadow:0 0 14px #33c46a99;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 4px #33c46a55}}
.badge{position:absolute;top:-6px;right:-6px;background:#33c46a;color:#08130c;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px}
.num{height:34px;border-radius:50%;border:3px solid transparent;color:#111;font-size:16px;font-weight:700;padding:0}
.num.on{border-color:#fff;box-shadow:0 0 10px #fff9}
.sp{height:34px;border-radius:10px;border:2px solid #2a2e43;background:#161926;color:#cfd2e3;font-size:12px;font-weight:600;padding:0}
.sp.on{border-color:#7ee0a0;background:#13281b;color:#fff}
.lbl{font-size:10.5px;color:#8b8fa8;margin:1px 2px -3px;font-weight:600;letter-spacing:.5px}
.big{height:60px;border-radius:16px;border:none;font-size:22px;font-weight:700;color:#08130c;background:linear-gradient(#7dffa8,#33c46a);box-shadow:0 0 18px #33c46a66}
.big.edit{background:linear-gradient(#ffe08a,#e0a92e);color:#2a1d00;box-shadow:0 0 18px #e0a92e55}
.light{height:56px;border-radius:16px;border:2px solid #b8941f;background:#3a2f0c;color:#ffe9a8;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.light.off{border-color:#3a3f5c;background:#0b0c14;color:#9aa0c0}
.light .ic{font-size:24px}
.inv{min-height:40px;border-radius:12px;background:#0d0f16;border:1px dashed #2a2e43;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:4px;font-size:12px;color:#8b8fa8}
.hide{display:none!important}
#homeBtn{position:absolute;left:10px;top:calc(var(--ti, env(safe-area-inset-top)) + 10px);width:46px;height:46px;border-radius:50%;border:2px solid #b8941f;background:#3a2f0c;font-size:24px;z-index:9;padding:0}
#hint{position:absolute;left:64px;right:10px;top:calc(var(--ti, env(safe-area-inset-top)) + 14px);text-align:center;pointer-events:none;font-size:15px;color:#e5e7f2;text-shadow:0 2px 6px #000,0 0 3px #000;z-index:4}
.ov{position:absolute;inset:0;background:rgba(3,4,8,.78);display:flex;align-items:center;justify-content:center;z-index:8}
.card{background:linear-gradient(#171a27,#0e1018);border:2px solid #2d3150;border-radius:22px;padding:18px 20px;text-align:center;box-shadow:0 10px 40px #000;max-width:92%}
.card h2{margin:4px 0 12px;font-size:28px;letter-spacing:.5px}
.picks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pk{width:112px;height:132px;border-radius:18px;border:2px solid #2d3150;background:#10131d;color:#e8e6f0;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.pk canvas{width:84px;height:84px}
.row2{display:flex;gap:12px;justify-content:center;margin-top:14px}
.btn{min-width:150px;height:60px;border-radius:16px;border:none;font-size:20px;font-weight:700;padding:0 18px}
.b1{background:linear-gradient(#7dffa8,#33c46a);color:#08130c}
.b2{background:#232741;color:#e8e6f0}
.mi{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.tb .ic .mi{width:20px;height:20px;vertical-align:middle}
.libcard{width:min(780px,94%);max-height:90%;display:flex;flex-direction:column;box-sizing:border-box}
.libcard h2{margin-bottom:8px}
#lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;overflow-y:auto;padding:4px;min-height:80px}
.lv{background:#10131d;border:2px solid #2d3150;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lv.cur{border-color:#ffd24d}
.lvPlay{display:block;width:100%;padding:0;border:none;background:none;border-radius:10px;touch-action:manipulation}
.lvPlay canvas{width:100%;height:auto;aspect-ratio:320/224;border-radius:10px;display:block}
.lv .nm{font-size:14px;font-weight:600}
.lv .acts{display:flex;gap:8px}
.lv .acts button{width:48px;height:38px;border-radius:10px;border:2px solid #2a2e43;background:#161926;color:#e8e6f0;font-size:17px;padding:0}
.lvEmpty{grid-column:1/-1;color:#8b8fa8;font-size:16px;padding:22px 8px;line-height:1.5}
#ask{z-index:10}
#ask .row2{flex-wrap:wrap}
#dbg{position:absolute;left:6px;bottom:6px;z-index:7;pointer-events:none;font:10px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#9fe8ff;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px;white-space:pre}
#dbg.bad{color:#ffb0b0;background:rgba(90,0,0,.7)}
</style>

<meta name="robots" content="noindex, nofollow">
<script>
/* 11-23: mở từ icon ngoài màn hình chính (standalone) thì thanh giờ/pin của iPad đè lên hàng nút trên cùng
   -> --ti = bề cao thanh đó (tối thiểu 24px, vì có máy báo env() = 0); __topInset() = cùng số đó tính ra px cho game vẽ bằng canvas.
   Mở trong Safari / trên máy tính thì không cộng thêm gì. Chỉ có trong bản đưa lên mạng, file gốc chạy trên máy không bị đụng. */
(function () {
  var st = navigator.standalone === true || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  var ti = st ? 'max(env(safe-area-inset-top), 24px)' : 'env(safe-area-inset-top)';
  document.documentElement.style.setProperty('--ti', ti);
  window.__topInset = function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;height:' + ti;
    (document.body || document.documentElement).appendChild(d);
    var v = d.getBoundingClientRect().height || 0; d.parentNode.removeChild(d); return v;
  };
})();
</script>

<script>
(() => {
'use strict';
// ====================== hằng số ======================
let W = 2000, H = 1400;              // cỡ mê cung (to hơn màn hình, màn trượt theo); nút Bigger nới thêm
const MAXW = 3000, MAXH = 2100;
const HT = 6;                        // nửa bề dày tường
const PR = 18;                       // bán kính em bé
const SR = 14;                       // bán kính đầu rắn
const G = 10; let GW = W / G, GH = H / G;
const CLR = HT + PR - 3;             // ô lưới "đi được" khi cách tường >= CLR
const COLORS = { 1: '#ff4d5e', 2: '#4da3ff', 3: '#5dff8f', 4: '#ffd24d' };
const SPEEDS = { slow: 75, normal: 110, fast: 150 };
const PLAYER_SPEED = 165;
const FRIENDS = ['froggy', 'babyfrog', 'chicken', 'pillow'];
const FNAME = { froggy: 'Froggy', babyfrog: 'Baby Froggy', chicken: 'Chicken Banana', pillow: 'Gối chút chút' };
const STORE = 'bon_maze_mau_v2';      // "màn đang vẽ" (tự lưu như cũ)
const LV_KEY = 'bon_maze_levels_v1';  // danh sách màn đã bấm Save (khoá MỚI)
const TRIAL = false;                  // bản thử: bật dòng số ở góc màn. Đẩy vào Maze thật thì đổi thành false
const DEBUG_STRIP = TRIAL || /[?&]debug\b/.test(location.search);
const ITEM_TOOLS = ['start', 'exit', 'key', 'portal', 'snake', 'baby'];   // công cụ "chạm để đặt"; chạm vào món cùng loại thì nhấc lên dời
const DX =[1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
let dpr = 1, cssW = 0, cssH = 0;
const cam = { x: 0, y: 0, z: 1, fit: false };

// ====================== dữ liệu ======================
let maze = null;
let curLevelId = null, savedSig = '';   // màn đang vẽ đang gắn với màn nào trong danh sách Save (null = chưa), và "chữ ký" lúc Save/Mở gần nhất
let set = { dark: 'A', mute: {}, portalSnd: 'portal', snakePortal: true };
let tool = 'wall', num = 1, mode = 'draw';
const undoStack = [], undoMeta = [];
function setWorld(w, h) { W = w; H = h; GW = W / G; GH = H / G; bgDirty = true; }
function save() { try { localStorage.setItem(STORE, JSON.stringify({ maze, set, lv: curLevelId, sig: savedSig })); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.maze && s.maze.w) { maze = s.maze; maze.pending = maze.pending || []; curLevelId = s.lv != null ? s.lv : null; savedSig = typeof s.sig === 'string' ? s.sig : ''; return true; } } catch (e) {} // KHÔNG đọc lại `set` đã lưu: kiểu tối + tiếng đã chốt cứng (Nam chốt 11-23: đèn lồng, mọi tiếng bật, portal kiểu 1) — bản mẫu có ⚙ từng lưu lựa chọn cùng khoá này
  return false;
}
function pushUndo() { undoStack.push(JSON.stringify(maze)); undoMeta.push({ lv: curLevelId, sig: savedSig }); if (undoStack.length > 60) { undoStack.shift(); undoMeta.shift(); } }
// bỏ khoá tạm (vd. _warnT của cửa) khi lưu danh sách + so "đã Save chưa"
const noTemp = (k, v) => (k[0] === '_' ? undefined : v);
const cleanCopy = m => JSON.parse(JSON.stringify(m, noTemp));
const sigOf = m => JSON.stringify({ w: m.w, h: m.h, walls: m.walls, items: m.items, speed: m.speed, light: m.light, pending: m.pending }, noTemp);
const isDirty = () => !!(maze.walls.length || maze.items.length || maze.pending.length) && sigOf(maze) !== savedSig;
function emptyMaze(w, h) { return { w: w || 2000, h: h || 1400, walls: [], pending: [], items: [], speed: 'normal', light: 'off' }; }

function sampleMaze() {
  const k = 2, w = (x1, y1, x2, y2) => ({ ax: x1 * k, ay: y1 * k, bx: x2 * k, by: y2 * k });
  const P = (o) => Object.assign(o, { x: o.x * k, y: o.y * k }, o.x2 != null ? { x2: o.x2 * k, y2: o.y2 * k } : {});
  return {
    w: 2000, h: 1400, speed: 'normal', light: 'off', pending: [],
    walls: [
      w(250, 0, 250, 520), w(500, 180, 500, 700), w(500, 180, 1000, 180), w(750, 180, 750, 560),
      w(0, 300, 170, 300), w(250, 350, 420, 350), w(560, 470, 750, 470), w(330, 470, 330, 590),
      w(820, 90, 1000, 90), w(600, 90, 700, 90),
      w(80, 420, 250, 420), w(0, 560, 160, 560), w(330, 220, 500, 220), w(330, 100, 330, 220),
      w(420, 470, 420, 700), w(600, 260, 680, 260), w(600, 260, 600, 380), w(880, 260, 880, 470),
      w(820, 400, 1000, 400),
    ],
    items: [
      P({ t: 'start', x: 100, y: 640 }), P({ t: 'exit', x: 920, y: 640 }),
      P({ t: 'portal', x: 460, y: 640, n: 2 }), P({ t: 'portal', x: 625, y: 640, n: 2 }),
      P({ t: 'key', x: 660, y: 320, n: 1 }),
      P({ t: 'door', x: 750, y: 560, x2: 750, y2: 700, n: 1 }),
      P({ t: 'snake', x: 900, y: 135 }), P({ t: 'baby', x: 110, y: 90 }), P({ t: 'snake', x: 940, y: 320 }),
    ],
  };
}

// ====================== hình học ======================
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + t * dx, qy = ay + t * dy;
  return { d: Math.hypot(px - qx, py - qy), x: qx, y: qy };
}
function rdp(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1]; let md = 0, mi = 0;
  for (let i = 1; i < pts.length - 1; i++) { const d = segDist(pts[i].x, pts[i].y, a.x, a.y, b.x, b.y).d; if (d > md) { md = d; mi = i; } }
  if (md > eps) { const l = rdp(pts.slice(0, mi + 1), eps), r = rdp(pts.slice(mi), eps); return l.slice(0, -1).concat(r); }
  return [a, b];
}
const clampW = p => { p.x = Math.max(0, Math.min(W, p.x)); p.y = Math.max(0, Math.min(H, p.y)); return p; };
function strokeLen(raw) { let l = 0; for (let i = 1; i < raw.length; i++) l += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y); return l; }
function barsOf(m, openDoors) {
  const out = m.walls.map(s => ({ ax: s.ax, ay: s.ay, bx: s.bx, by: s.by, hw: HT }));
  m.items.forEach((it, i) => { if (it.t === 'door' && !(openDoors && openDoors.has(i))) out.push({ ax: it.x, ay: it.y, bx: it.x2, by: it.y2, hw: HT + 1, door: i, n: it.n }); });
  return out;
}
// nét tay → các đoạn thẳng: giản lược, bắt góc 0/45/90°. KHÔNG tự nối vào tường khác (Nam dặn 11-17).
function straighten(raw, single) {
  if (raw.length < 2 || strokeLen(raw) < 18) return null;
  const pts = single ? [raw[0], raw[raw.length - 1]] : rdp(raw, 16);
  const kept = [pts[0]];
  for (let i = 1; i < pts.length; i++) { const p = pts[i], q = kept[kept.length - 1]; if (Math.hypot(p.x - q.x, p.y - q.y) < 16 && i < pts.length - 1) continue; kept.push(p); }
  const res = [{ x: kept[0].x, y: kept[0].y }];
  for (let i = 1; i < kept.length; i++) {
    const p = kept[i - 1], q = kept[i];
    let ang = Math.atan2(q.y - p.y, q.x - p.x); const l = Math.hypot(q.x - p.x, q.y - p.y);
    const s = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4); if (Math.abs(ang - s) < 0.21) ang = s;
    const pr = res[res.length - 1]; res.push({ x: pr.x + Math.cos(ang) * l, y: pr.y + Math.sin(ang) * l });
  }
  return res.map(clampW);
}
function commitPending() {
  if (!maze.pending.length) return 0;
  pushUndo(); let n = 0;
  for (const raw of maze.pending) {
    const pts = straighten(raw); if (!pts) continue;
    for (let i = 1; i < pts.length; i++) { maze.walls.push({ ax: Math.round(pts[i - 1].x), ay: Math.round(pts[i - 1].y), bx: Math.round(pts[i].x), by: Math.round(pts[i].y) }); n++; }
    ghosts.push({ pts: raw, t0: performance.now() });
  }
  maze.pending = []; bgDirty = true; save(); play('snap', 0.6); refreshPanel();
  return n;
}

// ====================== lưới + dò đường ======================
function buildGrid(bars) {
  const g = new Uint8Array(GW * GH);
  for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
    const x = cx * G + G / 2, y = cy * G + G / 2;
    g[cy * GW + cx] = (x < CLR || y < CLR || x > W - CLR || y > H - CLR) ? 0 : 1;
  }
  for (const b of bars) {

const SFX = { ctx: null, buf: {}, log: [], master: null, loops: {} };

}

addEventListener('pointerdown', unlock, true); addEventListener('touchend', unlock, true); addEventListener('keydown', unlock, true);
// tiếng hét của từng em = đúng bộ Nam chọn bên Bon's Smash (11-16), kéo giọng theo em
const SCREAM_PITCH = { froggy: 0.85, chicken: 1.05, babyfrog: 1.3, pillow: 1.15 };
function soundSrc(key) {
  if (key.startsWith('scream_')) return ((window.SMASH_SOUNDS || {}).scream || {})[key.slice(7)];
  return (window.MAZE_SOUNDS || {})[key];
}
function scream(id, vol) { play('scream_' + id, vol == null ? 1 : vol, SCREAM_PITCH[id] || 1); }

}
function play(key, vol, rate, delay) {

    s.buffer = b; s.playbackRate.value = rate || 1; g.gain.value = vol == null ? 1 : vol;
    s.connect(g); g.connect(SFX.master); s.start(SFX.ctx.currentTime + (delay || 0));

}
function loopOn(key, vol) {

  decode(key, b => {
    if (!SFX.loops[key] || !SFX.loops[key].pending) return;
    const s = SFX.ctx.createBufferSource(), g = SFX.ctx.createGain();
    s.buffer = b; s.loop = true; g.gain.value = 0; g.gain.setTargetAtTime(vol, SFX.ctx.currentTime, 0.6);
    s.connect(g); g.connect(SFX.master); s.start(); SFX.loops[key] = { s, g };
  });
}

}
function allLoopsOff() { Object.keys(SFX.loops).forEach(loopOff); }

const FROG_IMG = {}, FRIEND_IMG = {}, FRIEND_META = {};
for (const k of Object.keys(window.FROG_SPRITES || {})) { const im = new Image(); im.src = FROG_SPRITES[k]; FROG_IMG[k] = im; }
for (const id of Object.keys(window.FRIEND_SPRITES || {})) {
  FRIEND_IMG[id] = {}; FRIEND_META[id] = FRIEND_SPRITES[id].meta;
  for (const k of Object.keys(FRIEND_SPRITES[id].img)) { const im = new Image(); im.src = FRIEND_SPRITES[id].img[k]; FRIEND_IMG[id][k] = im; }
}
const ok = im => im && im.complete && im.naturalWidth > 0;
function part(c, id, name, x, z, ang, r) {
  const im = FRIEND_IMG[id][name], m = FRIEND_META[id][name]; if (!ok(im) || !m) return;
  const sz = m[0] * r; c.save(); c.translate(x * r, -z * r); if (ang) c.rotate(ang);
  c.drawImage(im, m[1] * r - sz / 2, -m[2] * r - sz / 2, sz, sz); c.restore();
}
const PILLOW_POSE = { ouch: ['tense', 0.78, 1.2], idle: ['idle', 1, 1], blink: ['idle', 1, 1], panic: ['tense', 0.78, 1.2] };
function drawFriendAt(c, id, face, r, wob) {
  if (id === 'froggy') { const im = FROG_IMG[face] || FROG_IMG.idle; if (!ok(im)) return; const sz = 3.4 * r; c.drawImage(im, -sz / 2, -sz / 2 - 0.15 * r, sz, sz); }

    c.save(); c.translate(0, 0.55 * r);
    petals.forEach((b, i) => part(c, id, i === 1 || i === 2 ? 'petalA' : 'petalB', 0, 0, b - Math.PI / 2 + (wob || 0) * (i < 2 ? -0.3 : 0.3), r));
    c.restore(); part(c, id, 'hat', 0, 1.02 + Math.max(0, wob || 0) * 0.3, 0, r);

    part(c, id, 'cup', 0.02, -0.32, (wob || 0) * 0.3, r); part(c, id, 'crown', 0, 0.84 + Math.max(0, wob || 0) * 0.3, 0, r);
  } else {
    const [pose, kx, kz] = PILLOW_POSE[face] || PILLOW_POSE.idle;

let bg = null, bgDirty = true, bgK = 1;

    g.beginPath(); g.roundRect ? g.roundRect(x * S - ox + 2, y * S + 2, S - 4, S - 4, 6) : g.rect(x * S - ox + 2, y * S + 2, S - 4, S - 4); g.fill();

// phóng theo DIỆN TÍCH màn (không theo cạnh hẹp) → em bé to đều cả iPad ngang lẫn dọc
function baseZoom() { return Math.max(0.8, Math.min(1.6, Math.sqrt(cssW * cssH) / Math.sqrt(820 * 620))); }
function fitZoom() { return Math.min(cssW / W, cssH / H) * 0.97; }

  cam.y = vh >= H ? -(vh - H) / 2 : Math.max(0, Math.min(H - vh, cam.y));

function setZoom(z, keepX, keepY) {   // giữ điểm (keepX,keepY) đứng yên trên màn
  const sx = (keepX - cam.x) * cam.z, sy = (keepY - cam.y) * cam.z;

cv.addEventListener('pointermove', e => {

  const prev = ptrs.get(e.pointerId), s = screenPt(e); ptrs.set(e.pointerId, s);
  if (ptrs.size === 2 && mode === 'draw') { cam.x -= (s.x - prev.x) / 2 / cam.z; cam.y -= (s.y - prev.y) / 2 / cam.z; clampCam(); return; }
  const p = toWorld(e);
  dbgPoint(e, p);
  if (mode === 'draw') {
    if (panFrom) { cam.x -= (s.x - panFrom.x) / cam.z; cam.y -= (s.y - panFrom.y) / cam.z; clampCam(); panFrom = s; }
    else if (drag) moveDrag(p);
    else if (stroke) { const l = stroke[stroke.length - 1]; if (Math.hypot(l.x - p.x, l.y - p.y) > 3) stroke.push(p); }
    else if (tool === 'erase') eraseAt(p);
    else if (tapStart) ptrCur = p;
  } else if (joy) { joy.x = s.x / cam.z; joy.y = s.y / cam.z; joy.cx = s.x; joy.cy = s.y; }
});
function up(e) {
  if (!ptrs.has(e.pointerId)) return; const wasMulti = ptrs.size > 1; ptrs.delete(e.pointerId);
  if (wasMulti) return;
  const p = toWorld(e);
  if (mode === 'draw') {
    if (drag) endDrag();
    else if (stroke) finishStroke();
    else if (tapStart) placeAt(Math.hypot(p.x - tapStart.x, p.y - tapStart.y) < 20 ? tapStart : p);   // chạm = đặt tại chỗ chạm; kéo rồi nhấc = đặt tại chỗ nhấc (trước đây kéo xa hơn 20px thì KHÔNG đặt gì)
    tapStart = null; ptrCur = null; erasing = false; panFrom = null;
  }
  joy = null;
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { keysDown[e.key] = true; });
addEventListener('keyup', e => { keysDown[e.key] = false; });

// ====================== 💾 Save + danh sách màn đã Save (Nam 11-24) ======================
// "Màn đang vẽ" vẫn tự lưu như cũ (khoá STORE). Bấm Save thì chép màn đó vào DANH SÁCH riêng (khoá LV_KEY) để mốt mở lại chơi.
const MAZE_SVG = '<svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3z M9 3v8h6 M15 7v-4 M3 15h8v6 M15 15v6 M15 15h6"/></svg>';   // icon mê cung (không có emoji mê cung; 🗺️ đã là nút See all)
document.querySelectorAll('.mzico').forEach(el => { el.innerHTML = MAZE_SVG; });
function lvRead() { try { const s = JSON.parse(localStorage.getItem(LV_KEY) || 'null'); if (s && Array.isArray(s.items)) return s; } catch (e) {} return { v: 1, next: 1, items: [] }; }
function lvWrite(s) { try { localStorage.setItem(LV_KEY, JSON.stringify(s)); return true; } catch (e) { return false; } }
function saveLevel() {
  if (maze.pending.length) commitPending();          // nét chưa bấm Done → nắn luôn, giống nút Play
  if (!maze.walls.length && !maze.items.length) { setHint('Draw something first ✏️'); return false; }
  const s = lvRead(), snap = cleanCopy(maze); let l = curLevelId != null ? s.items.find(x => x.id === curLevelId) : null;
  if (l) { l.maze = snap; l.at = Date.now(); } else { l = { id: s.next, at: Date.now(), maze: snap }; s.items.push(l); s.next++; }
  if (!lvWrite(s)) { setHint('Could not save — no room left 😕', 4000); return false; }
  curLevelId = l.id; savedSig = sigOf(maze); save(); play('snap', 0.8); refreshPanel(); setHint('Saved! ✅ Maze ' + l.id, 3000);
  return true;
}
function drawThumb(cvs, m) {   // hình nhỏ của mê cung: tường + chấm màu cho từng món (không dùng hàm vẽ nặng)
  const g = cvs.getContext('2d'), w = cvs.width, h = cvs.height, k = Math.min(w / m.w, h / m.h), u = 1 / k;
  g.fillStyle = '#10131a'; g.fillRect(0, 0, w, h);
  g.save(); g.translate((w - m.w * k) / 2, (h - m.h * k) / 2); g.scale(k, k);
  g.fillStyle = '#1b1f2a'; g.fillRect(0, 0, m.w, m.h); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = '#8d96ad'; g.lineWidth = 2.6 * u; g.strokeRect(0, 0, m.w, m.h);
  g.beginPath(); for (const s of m.walls) { g.moveTo(s.ax, s.ay); g.lineTo(s.bx, s.by); } g.stroke();
  for (const it of m.items) {
    const c = COLORS[it.n] || '#fff';
    if (it.t === 'door') { g.strokeStyle = c; g.lineWidth = 4 * u; g.beginPath(); g.moveTo(it.x, it.y); g.lineTo(it.x2, it.y2); g.stroke(); continue; }
    g.beginPath(); g.arc(it.x, it.y, (it.t === 'portal' ? 6 : 5) * u, 0, 7);
    if (it.t === 'start') { g.strokeStyle = '#9fd8ff'; g.lineWidth = 2.4 * u; g.stroke(); }
    else if (it.t === 'portal') { g.strokeStyle = c; g.lineWidth = 2.6 * u; g.stroke(); }
    else { g.fillStyle = it.t === 'exit' ? '#5dffb0' : it.t === 'key' ? c : it.t === 'snake' ? '#6fd13a' : '#ff6a7a'; g.fill(); }
  }
  g.restore();
}
function askBox(msg, btns) {   // hộp hỏi nhỏ: mỗi nút = [chữ, kiểu nút (b1 xanh / b2 xám), việc làm]
  $('askMsg').textContent = msg; const box = $('askBtns'); box.innerHTML = '';
  btns.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.addEventListener('click', () => { $('ask').classList.add('hide'); fn(); }); box.appendChild(b); });
  $('ask').classList.remove('hide');
}
function showLib() {
  const s = lvRead(), grid = $('lvGrid'); grid.innerHTML = '';
  if (!s.items.length) { const d = document.createElement('div'); d.className = 'lvEmpty'; d.textContent = 'No saved mazes yet. Draw one, then tap 💾 Save!'; grid.appendChild(d); }
  s.items.forEach(l => {
    const card = document.createElement('div'); card.className = 'lv' + (l.id === curLevelId ? ' cur' : ''); card.dataset.id = l.id;
    const pb = document.createElement('button'); pb.className = 'lvPlay'; pb.setAttribute('aria-label', 'Play Maze ' + l.id);
    const c = document.createElement('canvas'); c.width = 320; c.height = 224; drawThumb(c, l.maze); pb.appendChild(c);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = 'Maze ' + l.id;
    const acts = document.createElement('div'); acts.className = 'acts';
    [['edit', '✏️'], ['del', '🗑']].forEach(([a, ic]) => { const b = document.createElement('button'); b.dataset.act = a; b.textContent = ic; b.setAttribute('aria-label', a === 'edit' ? 'Edit' : 'Delete'); acts.appendChild(b); });
    card.append(pb, nm, acts); grid.appendChild(card);
  });
  $('lib').classList.remove('hide');
}
const hideLib = () => $('lib').classList.add('hide');
function openLevel(id, thenPlay) {
  const l = lvRead().items.find(x => x.id === id); if (!l) return;
  pushUndo(); maze = cleanCopy(l.maze); maze.pending = maze.pending || []; setWorld(maze.w, maze.h);   // pushUndo trước → Undo trả lại bản đang vẽ
  curLevelId = id; savedSig = sigOf(maze); cam.fit = false; cam.z = baseZoom(); clampCam();
  const st = maze.items.find(i => i.t === 'start'); centerOn(st ? st.x : W / 2, st ? st.y : H / 2);
  save(); toDraw(); setHint('Opened Maze ' + id + ' (Undo brings your last drawing back)', 3500);
  if (thenPlay) tryPlay();
}
function requestOpen(id, thenPlay) {   // đang vẽ dở chưa Save thì hỏi trước khi thay bằng màn khác
  if (!isDirty()) { openLevel(id, thenPlay); return; }
  askBox('Save your drawing first?', [['💾 Save first', 'b1', () => { if (saveLevel()) openLevel(id, thenPlay); }], ['Open anyway', 'b2', () => openLevel(id, thenPlay)], ['Cancel', 'b2', () => {}]]);
}
function delLevel(id) {
  const s = lvRead(); s.items = s.items.filter(x => x.id !== id); lvWrite(s);
  if (curLevelId === id) { curLevelId = null; savedSig = ''; save(); }
  showLib();
}
$('saveBtn').addEventListener('click', saveLevel);
$('libBtn').addEventListener('click', showLib);
$('libClose').addEventListener('click', () => { hideLib(); if (mode === 'play' && game.over) $('end').classList.remove('hide'); });   // mở từ thẻ thắng/thua thì đóng xong hiện lại thẻ đó
$('lvGrid').addEventListener('click', e => {
  const b = e.target.closest('button'), card = b && b.closest('.lv'); if (!card) return; const id = +card.dataset.id;
  if (b.classList.contains('lvPlay')) { hideLib(); requestOpen(id, true); }
  else if (b.dataset.act === 'edit') { hideLib(); requestOpen(id, false); }
  else if (b.dataset.act === 'del') askBox('Delete Maze ' + id + '?', [['Keep it', 'b1', () => {}], ['🗑 Delete', 'b2', () => delLevel(id)]]);
});

// ====================== 🏠 về trang chủ ======================
// App mở từ icon iPad không có nút Back. Ẩn lúc đang chơi (cả màn hình là chỗ kéo ngón để chạy — chạm nhầm là văng ra), hiện lại ở màn vẽ / thắng / thua.
const HOME = location.protocol !== 'file:'; // mở file trên máy thì không có trang chủ → giấu (giống các game khác)
$('homeBtn').addEventListener('click', () => { location.href = '../'; });
function syncHome() { $('homeBtn').classList.toggle('hide', !HOME || (mode === 'play' && !game.over)); }

// ====================== vòng lặp ======================
const TEST = { auto: false, freeze: false };
function frame(now) {
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  if (mode === 'play' && P) updatePlay(dt, now);
  setHint(); syncHome(); if (DEBUG_STRIP && now - dbgT > 250) { dbgT = now; dbgShow(); } render(now);
  requestAnimationFrame(frame);
}
if (!load()) { maze = sampleMaze(); curLevelId = null; savedSig = sigOf(maze); save(); }   // mê cung mẫu lúc mở lần đầu = "sạch" (chưa ai đụng) → mở màn khác khỏi hỏi Save-trước
setWorld(maze.w, maze.h);
resize(); observeBox();
if (DEBUG_STRIP) $('dbg').classList.remove('hide');
if (TRIAL) document.title = "Bon's Maze (TEST)";
{ const st = maze.items.find(i => i.t === 'start'); if (st) centerOn(st.x, st.y); }
refreshPanel(); requestAnimationFrame(frame);

window.__mz = {
  TEST, get mode() { return mode; }, get maze() { return maze; }, get P() { return P; }, get chasers() { return chasers; },
  get keys() { return [...keys]; }, get openDoors() { return [...openDoors]; }, get over() { return !!game.over; }, get set() { return set; },
  get cam() { return { ...cam }; }, get size() { return { W, H }; }, get light() { return game.light; },
  sfx: () => SFX.log.slice(), wayOut: () => wayOut(maze),
  loadSample() { maze = sampleMaze(); curLevelId = null; savedSig = ''; setWorld(maze.w, maze.h); clampCam(); save(); toDraw(); },
  clear() { maze = emptyMaze(); curLevelId = null; savedSig = ''; setWorld(maze.w, maze.h); clampCam(); save(); refreshPanel(); },
  // thêm 11-24 (Save / dời món / khung đổi cỡ) — cho máy tự kiểm
  levels: () => lvRead().items.map(l => ({ id: l.id, walls: l.maze.walls.length, items: l.maze.items.length })),
  get cur() { return { lv: curLevelId, dirty: isDirty() }; }, saveLevel, openLevel: (id, play) => openLevel(id, !!play),
  stopObserve() { obsOn = false; if (boxRO) boxRO.disconnect(); },   // tắt người canh khung để thử riêng nhánh "đo lại lúc chạm"
  dbg: () => ({ ...DBG }), boxStale,
  setTool(t, n) { tool = t; if (n) num = n; refreshPanel(); }, start: f => startPlay(f || 'froggy'),
  lookAt(x, y) { centerOn(x, y); },
  worldToClient(x, y) { const r = cv.getBoundingClientRect(); return { x: r.left + (x - cam.x) * cam.z, y: r.top + (y - cam.y) * cam.z }; },
  hint: () => $('hint').textContent,
};
// hàm chung các game Bon đều có — home/check_site.py dùng để bấm 🏠 bằng chuột thật
window.__g = { homeBtnRect: () => { const b = $('homeBtn'); if (b.classList.contains('hide')) return null; const r = b.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; } };
})();
