<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Bon's Maze — mẫu thử</title>
<style>
@font-face{font-family:Fredoka;src:url(fonts/fredoka-600.ttf);font-weight:600}
@font-face{font-family:Fredoka;src:url(fonts/fredoka-700.ttf);font-weight:700}
html,body{margin:0;height:100%;background:#06070b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Fredoka,system-ui,sans-serif;color:#e8e6f0}
#wrap{position:fixed;inset:0;display:flex}
#stage{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{width:158px;flex:none;background:linear-gradient(#12141c,#0a0b10);border-left:1px solid #23263a;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
:where(button){font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb{height:58px;border-radius:14px;border:2px solid #2a2e43;background:#161926;color:#cfd2e3;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.tb .ic{font-size:23px;line-height:1.05}
.tb.on{border-color:#ffd24d;background:#2b2511;color:#fff;box-shadow:0 0 12px #ffd24d55}
.num{height:36px;border-radius:50%;border:3px solid transparent;color:#111;font-size:17px;font-weight:700;padding:0}
.num.on{border-color:#fff;box-shadow:0 0 10px #fff9}
.sp{height:36px;border-radius:10px;border:2px solid #2a2e43;background:#161926;color:#cfd2e3;font-size:12px;font-weight:600;padding:0}
.sp.on{border-color:#7ee0a0;background:#13281b;color:#fff}
.lbl{font-size:11px;color:#8b8fa8;margin:2px 2px -2px;font-weight:600;letter-spacing:.5px}
.big{height:66px;border-radius:16px;border:none;font-size:22px;font-weight:700;color:#08130c;background:linear-gradient(#7dffa8,#33c46a);box-shadow:0 0 18px #33c46a66}
.big.edit{background:linear-gradient(#ffe08a,#e0a92e);color:#2a1d00;box-shadow:0 0 18px #e0a92e55}
.inv{min-height:40px;border-radius:12px;background:#0d0f16;border:1px dashed #2a2e43;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:4px;font-size:12px;color:#8b8fa8}
.hide{display:none!important}
#gearBtn{position:absolute;left:10px;top:10px;width:46px;height:46px;border-radius:50%;border:2px solid #b8941f;background:#3a2f0c;color:#ffd24d;font-size:24px;z-index:5;padding:0}

.row{display:flex;gap:12px;justify-content:center;margin-top:14px}
.btn{min-width:150px;height:60px;border-radius:16px;border:none;font-size:20px;font-weight:700;padding:0 18px}
.b1{background:linear-gradient(#7dffa8,#33c46a);color:#08130c}
.b2{background:#232741;color:#e8e6f0}
#gear{position:absolute;left:10px;top:64px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:#fffbe9;color:#2a2410;border-radius:16px;padding:12px 14px;z-index:9;box-shadow:0 8px 30px #000a;font-family:system-ui,sans-serif;font-size:14px}

#gear .opt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="gearBtn" title="Mẫu: đổi kiểu">⚙</button>
    <div id="hint"></div>
    <div id="gear" class="hide"></div>
    <div id="pick" class="ov hide"><div class="card"><h2>Pick your baby!</h2><div class="picks" id="picks"></div></div></div>
    <div id="end" class="ov hide"><div class="card"><h2 id="endMsg"></h2><div class="row"><button class="btn b1" id="again">Try again</button><button class="btn b2" id="toEdit">Edit maze</button></div></div></div>
  </div>
  <div id="panel">
    <div class="sec" id="pDraw">
      <div class="g2">
        <button class="tb on" data-tool="wall"><span class="ic">✏️</span>Wall</button>
        <button class="tb" data-tool="erase"><span class="ic">🧽</span>Erase</button>
        <button class="tb" data-tool="start"><span class="ic">🚪</span>Start</button>
        <button class="tb" data-tool="exit"><span class="ic">🏁</span>Exit</button>
        <button class="tb" data-tool="key"><span class="ic">🔑</span>Key</button>
        <button class="tb" data-tool="door"><span class="ic">🔒</span>Door</button>
        <button class="tb" data-tool="portal"><span class="ic">🌀</span>Portal</button>
        <button class="tb" data-tool="snake"><span class="ic">🐍</span>Snake</button>
        <button class="tb" data-tool="baby"><span class="ic">🧸</span>Baby</button>
        <button class="tb" id="undo"><span class="ic">↶</span>Undo</button>
      </div>
      <div class="lbl">NUMBER</div>
      <div class="g4" id="nums"></div>
      <div class="lbl">CHASER SPEED</div>
      <div class="g3" id="speeds">
        <button class="sp" data-sp="slow">Slow</button><button class="sp" data-sp="normal">Normal</button><button class="sp" data-sp="fast">Fast</button>
      </div>
      <button class="big" id="playBtn">▶ Play</button>
      <button class="tb" id="clearBtn" style="height:44px;flex-direction:row;gap:6px"><span class="ic" style="font-size:18px">🗑</span>Clear all</button>
    </div>

      <button class="big edit" id="editBtn">✏️ Edit</button>
      <div class="lbl">KEYS</div>
      <div class="inv" id="inv">none yet</div>
      <button class="tb" id="restartBtn" style="height:50px;flex-direction:row;gap:6px"><span class="ic" style="font-size:20px">↺</span>Restart</button>
    </div>
  </div>
</div>
<script src="lib/froggy_sprites.js"></script>
<script src="lib/friend_sprites.js"></script>
<script src="lib/sounds.js"></script>
<script>
(() => {
'use strict';
// ====================== hằng số thế giới ======================
const W = 1000, H = 700;             // thế giới cố định, co giãn theo màn
const HT = 6;                        // nửa bề dày tường
const PR = 18;                       // bán kính em bé (ảnh chụp: 15 nhìn quá bé)
const SR = 14;                       // bán kính đầu rắn
const G = 10, GW = W / G, GH = H / G;// lưới dò đường
const CLR = HT + PR - 3;             // ô lưới "đi được" khi cách tường >= CLR
const SNAP = 46;                    // đầu nét cách tường < SNAP → khe hẹp hơn em bé → hít vào
const COLORS = { 1: '#ff4d5e', 2: '#4da3ff', 3: '#5dff8f', 4: '#ffd24d' };
const SPEEDS = { slow: 70, normal: 105, fast: 145 };
const PLAYER_SPEED = 150;
const FRIENDS = ['froggy', 'babyfrog', 'chicken', 'pillow'];
const FNAME = { froggy: 'Froggy', babyfrog: 'Baby Froggy', chicken: 'Chicken Banana', pillow: 'Gối chút chút' };
const STORE = 'bon_maze_mau_v1';
const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
let dpr = 1, scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;

// ====================== dữ liệu mê cung + cài đặt ======================
let maze = { walls: [], items: [], speed: 'normal' };
let set = { dark: 'A', mute: {}, portalSnd: 'portal', snakePortal: true, nextFriend: 0 };
let tool = 'wall', num = 1, mode = 'draw';
const undoStack = [];

function save() { try { localStorage.setItem(STORE, JSON.stringify({ maze, set })); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.maze) { maze = s.maze; Object.assign(set, s.set || {}); return true; } } catch (e) {}
  return false;
}
function pushUndo() { undoStack.push(JSON.stringify(maze)); if (undoStack.length > 60) undoStack.shift(); }

function sampleMaze() {
  const w = (x1, y1, x2, y2) => ({ ax: x1, ay: y1, bx: x2, by: y2 });
  return {
    speed: 'normal',
    walls: [
      w(250, 0, 250, 520), w(500, 180, 500, 700), w(500, 180, 1000, 180), w(750, 180, 750, 560),
      w(0, 300, 170, 300), w(250, 350, 420, 350), w(560, 470, 750, 470), w(330, 470, 330, 590),
      w(820, 90, 1000, 90), w(600, 90, 700, 90),
    ],
    items: [
      { t: 'start', x: 100, y: 620 }, { t: 'exit', x: 900, y: 620 },
      { t: 'portal', x: 420, y: 630, n: 2 }, { t: 'portal', x: 625, y: 630, n: 2 },
      { t: 'key', x: 625, y: 300, n: 1 },
      { t: 'door', x: 750, y: 560, x2: 750, y2: 700, n: 1 },
      { t: 'snake', x: 900, y: 135 }, { t: 'baby', x: 110, y: 90 },
    ],
  };
}

// ====================== hình học ======================
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + t * dx, qy = ay + t * dy;
  return { d: Math.hypot(px - qx, py - qy), x: qx, y: qy };
}
function rdp(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1]; let md = 0, mi = 0;
  for (let i = 1; i < pts.length - 1; i++) { const d = segDist(pts[i].x, pts[i].y, a.x, a.y, b.x, b.y).d; if (d > md) { md = d; mi = i; } }
  if (md > eps) { const l = rdp(pts.slice(0, mi + 1), eps), r = rdp(pts.slice(mi), eps); return l.slice(0, -1).concat(r); }
  return [a, b];
}
const clampW = p => { p.x = Math.max(0, Math.min(W, p.x)); p.y = Math.max(0, Math.min(H, p.y)); return p; };
function barsOf(m, openDoors) {
  const out = m.walls.map(s => ({ ax: s.ax, ay: s.ay, bx: s.bx, by: s.by, hw: HT }));
  m.items.forEach((it, i) => { if (it.t === 'door' && !(openDoors && openDoors.has(i))) out.push({ ax: it.x, ay: it.y, bx: it.x2, by: it.y2, hw: HT + 1, door: i, n: it.n }); });
  return out;
}
// đầu nét cách tường/biên < SNAP → hít vào (khe đó em bé vốn không lọt)
function snapEnd(p) {
  let best = null, bd = SNAP;
  for (const b of barsOf(maze)) { const r = segDist(p.x, p.y, b.ax, b.ay, b.bx, b.by); if (r.d < bd) { bd = r.d; best = r; } }
  const edges = [[p.x, 0, p.y], [p.x, H, H - p.y], [0, p.y, p.x], [W, p.y, W - p.x]];
  for (const [x, y, d] of edges) if (d < bd) { bd = d; best = { x, y }; }
  if (best) { p.x = best.x; p.y = best.y; return true; }
  return false;
}
// nét tay → các đoạn thẳng: giản lược, bắt góc 0/45/90°, hít đầu mút
function straighten(raw, single) {
  if (raw.length < 2) return null;
  let len = 0; for (let i = 1; i < raw.length; i++) len += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
  if (len < 18) return null;
  let pts = single ? [raw[0], raw[raw.length - 1]] : rdp(raw, 16);
  const kept = [pts[0]];
  for (let i = 1; i < pts.length; i++) { const p = pts[i], q = kept[kept.length - 1]; if (Math.hypot(p.x - q.x, p.y - q.y) < 16 && i < pts.length - 1) continue; kept.push(p); }
  const res = [{ x: kept[0].x, y: kept[0].y }];
  for (let i = 1; i < kept.length; i++) {
    const p = kept[i - 1], q = kept[i];
    let ang = Math.atan2(q.y - p.y, q.x - p.x); const l = Math.hypot(q.x - p.x, q.y - p.y);
    const s = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4); if (Math.abs(ang - s) < 0.21) ang = s;
    const pr = res[res.length - 1]; res.push({ x: pr.x + Math.cos(ang) * l, y: pr.y + Math.sin(ang) * l });
  }
  res.forEach(clampW);
  snapEnd(res[0]); snapEnd(res[res.length - 1]);
  return res;
}

// ====================== lưới + dò đường ======================
function buildGrid(bars) {
  const g = new Uint8Array(GW * GH);
  for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
    const x = cx * G + G / 2, y = cy * G + G / 2;
    g[cy * GW + cx] = (x < CLR || y < CLR || x > W - CLR || y > H - CLR) ? 0 : 1;
  }
  for (const b of bars) {
    const r = CLR + (b.hw - HT);
    const x0 = Math.max(0, Math.floor((Math.min(b.ax, b.bx) - r) / G)), x1 = Math.min(GW - 1, Math.floor((Math.max(b.ax, b.bx) + r) / G));
    const y0 = Math.max(0, Math.floor((Math.min(b.ay, b.by) - r) / G)), y1 = Math.min(GH - 1, Math.floor((Math.max(b.ay, b.by) + r) / G));
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++)
      if (segDist(cx * G + G / 2, cy * G + G / 2, b.ax, b.ay, b.bx, b.by).d < r) g[cy * GW + cx] = 0;
  }
  return g;
}
const cellOf = (x, y) => Math.max(0, Math.min(GH - 1, Math.floor(y / G))) * GW + Math.max(0, Math.min(GW - 1, Math.floor(x / G)));
const cx_ = c => (c % GW) * G + G / 2, cy_ = c => ((c / GW) | 0) * G + G / 2;
function seedCell(grid, x, y) {
  const c0 = cellOf(x, y); if (grid[c0]) return c0;
  let best = -1, bd = 1e9; const ccx = c0 % GW, ccy = (c0 / GW) | 0;
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    const nx = ccx + dx, ny = ccy + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    const c = ny * GW + nx; if (!grid[c]) continue; const d = Math.hypot(cx_(c) - x, cy_(c) - y); if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function portalPartner(m, idx) {
  const p = m.items[idx]; if (!p || p.t !== 'portal') return -1;
  const same = []; m.items.forEach((it, i) => { if (it.t === 'portal' && it.n === p.n) same.push(i); });
  if (same.length < 2) return -1;
  return same[(same.indexOf(idx) + 1) % same.length];
}
function portalLinks(m, grid) {
  const L = new Map();
  m.items.forEach((it, i) => {
    if (it.t !== 'portal') return; const pi = portalPartner(m, i); if (pi < 0) return;
    const to = seedCell(grid, m.items[pi].x, m.items[pi].y), from = seedCell(grid, it.x, it.y); if (to < 0 || from < 0) return;
    (L.get(from) || L.set(from, []).get(from)).push(to);
  });
  return L;
}
function field(grid, seeds, links) {
  const d = new Int32Array(GW * GH).fill(-1), q = new Int32Array(GW * GH); let h = 0, t = 0;
  for (const s of seeds) if (s >= 0 && grid[s] && d[s] < 0) { d[s] = 0; q[t++] = s; }
  // links đi CHIỀU NGƯỢC (tính khoảng cách tới đích) → đảo map
  let rev = null; if (links) { rev = new Map(); for (const [a, bs] of links) for (const b of bs) (rev.get(b) || rev.set(b, []).get(b)).push(a); }
  while (h < t) {
    const c = q[h++], ccx = c % GW, ccy = (c / GW) | 0;
    for (let k = 0; k < 8; k++) {
      const nx = ccx + DX[k], ny = ccy + DY[k]; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const n = ny * GW + nx; if (!grid[n] || d[n] >= 0) continue;
      if (k >= 4 && (!grid[ccy * GW + nx] || !grid[ny * GW + ccx])) continue;
      d[n] = d[c] + 1; q[t++] = n;
    }
    if (rev) { const L = rev.get(c); if (L) for (const n of L) if (grid[n] && d[n] < 0) { d[n] = d[c] + 1; q[t++] = n; } }
  }
  return d;
}
// kiểm có đường ra: đi từ Start, lượm chìa → mở cửa cùng số → lặp
function wayOut(m) {
  const st = m.items.find(i => i.t === 'start'), ex = m.items.find(i => i.t === 'exit');
  if (!st || !ex) return { ok: false, why: !st ? 'Put a Start first!' : 'Put an Exit first!' };
  const have = new Set();
  for (let it = 0; it < 8; it++) {
    const open = new Set(); m.items.forEach((x, i) => { if (x.t === 'door' && have.has(x.n)) open.add(i); });
    const grid = buildGrid(barsOf(m, open)), links = portalLinks(m, grid);
    // từ Start đi XUÔI → dùng links đảo chiều của field (field đảo sẵn) ⇒ truyền map đảo để thành xuôi
    const fwd = new Map(); for (const [a, bs] of links) for (const b of bs) (fwd.get(b) || fwd.set(b, []).get(b)).push(a);
    const d = field(grid, [seedCell(grid, st.x, st.y)], fwd);
    const at = it2 => { const c = seedCell(grid, it2.x, it2.y); return c >= 0 && d[c] >= 0; };
    if (at(ex)) return { ok: true };
    let changed = false;
    m.items.forEach(k => { if (k.t === 'key' && !have.has(k.n) && at(k)) { have.add(k.n); changed = true; } });
    if (!changed) break;
  }
  return { ok: false, why: 'No way out! 🤔' };
}

// ====================== tiếng ======================
const SFX = { ctx: null, buf: {}, log: [], master: null, loops: {} };
const AC = window.AudioContext || window.webkitAudioContext;
function audioInit() {
  if (SFX.ctx || !AC) return;
  try { SFX.ctx = new AC(); SFX.master = SFX.ctx.createGain(); SFX.master.gain.value = 0.9; SFX.master.connect(SFX.ctx.destination); } catch (e) { SFX.ctx = null; }
}
function unlock() { audioInit(); if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume(); }
addEventListener('pointerdown', unlock, true); addEventListener('touchend', unlock, true); addEventListener('keydown', unlock, true);
function decode(key, cb) {
  if (SFX.buf[key]) { cb(SFX.buf[key]); return; }
  const src = (window.MAZE_SOUNDS || {})[key]; if (!SFX.ctx || !src) return;
  const bin = atob(src.split(',')[1]), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  SFX.ctx.decodeAudioData(arr.buffer, b => { SFX.buf[key] = b; cb(b); }, () => SFX.log.push('decodeErr:' + key));
}
function play(key, vol, rate, delay) {
  SFX.log.push(key);
  if (set.mute[key] || !SFX.ctx) return;
  decode(key, b => {
    const s = SFX.ctx.createBufferSource(), g = SFX.ctx.createGain();
    s.buffer = b; s.playbackRate.value = rate || 1; g.gain.value = vol == null ? 1 : vol;
    s.connect(g); g.connect(SFX.master); s.start(SFX.ctx.currentTime + (delay || 0));
  });
}
function loopOn(key, vol) {

  for (const gh of ghosts) { ctx.save(); ctx.globalAlpha = 0.55 * (1 - (now - gh.t0) / 450); ctx.strokeStyle = '#cfe8ff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); gh.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore(); }
  maze.items.forEach((it, i) => {
    if (it.t === 'start') drawStart(ctx, it, t); else if (it.t === 'exit') drawExit(ctx, it, t);
    else if (it.t === 'portal') drawPortal(ctx, it, i, t); else if (it.t === 'door') drawDoor(ctx, it, i, t);
  });
  maze.items.forEach(it => { if (it.t === 'key') drawKey(ctx, it, t); });
  if (mode === 'draw') {
    maze.items.forEach(it => {
      if (it.t === 'snake') drawMarkerSnake(ctx, it, t);
      if (it.t === 'baby') { ctx.save(); ctx.translate(it.x, it.y); ctx.fillStyle = 'rgba(255,60,80,.25)'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill(); ctx.strokeStyle = '#ff6070'; ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🧸', 0, 1); ctx.restore(); }
    });
    if (stroke && stroke.length > 1) { ctx.save(); ctx.strokeStyle = tool === 'door' ? COLORS[num] : '#e8f4ff'; ctx.globalAlpha = 0.85; ctx.lineWidth = tool === 'door' ? 10 : 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10; ctx.beginPath(); stroke.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore(); }
    if (flashWhy && now - flashWhy < 900) { ctx.fillStyle = `rgba(255,60,80,${0.25 * (1 - (now - flashWhy) / 900)})`; ctx.fillRect(0, 0, W, H); }
  } else if (P) {
    for (const c of chasers) {
      if (c.kind === 'snake') { drawSnakeBody(ctx, snakePts(c), t, c.ang); snakeEyes(ctx, c.x, c.y, c.ang, false); }
      else drawChaserBaby(ctx, c, t);
    }
    drawPlayer(ctx, t);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); drawDarkness(ctx, t, now); ctx.restore();
    for (const f of fx) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
    if (joy) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 55, 0, 7); ctx.stroke();
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), k = l > 55 ? 55 / l : 1;
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(joy.sx + dx * k * scale, joy.sy + dy * k * scale, 18, 0, 7); ctx.fill();
    }
  }
}

// ====================== nhập ======================
let pid = null;
cv.addEventListener('pointerdown', e => {
  if (pid !== null) return; pid = e.pointerId; try { cv.setPointerCapture(pid); } catch (er) {}
  const p = toWorld(e);
  if (mode === 'draw') {
    if (tool === 'wall' || tool === 'door') stroke = [p];
    else if (tool === 'erase') { erasing = false; eraseAt(p); }
    else tapStart = p;
  } else if (mode === 'play' && !game.over) {
    const r = cv.getBoundingClientRect(); joy = { ox: p.x, oy: p.y, x: p.x, y: p.y, sx: e.clientX - r.left, sy: e.clientY - r.top };
  }
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== pid) return; const p = toWorld(e);
  if (mode === 'draw') {
    if (stroke) { const l = stroke[stroke.length - 1]; if (Math.hypot(l.x - p.x, l.y - p.y) > 3) stroke.push(p); }
    else if (tool === 'erase') eraseAt(p);
  } else if (joy) { joy.x = p.x; joy.y = p.y; }
});
function up(e) {
  if (e.pointerId !== pid) return; pid = null; const p = toWorld(e);
  if (mode === 'draw') {
    if (stroke) finishStroke();
    else if (tapStart && Math.hypot(p.x - tapStart.x, p.y - tapStart.y) < 20) placeAt(tapStart);
    tapStart = null; erasing = false;
  }
  joy = null;
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { keysDown[e.key] = true; });
addEventListener('keyup', e => { keysDown[e.key] = false; });

// ====================== ⚙ (chỉ trong mẫu — chữ Việt cho anh Nam) ======================
const SNDLIST = [['amb', 'Nhạc nền u u'], ['wind', 'Gió rít (kiểu B, C)'], ['heart', 'Tim đập khi rắn gần'], ['hiss', 'Rắn rít'], ['step', 'Tiếng bước chân'], ['key', 'Lượm chìa'], ['lock', 'Mở khoá'], ['creak', 'Cửa cót két'], ['portal', 'Portal kiểu 1'], ['portal2', 'Portal kiểu 2'], ['win', 'Thắng'], ['lose', 'Thua'], ['snap', 'Nét được nắn']];
function renderGear() {
  const g = $('gear');
  g.innerHTML = `<h3>Mẫu thử — đổi kiểu (anh xem rồi chọn)</h3>
  <div><b>Kiểu tối</b></div>
  <div class="opt" id="gDark">
    <button data-v="A">A · Đèn lồng (chỉ thấy quanh em bé)</button>
    <button data-v="B">B · Thấy cả mê cung, mờ + sương</button>
    <button data-v="C">C · Như B, lâu lâu tắt đèn</button></div>
  <div><b>Tiếng portal</b></div>
  <div class="opt" id="gPortal"><button data-v="portal">Kiểu 1 (vút phép)</button><button data-v="portal2">Kiểu 2 (xoáy gió)</button></div>
  <label><input type="checkbox" id="gSnakeP" ${set.snakePortal ? 'checked' : ''}> Rắn + các em đuổi đi qua portal được</label>
  <div style="margin-top:8px"><b>Tiếng</b> (bỏ tick = tắt; ▶ = nghe thử)</div>
  <div class="snd">${SNDLIST.map(([k, n]) => `<span>${n}</span><button data-play="${k}">▶</button><input type="checkbox" data-mute="${k}" ${set.mute[k] ? '' : 'checked'}>`).join('')}</div>
  <div class="opt"><button id="gSample">Nạp mê cung mẫu</button><button id="gClose">Đóng</button></div>
  <div class="note">• Bon vẽ tường bằng ngón → buông ra là nét tự thẳng. Đầu nét chỉ dính vào tường khi khe còn lại nhỏ hơn em bé (đằng nào cũng không lọt).<br>
  • Chìa giữ luôn sau khi mở cửa (mở được mọi cửa cùng số) — mình tự đặt.<br>
  • Kẻ đuổi đi theo đường ngắn nhất tới em bé, không xuyên tường; cửa còn khoá thì nó cũng không qua.<br>
  • Tim đập nhanh dần khi kẻ đuổi tới gần (tính theo đường đi, không theo đường chim bay).<br>
  • Tiếng: thu sẵn thật từ Mixkit. Rắn rít = "Monster hiss" (kho không có tiếng rắn thật).<br>
  • Máy tính: phím mũi tên cũng đi được.</div>`;
  const mark = () => { g.querySelectorAll('#gDark button').forEach(b => b.classList.toggle('on', b.dataset.v === set.dark)); g.querySelectorAll('#gPortal button').forEach(b => b.classList.toggle('on', b.dataset.v === set.portalSnd)); };
  mark();
  g.querySelector('#gDark').onclick = e => { const b = e.target.closest('button'); if (!b) return; set.dark = b.dataset.v; save(); mark(); if (mode === 'play') { if (set.dark !== 'A') loopOn('wind', 0.22); else loopOff('wind'); } };
  g.querySelector('#gPortal').onclick = e => { const b = e.target.closest('button'); if (!b) return; set.portalSnd = b.dataset.v; save(); mark(); unlock(); play(set.portalSnd, 0.9); };
  g.querySelector('#gSnakeP').onchange = e => { set.snakePortal = e.target.checked; save(); };
  g.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { unlock(); const k = b.dataset.play; const was = set.mute[k]; set.mute[k] = false; play(k, 0.9); set.mute[k] = was; });
  g.querySelectorAll('[data-mute]').forEach(b => b.onchange = () => { set.mute[b.dataset.mute] = !b.checked; if (!b.checked) loopOff(b.dataset.mute); save(); });
  g.querySelector('#gSample').onclick = () => { pushUndo(); maze = sampleMaze(); bgDirty = true; save(); toDraw(); g.classList.add('hide'); setHint('Sample maze loaded'); };
  g.querySelector('#gClose').onclick = () => g.classList.add('hide');
}
$('gearBtn').addEventListener('click', () => { const g = $('gear'); if (g.classList.contains('hide')) { renderGear(); g.classList.remove('hide'); } else g.classList.add('hide'); });

// ====================== vòng lặp ======================
const TEST = { auto: false, freeze: false };
function frame(now) {
  const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  if (mode === 'play' && P) updatePlay(dt, now);
  setHint();
  render(now);
  requestAnimationFrame(frame);
}
if (!load()) { maze = sampleMaze(); save(); }
resize(); refreshPanel(); requestAnimationFrame(frame);

// cửa cho máy tự kiểm (không ảnh hưởng người chơi)
window.__mz = {
  TEST, get mode() { return mode; }, get maze() { return maze; }, get P() { return P; }, get chasers() { return chasers; },
  get keys() { return [...keys]; }, get openDoors() { return [...openDoors]; }, get over() { return !!game.over; }, get set() { return set; },
  sfx: () => SFX.log.slice(), wayOut: () => wayOut(maze), loadSample() { maze = sampleMaze(); bgDirty = true; save(); toDraw(); },
  clear() { maze = { walls: [], items: [], speed: 'normal' }; bgDirty = true; save(); }, setTool(t, n) { tool = t; if (n) num = n; refreshPanel(); },
  start: f => startPlay(f || 'froggy'), worldToClient(x, y) { const r = cv.getBoundingClientRect(); return { x: r.left + offX + x * scale, y: r.top + offY + y * scale }; },
  hint: () => $('hint').textContent,
};
})();
