<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bon's Star Finder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #5bb3bd;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; font-family: -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  /* khung vẽ 3D: nằm DƯỚI khung 2D, chỉ phủ đúng màn chơi; mọi cú chạm vẫn vào khung 2D */
  #gl { position: fixed; left: 0; top: 0; display: none; pointer-events: none; }
  #c { position: relative; z-index: 1; }
</style>
<meta name="robots" content="noindex">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<!-- hình 4 baby dùng chung với game Flappy (Blender nặn → embed_sprites.py) -->
<script src="../star-finder/froggy3d/sprites.js"></script>
<script src="../star-finder/friends3d/sprites.js"></script>
<!-- tiếng kêu 4 baby (friends3d/build_sounds.py) -->
<script src="../star-finder/friends3d/sounds.js"></script>
<script>
(function(){
  'use strict';
  // Game 2 của Bon: 3 mode — BUILD (xếp món lên màn) · DRAW (vẽ nét đen làm tường/cầu) · PLAY (đi tới/lui, nhảy, lấy star).
  // Mỗi màn = đúng 1 khung (không cuộn), lưới ô 32px. Thanh trên = chọn mode; thanh DƯỚI = nút điều khiển / đồ nghề
  // (nằm ngoài màn chơi để ngón tay không che baby). Chữ trong game = tiếng Anh (trừ tên "Gối chút chút").
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const WW = 1024, WH = 768, BAR = 64, CELL = 32, COLS = 32, ROWS = 18;
  const LVB = BAR + ROWS * CELL; // đáy màn chơi = 640; từ đây xuống là thanh dưới
  // COLS = bề ngang 1 màn hình (ô). Màn chơi dài được: level.cols = 32..160 (tối đa 5 màn hình — mốc thử)
  const MAX_COLS = COLS * 5;
  const MAX_ROWS = ROWS * 3; // cao tối đa gấp ba màn hình (Nam chọn 11-14)
  const TEST = /[?&]test/.test(location.search);
  const HOME = location.protocol !== 'file:'; // nút 🏠 về trang chủ bon-games/ — mở file trên máy thì không có trang chủ → giấu
  const GRAV = 1800, MOVE = 230, ACC_G = 2400, ACC_A = 1500, JUMP = 660, SPRING_V = 1080, MAXFALL = 1100;
  const RC = 20, RV = 21, LW = 8, COYOTE = 0.1, JBUF = 0.12, DT = 1 / 120;
  // enemy (bạn khác của Bon đi tuần): tốc độ đi · cú hất lùi khi baby đụng vào (mốc thử, chỉnh sau khi Bon chơi)
  const ENEMY_V = 80, KNOCK_VX = 420, KNOCK_VY = 380;
  // enemy khôn (Đợt 2 — Nam chọn 11-14: con nào cũng khôn, đuổi CHẬM HƠN baby một chút):
  // thấy baby cùng tầng, trong 8 ô, không bị khối/nét vẽ che → nhún giật mình + rình SPOT_T giây → đuổi CHASE_V; mất dấu LOSE_T giây → đi tuần lại
  // hất baby xong → quay đi, CALM_T giây không đuổi (để Bon khỏi bị hất liên tục). Nhảy qua hố ≤ 3 ô, lên bậc / nét vẽ cao ≤ STEP_H.
  const CHASE_V = Math.round(MOVE * 0.85), SIGHT = 256, SPOT_T = 0.5, LOSE_T = 1.2, CALM_T = 1.5, STEP_H = 56, GAP_MAX = 104, SPOT_HOP = 260;
  // bơi (11-13, Nam: "everybody can swim"): số chép từ bản mẫu Nam đã chơi — chìm chậm · bơi ngang · Jump = quạt lên · sát mặt nước Jump = phóng khỏi nước
  const SWIM_GRAV = 320, SWIM_MAXFALL = 150, SWIM_MOVE = 150, SWIM_UP = 330, SWIM_EXIT = 560;
  const TAU = Math.PI * 2;

  const CHARS = [
    { id: 'froggy',   name: 'Froggy' },
    { id: 'chicken',  name: 'Chicken Banana' },
    { id: 'babyfrog', name: 'Baby Froggy' },
    { id: 'pillow',   name: 'Gối chút chút' },
  ];
  // khoảng từ tâm tới đáy / đỉnh hình (đơn vị r) — chép từ CHAR3D của flappy_bon_3d.html
  const CHAR3D = {
    froggy:   { bottom: 1.02, top: 1.22 },
    chicken:  { bottom: 1.35, top: 1.3 },
    babyfrog: { bottom: 1.1,  top: 1.15 },
    pillow:   { bottom: 0.8,  top: 0.8 },
  };

  // ================= MÓN ĐỒ =================
  // rw/rh = kéo dài ngang / dọc được trong Build · sq = chỉ to/nhỏ VUÔNG, tối đa sq ô (enemy: Nam chốt "kích thước" = cỡ con enemy, 11-02)
  const KINDS = {
    block:  { w: 2, h: 1, rw: true,  rh: true,  hz: false },
    spike:  { w: 3, h: 1, rw: true,  rh: false, hz: true, rot: true }, // rot: xoay 4 hướng trong Build (Đợt 2, Nam chọn 11-11)
    fire:   { w: 3, h: 1, rw: true,  rh: false, hz: true, rot: true },
    water:  { w: 4, h: 2, rw: true,  rh: true,  hz: false }, // nước không làm đau nữa: ai cũng bơi được
    spring: { w: 1, h: 1, rw: false, rh: false, hz: false },
    wing:   { w: 1, h: 1, rw: false, rh: false, hz: false },
    enemy:  { w: 1, h: 1, rw: true,  rh: true,  hz: false, sq: 3 },
    star:   { w: 1, h: 1, rw: false, rh: false, hz: false },
    start:  { w: 1, h: 1, rw: false, rh: false, hz: false },
  };
  const PALETTE = ['block', 'spike', 'fire', 'water', 'spring', 'wing', 'enemy', 'star', 'start'];

  // 3 màn mẫu — mỗi màn có ít nhất 1 lời giải (kiểm bằng tests/test_drawrun.py). Mỗi màn đúng 1 star (Nam chốt 10-27).
  const SAMPLES = [
    { name: 'Level 1', cols: 32, lines: [], objs: [
      { t: 'block', x: 0, y: 16, w: 12, h: 2 }, { t: 'spike', x: 12, y: 17, w: 6, h: 1 }, { t: 'block', x: 18, y: 16, w: 14, h: 2 }, // hố gai (trước 11-13 là hồ nước; Nam chọn đổi khi cho bơi)
      { t: 'start', x: 2, y: 15 }, { t: 'star', x: 27, y: 15 } ] },
    { name: 'Level 2', cols: 32, lines: [], objs: [
      { t: 'block', x: 0, y: 16, w: 32, h: 2 }, { t: 'spike', x: 10, y: 15, w: 6, h: 1 }, { t: 'spring', x: 21, y: 15 },
      { t: 'start', x: 2, y: 15 }, { t: 'star', x: 28, y: 15 } ] },
    { name: 'Level 3', cols: 32, lines: [], objs: [
      { t: 'block', x: 0, y: 16, w: 32, h: 2 }, { t: 'fire', x: 8, y: 15, w: 6, h: 1 },
      { t: 'block', x: 17, y: 9, w: 8, h: 1 }, { t: 'spike', x: 22, y: 8, w: 1, h: 1 },
      { t: 'start', x: 2, y: 15 }, { t: 'star', x: 29, y: 15 } ] },
  ];
  const N_MY = 6;
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  // hướng xoay của gai/lửa: o.rot 0 = mũi chĩa LÊN (như cũ) · 1 = sang PHẢI · 2 = XUỐNG · 3 = sang TRÁI. Không có o.rot = 0 (màn cũ đọc y nguyên).
  // Nằm dọc (1, 3) thì dải món dựng đứng: rộng 1 ô, kéo dài theo chiều cao.
  function rotOf(o) { return KINDS[o.t].rot ? ((o.rot | 0) & 3) : 0; }
  function isVert(o) { return (rotOf(o) & 1) === 1; }
  function canRW(o) { return isVert(o) ? false : KINDS[o.t].rw; }
  function canRH(o) { return isVert(o) ? true : KINDS[o.t].rh; }
  function norm(o) {
    const k = KINDS[o.t];
    if (k.rot) { const r = rotOf(o); if (r) o.rot = r; else delete o.rot; } else delete o.rot;
    if (!o.w) o.w = k.w; if (!o.h) o.h = k.h; if (!canRW(o)) o.w = 1; if (!canRH(o)) o.h = k.h;
    if (k.sq) o.w = o.h = clamp(Math.round(Math.max(o.w, o.h)), 1, k.sq);
    return o;
  }
  // chuẩn hoá 1 màn (kể cả màn lưu từ bản thử cũ): có cols, không còn mực, đúng 1 star — nhiều star thì giữ star xa nhất (star cuối đường)
  function normLevel(L) {
    L.cols = clamp(Math.round((L.cols || COLS) / COLS) * COLS, COLS, MAX_COLS);
    // Đợt 2 "lên cao" (Nam chọn tối đa gấp ba): rows = 18 / 36 / 54. Phần nới thêm nằm PHÍA TRÊN → ô ở đó có y ÂM (tới ROWS - rows); màn cũ không đổi số nào.
    L.rows = clamp(Math.round((L.rows || ROWS) / ROWS) * ROWS, ROWS, MAX_ROWS);
    delete L.ink;
    L.objs.forEach(norm);
    const stars = L.objs.filter(o => o.t === 'star');
    if (stars.length > 1) { const keep = stars.reduce((a, b) => (b.x > a.x ? b : a)); L.objs = L.objs.filter(o => o.t !== 'star' || o === keep); }
    return L;
  }
  function sampleLevel(i) { return normLevel(clone(SAMPLES[i])); }
  function blankLevel(n) {
    return { name: 'My level ' + n, cols: COLS, lines: [], objs: [
      { t: 'block', x: 0, y: 16, w: 32, h: 2 }, { t: 'start', x: 2, y: 15, w: 1, h: 1 }, { t: 'star', x: 28, y: 15, w: 1, h: 1 } ] };
  }
  function freshSlot(i) { return i === 0 ? normLevel(mockDemo()) : i < SAMPLES.length ? sampleLevel(i) : normLevel(blankLevel(i - SAMPLES.length + 1)); }
  function validLevel(L) {
    return L && Array.isArray(L.objs) && Array.isArray(L.lines) &&
      L.objs.every(o => o && KINDS[o.t] && isFinite(o.x) && isFinite(o.y)) && L.lines.every(a => Array.isArray(a));
  }

  // ================= LƯU TRÊN MÁY =================
  // Mỗi thay đổi lưu ngay (không có nút Save). Màn mẫu gốc nằm trong code → "Start over" luôn lấy lại được.
  const SAVE_KEY = 'bon_starfinder_mock_dot3';
  const NSLOT = SAMPLES.length + N_MY;
  // v3 (10-27): thêm cols, bỏ mực, 1 star/màn — đọc được save v1/v2 của bản thử, KHÔNG thay ô nào (màn đã xếp/sửa vẫn còn)
  let save = { v: 3, cur: 0, char: 'froggy', mute: false, picked: false, slots: [] };
  for (let i = 0; i < NSLOT; i++) save.slots.push(freshSlot(i));
  // Màn mẫu 1 đang lưu mà các món còn Y NGUYÊN như bản mẫu cũ (có hồ nước) → đổi theo bản mẫu mới (hố gai), giữ nét đã vẽ. Đã sửa món nào thì để yên.
  const OLD_L1 = '[["block",0,16,12,2],["water",12,16,6,2],["block",18,16,14,2],["start",2,15,1,1],["star",27,15,1,1]]';
  function upgradeLevel1(L) { if (JSON.stringify(L.objs.map(o => [o.t, o.x, o.y, o.w, o.h])) === OLD_L1) L.objs = sampleLevel(0).objs; }
  (function loadSave() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!s || !Array.isArray(s.slots)) return;
      for (let i = 0; i < NSLOT; i++) if (validLevel(s.slots[i])) save.slots[i] = normLevel(s.slots[i]);
      upgradeLevel1(save.slots[0]);
      if (CHARS.some(ch => ch.id === s.char)) save.char = s.char;
      save.cur = (s.cur >= 0 && s.cur < NSLOT) ? s.cur : 0;
      save.mute = !!s.mute; save.picked = !!s.picked;
      if (s.v !== 3) localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (e) {}
  })();
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  let askedPersist = false;
  function askPersist() { // xin trình duyệt đừng tự xoá dữ liệu (Safari không hứa, nhưng có báo là giúp được)
    if (askedPersist) return; askedPersist = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch (e) {}
  }
  let level = save.slots[save.cur];

  // ================= HÌNH 4 BABY (chép cách vẽ của flappy_bon_3d.html) =================
  const FROG_IMG = {}; let frogReady = false;
  (function() {
    const src = window.FROG_SPRITES || {}, keys = Object.keys(src); let left = keys.length;
    for (const k of keys) { const im = new Image(); im.onload = function() { if (--left === 0) frogReady = true; }; im.src = src[k]; FROG_IMG[k] = im; }
  })();
  const FROG_FRAME = 3.4, FROG_CAMZ = 0.15;
  const FRIEND_IMG = {}, FRIEND_META = {}, friendReady = {};
  (function() {
    const src = window.FRIEND_SPRITES || {};
    for (const id of Object.keys(src)) {
      FRIEND_IMG[id] = {}; FRIEND_META[id] = src[id].meta; friendReady[id] = false;
      const keys = Object.keys(src[id].img); let left = keys.length;
      for (const k of keys) { const im = new Image(); im.onload = function() { if (--left === 0) friendReady[id] = true; }; im.src = src[id].img[k]; FRIEND_IMG[id][k] = im; }
    }
  })();
  function is3D(id) { return id === 'froggy' ? frogReady : !!friendReady[id]; }
  function part(b, name, x, z, ang) {
    const im = FRIEND_IMG[b.id][name], m = FRIEND_META[b.id][name];
    if (!im || !m) return;
    const r = b.r, sz = m[0] * r;
    ctx.save(); ctx.translate(x * r, -z * r); if (ang) ctx.rotate(ang);
    ctx.drawImage(im, m[1] * r - sz / 2, -m[2] * r - sz / 2, sz, sz);
    ctx.restore();
  }
  function faceFrame(b) { return FRIEND_IMG[b.id][b.face] ? b.face : 'idle'; }
  function drawFrog(b) {
    const r = b.r, sz = FROG_FRAME * r, im = FROG_IMG[b.face] || FROG_IMG.idle;
    ctx.drawImage(im, -sz / 2, -sz / 2 - FROG_CAMZ * r, sz, sz);
  }
  function drawChicken(b) {
    const r = b.r, lift = Math.max(0, (b.skirt[0] + b.skirt[3]) / 2);
    for (let s = -1; s <= 1; s += 2) part(b, 'leg', s * 0.3, -0.9, Math.sin(b.leg + (s > 0 ? Math.PI : 0)) * 0.9 * (0.15 + lift));
    part(b, faceFrame(b), 0, 0, 0);
    const petals = [ { base: Math.PI / 2 - 0.95, side: -1 }, { base: Math.PI / 2 - 0.32, side: -1 },
                     { base: Math.PI / 2 + 0.32, side: 1 },  { base: Math.PI / 2 + 0.95, side: 1 } ];
    ctx.save(); ctx.translate(0, 0.55 * r);
    for (let i = 0; i < 4; i++) part(b, i === 1 || i === 2 ? 'petalA' : 'petalB', 0, 0, petals[i].base + petals[i].side * b.skirt[i] * 1.45 - Math.PI / 2);
    ctx.restore();
    part(b, 'hat', 0, 1.02 + b.hat * 0.55, -b.hat * 0.25);
  }
  function drawBabyFrog(b) {
    part(b, faceFrame(b), 0, 0, 0);
    part(b, 'cup', 0.02, -0.32, -b.skirt[0] * 0.55 + (b.skirt[1] - b.skirt[0]) * 0.8);
    const crown = Math.max(-0.15, b.hat);
    part(b, 'crown', 0, 0.84 + crown * 0.6, -crown * 0.3);
  }
  const PILLOW_POSE = { shock: ['tense', 0.78, 1.2], ouch: ['tense', 0.78, 1.2], panic: ['tense', 0.78, 1.2],
                        phew: ['sag', 1.16, 0.8], wink: ['sag', 1.16, 0.8], fall: ['puff', 1, 1] };
  function drawPillow(b) {
    const up = i => Math.max(0, b.skirt[i]);
    const lift = Math.max(0, (b.skirt[0] + b.skirt[3]) / 2);
    const P = (FRIEND_IMG.pillow && PILLOW_POSE[b.face] && FRIEND_IMG.pillow[PILLOW_POSE[b.face][0]]) ? PILLOW_POSE[b.face] : ['idle', 1, 1];
    const flap = Math.sin(b.wing) * 0.35 * (1 - Math.min(1, lift));
    const C = [['cornerTL', -1, 1, 0], ['cornerTR', 1, 1, 3], ['cornerBL', -1, -1, 1], ['cornerBR', 1, -1, 2]];
    for (const [name, sx, sz, i] of C) part(b, name, sx * 0.98 * P[1], sz * 0.56 * P[2], -sx * (flap * (sz > 0 ? 1 : 0.6) + up(i) * 0.9));
    part(b, P[0], 0, 0, 0);
  }
  const FALLBACK_COL = { froggy: '#5fb85a', chicken: '#f5f0e6', babyfrog: '#9bd68e', pillow: '#f7c6d9' };
  function drawActor(b) { // gốc toạ độ = tâm hình
    if (!is3D(b.id)) {
      ctx.fillStyle = FALLBACK_COL[b.id] || '#ccc'; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(b.r * 0.35, -b.r * 0.2, b.r * 0.12, 0, TAU); ctx.arc(-b.r * 0.1, -b.r * 0.2, b.r * 0.12, 0, TAU); ctx.fill();
      return;
    }
    if (b.id === 'froggy') drawFrog(b);
    else if (b.id === 'chicken') drawChicken(b);
    else if (b.id === 'babyfrog') drawBabyFrog(b);
    else drawPillow(b);
  }
  function makeActor(id, r) {
    return { id: id, r: r, face: 'idle', skirt: [0, 0, 0, 0], skirtV: [0, 0, 0, 0], hat: 0, hatV: 0, leg: 0, wing: 0 };
  }

  // ================= TIẾNG (chép khối SFX của Flappy, gọn lại) =================
  const SFX = { ctx: null, buf: {}, mouth: null, log: [] };
  (function loadSounds() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { SFX.ctx = new AC(); } catch (e) { return; }
    const src = window.FRIEND_SOUNDS || {};
    for (const id of Object.keys(src)) {
      SFX.buf[id] = {};
      for (const k of Object.keys(src[id])) decodeOne(id, k, null);
    }
  })();
  function decodeOne(id, k, cb) {
    const raw = window.FRIEND_SOUNDS && window.FRIEND_SOUNDS[id] && window.FRIEND_SOUNDS[id][k];
    if (!raw || !SFX.ctx) return;
    const bin = atob(raw.split(',')[1]), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    SFX.ctx.decodeAudioData(arr.buffer, function(buf) { SFX.buf[id][k] = buf; if (cb) cb(buf); },
      function(e) { SFX.log.push({ id: 'decodeErr', key: id + ':' + k }); });
  }
  function sfxUnlock() { if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume(); }
  function sfxNow() { return SFX.ctx ? SFX.ctx.currentTime : 0; }
  // dur = chỉ phát đoạn đầu (clip "scream" là 7 tiếng hét nối nhau — lấy 1 tiếng)
  function say(id, key, dur) {
    SFX.log.push({ id: id, key: key, t: performance.now() });
    if (!SFX.ctx || save.mute) return;
    const go = function(buf) {
      if (SFX.mouth) { try { SFX.mouth.stop(); } catch (e) {} }
      const s = SFX.ctx.createBufferSource(); s.buffer = buf; s.connect(SFX.ctx.destination);
      if (dur) s.start(0, 0, Math.min(dur, buf.duration)); else s.start();
      SFX.mouth = s;
    };
    if (SFX.buf[id] && SFX.buf[id][key]) go(SFX.buf[id][key]); else decodeOne(id, key, go);
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!SFX.ctx || save.mute) return;
    const t = sfxNow() + (delay || 0), o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(SFX.ctx.destination); o.start(t); o.stop(t + dur);
  }
  const NOISE = {
    jump:  () => tone(320, 0.1, 'triangle', 0.16, 520),
    ding:  () => { tone(880, 0.12, 'sine', 0.13); tone(1320, 0.22, 'sine', 0.09, 0, 0.06); },
    boing: () => { tone(180, 0.28, 'sine', 0.2, 620); tone(360, 0.2, 'triangle', 0.06, 900, 0.03); },
    win:   () => { tone(660, 0.2, 'triangle', 0.14); tone(880, 0.2, 'triangle', 0.14, 0, 0.13); tone(1100, 0.45, 'triangle', 0.14, 0, 0.26); },
    place: () => tone(520, 0.06, 'square', 0.05, 380),
    nope:  () => tone(220, 0.14, 'square', 0.05, 160),

          px = clamp(b.x, s.x, s.x + s.w); py = clamp(b.y, s.y, s.y + s.h); rad = R;
          if (px === b.x && py === b.y) { // tâm lọt hẳn vào khối → đẩy ra cạnh gần nhất
            const dl = b.x - s.x, dr = s.x + s.w - b.x, dtp = b.y - s.y, db = s.y + s.h - b.y, m = Math.min(dl, dr, dtp, db);
            if (m === dtp) { b.y = s.y - R; if (b.vy > 0) b.vy = 0; ground = [0, -1]; }
            else if (m === db) { b.y = s.y + s.h + R; if (b.vy < 0) b.vy = 0; }
            else if (m === dl) { b.x = s.x - R; if (b.vx > 0) b.vx = 0; }
            else { b.x = s.x + s.w + R; if (b.vx < 0) b.vx = 0; }

          }
        } else {
          const ex = s.bx - s.ax, ey = s.by - s.ay, L2 = ex * ex + ey * ey;
          const tt = L2 > 0 ? clamp(((b.x - s.ax) * ex + (b.y - s.ay) * ey) / L2, 0, 1) : 0;
          px = s.ax + ex * tt; py = s.ay + ey * tt; rad = R + LW / 2;
        }
        const dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy;
        if (d2 >= rad * rad) continue;
        const d = Math.sqrt(d2);
        const nx = d > 1e-4 ? dx / d : 0, ny = d > 1e-4 ? dy / d : -1;

        if (ny < -0.55 && (!ground || ny < ground[1])) { ground = [nx, ny]; onLine = s.k === 's'; }

  function ouch(kind) {
    const b = hero;
    b.ouchT = 0.75; ouches++; shakeT = 0.25;
    say(b.id, 'scream', 0.42); // "Ốp!" / "Ba!" / "Ah!" — 1 tiếng, không phải cả tràng
    fx('ouch', b.x, b.y, kind);
    const col = kind === 'water' ? '#7fd3ff' : kind === 'fire' ? '#ff9d3b' : '#ffffff';
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * TAU, sp = 80 + Math.random() * 160;
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 0.6, max: 0.6, col: col, size: 4 + Math.random() * 4, kind: 'dot', grav: 500 });
    }
  }
  function collect(i) {
    got.add(i); hero.winkT = 0.45; noise('ding');
    const s = starObjs[i], cx = (s.x + 0.5) * CELL, cy = BAR + (s.y + 0.5) * CELL;
    fx('star', cx, cy);
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * TAU;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, life: 0.5, max: 0.5, col: '#ffe066', size: 7, kind: 'star', grav: 0, rot: a, vr: 6 });
    }
    if (got.size === starObjs.length) {
      won = true; wonT = 0;
      praiseText = hero.rode ? 'Your bridge worked!' : hero.usedWing ? 'Nice flying!' : hero.usedSpring ? 'What a spring jump!' : hero.swam ? 'Great swimming!' : 'You found every star!';
      say(hero.id, 'pass1'); setTimeout(function() { noise('win'); }, 250);
    }
  }

  function physStep(dt) {
    const b = hero;
    if (b.ouchT > 0) { b.ouchT -= dt; if (b.ouchT <= 0) respawn(); return; }
    for (const e of enemies) enemyStep(e, dt);
    mockStep(dt);
    if (b.hurtT > 0) b.hurtT -= dt;
    if (b.knockT > 0) b.knockT -= dt;
    const wt = waterAt(b.x, b.y + 4);
    b.swim = !!wt;
    if (b.swim && !b.wasSwim) { b.swam = true; noise('splash'); fx('splash', b.x, wt.r.y, b.vy > 250 ? 'big' : ''); }
    b.wasSwim = b.swim;
    // đang bị hất lùi → nút đi tạm không ăn, để cú hất thấy rõ
    const dirIn = (won || b.knockT > 0) ? 0 : (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (dirIn) b.dir = dirIn;
    if (inp.jumpPressed) { inp.jumpPressed = false; if (!won) b.jbuf = JBUF; }
    if (b.jbuf > 0) b.jbuf -= dt;
    if (b.coyote > 0) b.coyote -= dt;
    if (b.swim) {
      b.vx = approach(b.vx, dirIn * SWIM_MOVE, 700 * dt);
      b.vy = Math.min(SWIM_MAXFALL, b.vy + SWIM_GRAV * dt);
      if (b.jbuf > 0) {
        b.jbuf = 0;
        if (b.y - wt.r.y < RC * 1.4) { b.vy = -SWIM_EXIT; b.flapT = 0.3; noise('splash'); fx('leap', b.x, wt.r.y); }
        else { b.vy = -SWIM_UP; b.flapT = 0.2; noise('swim'); fx('stroke', b.x, b.y); }
      }
      b.grounded = false; b.coyote = 0;
    } else if (b.grounded) {
      // đi DỌC theo mặt đang đứng (lên dốc/xuống dốc không nảy), ép nhẹ xuống mặt để khỏi lơ lửng
      const nx = b.gn[0], ny = b.gn[1], tx = -ny, ty = nx;
      const vt = approach(b.vx * tx + b.vy * ty, dirIn * MOVE, ACC_G * dt);
      b.vx = vt * tx - nx * 40; b.vy = vt * ty - ny * 40;
    } else {
      if (b.knockT <= 0) b.vx = approach(b.vx, dirIn * MOVE, ACC_A * dt);
      b.vy = Math.min(MAXFALL, b.vy + GRAV * dt);
    }
    // nhảy: bấm sớm một chút vẫn tính (jbuf), hụt mép rồi vẫn kịp nhảy (coyote)
    if (b.swim) { /* trong nước: nút Jump đã dùng để bơi ở trên */ }
    else if (b.jbuf > 0 && (b.grounded || b.coyote > 0)) {
      b.vy = -JUMP; b.jbuf = 0; b.coyote = 0; b.grounded = false; b.flapT = 0.3; noise('jump'); fx('jump', b.x, b.y + RC);
    } else if (b.jbuf > 0 && b.airJump) {
      // có cánh: đang trên trời bấm Jump = nhảy thêm 1 cú (Nam chọn "nhảy thêm 1 lần", 11-02); chạm đất mới có lại
      b.vy = -JUMP; b.jbuf = 0; b.airJump = false; b.flapT = 0.45; b.usedWing = true; noise('flap'); fx('flap', b.x, b.y);
      for (let i = 0; i < 8; i++) {
        const a = Math.PI * (0.15 + 0.7 * Math.random());
        particles.push({ x: b.x + (Math.random() - 0.5) * 24, y: b.y + 10, vx: Math.cos(a) * 90 * (Math.random() < 0.5 ? -1 : 1), vy: Math.sin(a) * 120,
          life: 0.55, max: 0.55, col: '#ffffff', size: 4 + Math.random() * 3, kind: 'dot', grav: 200 });
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < RC) { b.x = RC; if (b.vx < 0) b.vx = 0; }
    if (b.x > levelW() - RC) { b.x = levelW() - RC; if (b.vx > 0) b.vx = 0; }
    if (b.y < levelTop() + RC) { b.y = levelTop() + RC; if (b.vy < 0) b.vy = 0; }
    const wasG = b.grounded, impact = b.vy;
    const hit = collide(b);
    if (hit.ground) {

      if (!wasG && impact > 300) { b.landT = 0.16; fx('land', b.x, b.y + RC); }

    // hồ nào cũng có đáy: baby không chìm lọt ra ngoài đáy hồ (kể cả hồ nằm sát đáy màn, hồ lơ lửng)
    if (wt && b.x >= wt.r.x && b.x <= wt.r.x + wt.r.w && b.y > wt.r.y + wt.r.h - RC) { b.y = wt.r.y + wt.r.h - RC; if (b.vy > 0) b.vy = 0; }
    // lò xo: không cứng — chạm vào từ trên/ngang là bật lên
    for (const sp of springs) {
      if (circleRect(b.x, b.y, RC, sp.box) && b.y < sp.box.y + 6 && b.vy > -200) {
        b.vy = -SPRING_V; b.grounded = false; b.coyote = 0; b.usedSpring = true;
        anim.set(sp.o, 0.35); noise('boing'); fx('boing', b.x, b.y + RC);
      }
    }
    // đụng enemy → bị hất lùi ra xa nó (KHÔNG về Start, không tính thua — Nam chốt 10-27)
    if (b.hurtT <= 0 && !won) for (const e of enemies) {
      if (e.gone) continue;
      const dx = b.x - e.x, dy = b.y - e.y, rr2 = RC + e.rc - 4;
      if (dx * dx + dy * dy < rr2 * rr2) { bump(e, dx); break; }
    }
    for (const h of hazards) if (circleRect(b.x, b.y, RC - 2, h.hit)) { ouch(h.o.t); return; }
    if (b.y > LVB + 60) { ouch('fall'); return; }
    for (let i = 0; i < starObjs.length; i++) {
      if (got.has(i)) continue;
      const s = starObjs[i], cx = (s.x + 0.5) * CELL, cy = BAR + (s.y + 0.5) * CELL;
      if ((b.x - cx) * (b.x - cx) + (b.y - cy) * (b.y - cy) < (RC + 16) * (RC + 16)) { if (mockStarLocked()) mockLockedTouch(); else collect(i); }
    }
    for (let i = 0; i < wingObjs.length; i++) {
      if (gotWing.has(i)) continue;
      const s = wingObjs[i], cx = (s.x + 0.5) * CELL, cy = BAR + (s.y + 0.5) * CELL;
      if ((b.x - cx) * (b.x - cx) + (b.y - cy) * (b.y - cy) < (RC + 16) * (RC + 16)) pickWing(i);
    }
  }
  function bump(e, dx) {
    const b = hero, s = dx > 0.5 ? 1 : dx < -0.5 ? -1 : -b.dir;
    b.vx = s * KNOCK_VX; b.vy = -KNOCK_VY; b.grounded = false; b.coyote = 0; b.jbuf = 0;
    b.hurtT = 0.7; b.knockT = 0.3; bumps++; shakeT = 0.12; e.winkT = 0.5;
    e.mind = 'patrol'; e.calmT = CALM_T; e.sees = false; e.dir = e.x > b.x ? 1 : -1; // hất xong thì quay đi, một lúc không đuổi
    noise('bump'); say(b.id, 'dizzy', 0.8); fx('bump', b.x - s * RC * 0.8, b.y);
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
      particles.push({ x: b.x - s * RC * 0.8, y: b.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.45, max: 0.45, col: '#fde68a', size: 6, kind: 'star', grav: 0, rot: a, vr: 5 });
    }
  }
  function pickWing(i) {
    const b = hero, s = wingObjs[i], cx = (s.x + 0.5) * CELL, cy = BAR + (s.y + 0.5) * CELL;
    gotWing.add(i); b.hasWing = true; if (!b.grounded) b.airJump = true;
    noise('wing'); showHint('Tap Jump again in the air!'); fx('wing', cx, cy);
    for (let k = 0; k < 10; k++) {
      const a = k / 10 * TAU;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 0.5, max: 0.5, col: '#ffffff', size: 5, kind: 'dot', grav: 0 });
    }
  }

  function animHero(dt, playing) {
    const b = hero;
    b.blinkT -= dt; if (b.blinkT <= 0) { b.blinkOn = 0.13; b.blinkT = 1.8 + Math.random() * 2.5; }
    b.blinkOn -= dt; b.winkT -= dt; b.flapT -= dt; b.landT -= dt;
    const moving = playing && (b.grounded || b.swim) && Math.abs(b.vx) > 20 && b.ouchT <= 0;
    if (moving) b.leg += dt * 14;
    let tgt;
    if (!playing) tgt = Math.sin(clock * 2.2) * 0.03;
    else if (b.ouchT > 0) tgt = -0.15;
    else if (b.landT > 0) tgt = -0.16;
    else if (b.swim) tgt = Math.sin(clock * 4) * 0.04;
    else if (!b.grounded) tgt = b.vy < 0 ? 0.14 : -0.05;
    else tgt = moving ? Math.abs(Math.sin(b.leg)) * 0.07 : Math.sin(clock * 2.2) * 0.03;
    b.stV += ((tgt - b.st) * 180 - b.stV * 12) * dt; b.st += b.stV * dt;
    const fall = playing && !b.grounded && !b.swim && b.ouchT <= 0 ? clamp(b.vy / 700, -0.6, 1) : 0;
    for (let i = 0; i < 4; i++) {
      b.skirtV[i] += ((fall * (0.85 + 0.1 * i) - b.skirt[i]) * 260 - b.skirtV[i] * 14) * dt;
      b.skirt[i] += b.skirtV[i] * dt;
    }
    b.hatV += ((fall - b.hat) * 120 - b.hatV * 8) * dt; b.hat += b.hatV * dt;
    b.wing += dt * (playing && !b.grounded ? 16 : 3);
    b.tilt = approach(b.tilt, playing && b.ouchT <= 0 ? clamp(b.vx / MOVE, -1, 1) * 0.08 : 0, dt * 2);
    let f = b.blinkOn > 0 ? 'blink' : 'idle';
    if (playing) {
      if (b.ouchT > 0) f = 'ouch';
      else if (won) f = 'phew';
      else if (b.hurtT > 0.2) f = 'dizzy'; // vừa bị enemy hất (mặt choáng như gag "Dizzy~" bên Flappy)
      else if (b.winkT > 0) f = 'wink';
      else if (b.swim) { if (b.vy < -100) f = 'flap'; }
      else if (!b.grounded && b.vy < -150) f = 'flap';
      else if (!b.grounded && b.vy > 650) f = 'panic';
      else if (!b.grounded && b.vy > 250) f = 'fall';
    }
    b.face = f;
  }

  // ================= DRAW: vẽ nét =================
  // vẽ bao nhiêu cũng được (Nam bỏ giới hạn mực 10-27) — chỉ cấm đè gai/lửa/nước/chỗ xuất phát/ngoài mép
  function noDrawAt(x, y) {
    if (y < levelTop() + LW / 2 || y > LVB - LW / 2 || x < LW / 2 || x > levelW() - LW / 2) return 'edge';
    for (const z of noDraw) if (inRect(x, y, z.r, LW / 2 + 2)) return z.t;
    return null;
  }
  const NO_DRAW_MSG = { spike: "Can't draw on spikes!", fire: "Can't draw on fire!", water: "Can't draw on water!", start: 'Leave room for your baby!', edge: '' };
  function sayNo(why, x, y) { // x, y = toạ độ trong màn chơi; chữ báo hiện theo vị trí trên màn hình
    if (NO_DRAW_MSG[why]) { flash = { text: NO_DRAW_MSG[why], x: x - camX, y: y - camY, t: 1.2 }; noise('nope'); }
    if (why !== 'edge') for (const z of noDraw) if (z.t === why && inRect(x, y, z.r, 30)) anim.set(z, 0.5);
  }
  function beginStroke(x, y) {
    const why = noDrawAt(x, y);
    if (why) { sayNo(why, x, y); return false; }
    stroke = [x, y]; level.lines.push(stroke);
    return true;
  }
  function extendStroke(x, y) {
    if (!stroke) return;
    const lx = stroke[stroke.length - 2], ly = stroke[stroke.length - 1];
    const d = Math.hypot(x - lx, y - ly);
    if (d < 6) return;
    // dò dọc đoạn mới mỗi 3px — đụng chỗ cấm thì nét dừng ngay trước đó
    const n = Math.ceil(d / 3);

    for (let i = 1; i <= n; i++) {
      const px = lx + (x - lx) * i / n, py = ly + (y - ly) * i / n;
      const why = noDrawAt(px, py);
      if (why) {
        if (Math.hypot(sx - lx, sy - ly) >= 2) stroke.push(sx, sy);

    }

  }
  function endStroke() {
    if (!stroke) return;

      const x = stroke[0], y = stroke[1];
      if (!noDrawAt(x + 8, y)) stroke.push(x + 8, y);
      else level.lines.splice(level.lines.indexOf(stroke), 1);
    }
    stroke = null; rebuild(); persist();
  }

  // ================= BUILD: xếp món =================
  function snapshot() { return JSON.stringify({ objs: level.objs, cols: level.cols, rows: level.rows }); }
  function pushUndo(s) { undoStack.push(s); if (undoStack.length > 60) undoStack.shift(); }
  function objAt(x, y) {
    for (let i = level.objs.length - 1; i >= 0; i--) { const o = level.objs[i]; if (inRect(x, y, rectOf(o), 4)) return o; }
    return null;
  }
  function fitObj(o) { o.w = clamp(o.w, 1, level.cols); o.h = clamp(o.h, 1, level.rows); o.x = clamp(o.x, 0, level.cols - o.w); o.y = clamp(o.y, topRow(), ROWS - o.h); }
  // nút kéo-dài (góc dưới phải) và nút × (góc trên trái) — kẹp vào trong PHẦN ĐANG XEM để món sát mép vẫn bấm được
  function handlePos(o) { const r = rectOf(o); return { x: Math.min(r.x + r.w, levelW() - 16), y: Math.min(r.y + r.h, LVB + camY - 16) }; }
  function delPos(o) { const r = rectOf(o); return { x: Math.max(r.x, 16), y: Math.max(r.y, BAR + camY + 16) }; }
  function canDelete(o) { return o.t !== 'start' && o.t !== 'star'; } // màn nào cũng phải có chỗ xuất phát + 1 star
  // nút ↻ xoay (chỉ gai/lửa): lệch ra NGOÀI góc trên phải món → cách nút × và nút kéo-dài ≥ 50px, món 1 ô vẫn bấm trúng
  function rotPos(o) { const r = rectOf(o); return { x: Math.min(r.x + r.w + 20, levelW() - 16), y: Math.max(r.y - 20, BAR + camY + 16) }; }
  // xoay 1 nấc theo chiều kim đồng hồ: lên → phải → xuống → trái. Dải dài N ô nằm ngang thành dải N ô đứng (và ngược lại), giữ góc trên trái rồi kẹp vào màn.
  function rotateObj(o) {
    if (!KINDS[o.t].rot) return;

    if (r) o.rot = r; else delete o.rot;

    fitObj(o); afterEdit(); noise('click');
  }
  // nút "+ Map Expand": thêm 1 màn hình bên phải; khối chạm mép phải cũ kéo dài theo, không có đất ở đáy thì thêm đất
  function makeLonger() {
    if (level.cols >= MAX_COLS) return;
    pushUndo(snapshot());
    const old = level.cols; let floor = false;
    level.cols += COLS;
    for (const o of level.objs) if (o.t === 'block' && o.x + o.w === old) { o.w += COLS; if (o.y + o.h === ROWS) floor = true; }
    if (!floor) level.objs.push({ t: 'block', x: old, y: ROWS - 2, w: COLS, h: 2 });
    sel = null; afterEdit(); setCam(maxCam()); noise('place');
  }
  // nút ▲ cạnh "Map Expand": nới màn LÊN CAO thêm 1 màn hình (trời trống phía trên, Bon tự xây lên), tối đa gấp ba; màn hình cuộn lên phần mới
  function makeTaller() {
    if (level.rows >= MAX_ROWS) return;
    pushUndo(snapshot());
    level.rows += ROWS;
    sel = null; afterEdit(); setCamY(minCamY()); noise('place');
  }
  // Play: máy quay dọc giữ baby ở ~55% chiều cao màn chơi (màn 1 tầng thì luôn 0)
  function playCamY() { return hero.y - (BAR + (LVB - BAR) * 0.55); }
  function placeAt(x, y) {
    const k = KINDS[tool], before = snapshot();
    let gx = Math.floor(x / CELL), gy = Math.floor((y - BAR) / CELL);
    if (tool === 'start' || tool === 'star') { // chỉ có 1 → đặt cái mới = dời cái cũ
      const s = level.objs.find(o => o.t === tool);
      if (s) { s.x = gx; s.y = gy; fitObj(s); sel = s; pushUndo(before); afterEdit(); noise('place'); return; }
    }
    const o = { t: tool, x: gx, y: gy, w: k.w, h: k.h };
    fitObj(o); level.objs.push(o); sel = o; pushUndo(before); afterEdit(); noise('place');
    if (tool === 'enemy') showHint('Drag the blue dot to make it bigger');
  }
  function afterEdit() { rebuild(); respawn(); persist(); }
  function buildDown(id, x, y) {
    if (sel) {
      const dp = delPos(sel);
      if (canDelete(sel) && Math.hypot(x - dp.x, y - dp.y) < 22) {
        pushUndo(snapshot()); level.objs.splice(level.objs.indexOf(sel), 1); sel = null; afterEdit(); noise('click'); return;
      }
      if (KINDS[sel.t].rot) {
        const rp = rotPos(sel);
        if (Math.hypot(x - rp.x, y - rp.y) < 22) { rotateObj(sel); return; }

      if (Math.abs(b.x - B.sx) < 11 * CELL) { B.state = 'intro'; B.t = 0; showHint('The boss woke up! Hit it when it dives!'); tone(140, 0.5, 'sawtooth', 0.12, 70); shakeT = 0.3; }
      return;
    }
    if (B.state === 'intro') { if (B.t > 1.4) { B.state = 'fight'; B.phase = 'hover'; B.pt = 1.6; } return; }
    if (B.state === 'happy') { B.x = approach(B.x, B.hx, 120 * dt); B.y = approach(B.y, B.lowY - 30, 260 * dt); return; }
    B.pt -= dt;
    if (B.phase === 'hover') {
      const tx = clamp(clamp(b.x, B.sx - 9 * CELL, B.sx + 3 * CELL), MK_R, levelW() - MK_R);
      B.x = approach(B.x, tx, 150 * dt); B.y = approach(B.y, B.hy, 420 * dt);
      if (B.pt <= 0) { B.phase = 'warn'; B.pt = 0.8; tone(880, 0.1, 'square', 0.07); tone(880, 0.1, 'square', 0.07, 0, 0.25); } // báo trước rồi mới sà
    } else if (B.phase === 'warn') {
      if (B.pt <= 0) { B.phase = 'dive'; B.pt = B.diveT; B.hitThisDive = false; }
    } else {
      B.y = approach(B.y, B.lowY, 620 * dt);
      if (B.pt <= 0) {
        if (!B.hitThisDive && ++B.misses >= 2) { B.diveT = Math.min(3.6, B.diveT + 0.6); B.misses = 0; } // hụt 2 lần → lần sau sà thấp lâu hơn
        B.phase = 'hover'; B.pt = B.hp <= 2 ? 1.6 : 2.3;

    if (B.phase === 'dive' && b.hurtT <= 0 && !won) { const dx = b.x - B.x, dy = b.y - B.y; if (dx * dx + dy * dy < (MK_R + RC - 10) * (MK_R + RC - 10)) bump({ x: B.x }, dx); }

  function mockStep(dt) { // gọi trong physStep (mỗi 1/120 giây lúc Play)
    const b = hero;
    if (mk.cd > 0) mk.cd -= dt; if (mk.lockT > 0) mk.lockT -= dt; if (mk.noWeaponT > 0) mk.noWeaponT -= dt;
    for (const it of mkItems()) { // nhặt: chạm là cầm, đang cầm món khác thì đổi
      const cx = (it.x + 0.5) * CELL, cy = BAR + (it.y + 0.5) * CELL;
      if (mk.weapon !== it.t && (b.x - cx) * (b.x - cx) + (b.y - cy) * (b.y - cy) < (RC + 18) * (RC + 18)) {
        mk.weapon = it.t; noise('wing'); mkPuff(cx, cy, '#fde68a');
        showHint(it.t === 'gun' ? 'Fire gun! Hold Attack to shoot' : 'Rocks! Hold Attack to throw');
      }
    }
    let held = mk.keyAtk; ptrs.forEach(p => { if (p.role === 'attack') held = true; });
    if (held && !won) mkFire(); // giữ nút = đánh theo nhịp
    for (const s of mk.shots) {
      s.life -= dt; if (s.k === 'rock') s.vy += GRAV * 0.9 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < 0 || s.x > levelW() || s.y > LVB + 80) { s.life = 0; continue; }
      if (solidAt(s.x, s.y)) { s.life = 0; mkPuff(s.x, s.y, s.k === 'fire' ? '#fdba74' : '#cbd5e1'); continue; }
      let hitE = null;
      for (const e of enemies) { if (e.gone) continue; const r = e.rc + 12; if ((s.x - e.x) * (s.x - e.x) + (s.y - e.y) * (s.y - e.y) < r * r) { hitE = e; break; } }
      if (hitE) { s.life = 0; mkHitEnemy(hitE, s.vx >= 0 ? 1 : -1); continue; }

      if (B && B.state === 'fight' && B.hurtT <= 0 && (s.x - B.x) * (s.x - B.x) + (s.y - B.y) * (s.y - B.y) < (MK_R + 10) * (MK_R + 10)) { s.life = 0; mkHitBoss(s); }

  }
  // ---- vẽ ----
  function mkScr(x, y) { if (W3) { const p = W3.project(x, y); return [p[0] * WW, BAR + p[1] * (LVB - BAR)]; } return [x - camX, y - camY]; }
  function mkK(x, y) { const a = mkScr(x, y), b2 = mkScr(x + CELL, y); return Math.max(0.3, (b2[0] - a[0]) / CELL); }
  function mkIcon(t) { // vẽ quanh gốc toạ độ, cỡ ~1 ô

      ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.arc(14, -2, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(14, -2, 4, 0, TAU); ctx.fill();
    } else {
      ctx.lineWidth = 2; ctx.strokeStyle = '#64748b'; ctx.fillStyle = '#94a3b8';
      for (const q of [[-9, 6, 9], [8, 7, 8], [0, -5, 9]]) { ctx.beginPath(); ctx.arc(q[0], q[1], q[2], 0, TAU); ctx.fill(); ctx.stroke(); }
    }
  }
  function mkDrawBoss(B) {
    const P = mkScr(B.x, B.y), k = mkK(B.x, B.y), t = clock;
    const asleep = B.state === 'sleep', happy = B.state === 'happy', warn = B.state === 'fight' && B.phase === 'warn';
    if (B.state === 'fight' && B.phase !== 'hover') { // chỗ boss sắp sà xuống: vệt đỏ nhấp nháy dưới đất
      const G = mkScr(B.x, B.lowY + MK_R * 0.75);
      ctx.fillStyle = 'rgba(239,68,68,' + (0.25 + 0.2 * Math.sin(t * 18)) + ')'; ctx.beginPath(); ctx.ellipse(G[0], G[1], 60 * k, 12 * k, 0, 0, TAU); ctx.fill();
    }
    const jx = warn ? Math.sin(t * 60) * 4 : 0, jy = happy ? -Math.abs(Math.sin(t * 6)) * 16 : asleep ? Math.sin(t * 1.6) * 3 : 0;
    ctx.save(); ctx.translate(P[0] + jx, P[1] + jy); ctx.scale(k, k);
    ctx.fillStyle = B.hurtT > 0 ? '#fecaca' : happy ? '#ffffff' : asleep ? '#e2e8f0' : '#a8b3c4';
    for (const q of [[-36, 10, 30], [36, 10, 30], [-14, -14, 34], [18, -12, 32], [0, 16, 36]]) { ctx.beginPath(); ctx.arc(q[0], q[1], q[2], 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2.5; ctx.beginPath(); // vương miện
    ctx.moveTo(-22, -40); ctx.lineTo(-22, -64); ctx.lineTo(-11, -51); ctx.lineTo(0, -68); ctx.lineTo(11, -51); ctx.lineTo(22, -64); ctx.lineTo(22, -40); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineCap = 'round'; ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 4;
    if (asleep) {
      ctx.beginPath(); ctx.moveTo(-24, -4); ctx.lineTo(-8, -4); ctx.moveTo(8, -4); ctx.lineTo(24, -4); ctx.stroke();
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 16, 5, 0, TAU); ctx.fill();
      text('z', 46, -44 + Math.sin(t * 2) * 4, 22, '#475569'); text('Z', 62, -66 + Math.sin(t * 2 + 1) * 4, 30, '#475569');
    } else if (happy) {
      ctx.beginPath(); ctx.arc(-16, -2, 8, Math.PI, 0); ctx.moveTo(24, -2); ctx.arc(16, -2, 8, 0, Math.PI, true); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 10, 14, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      ctx.fillStyle = 'rgba(244,114,182,0.55)'; ctx.beginPath(); ctx.arc(-32, 10, 8, 0, TAU); ctx.arc(32, 10, 8, 0, TAU); ctx.fill();
      for (let i = 0; i < 5; i++) { const a = t * 2 + i * TAU / 5; text('★', Math.cos(a) * 82, Math.sin(a) * 60 - 6, 20, '#facc15'); }
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-16, -4, 10, 0, TAU); ctx.arc(16, -4, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(-14, -3, 5, 0, TAU); ctx.arc(14, -3, 5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(-6, -12); ctx.moveTo(30, -20); ctx.lineTo(6, -12); ctx.stroke(); // mày cau
      ctx.beginPath(); ctx.arc(0, 26, 12, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
      for (let i = 0; i < MK_HP; i++) text('♥', (i - (MK_HP - 1) / 2) * 24, -88, 24, i < B.hp ? '#ef4444' : '#cbd5e1');
      if (warn) text('!', 0, -122, 44, '#ef4444');
    }
    ctx.restore();
  }
  function mockDrawWorld() { // gọi trong render, trong khung cắt của màn chơi, toạ độ màn hình
    const t = clock;
    if (mode !== 'play') mk.boss = mkNewBoss(); // Build/Draw: boss ngủ luôn ở đúng chỗ theo star + công tắc hiện tại
    for (const it of mkItems()) {
      const cx = (it.x + 0.5) * CELL, cy = BAR + (it.y + 0.5) * CELL + (it.t === 'gun' ? Math.sin(t * 3) * 4 : 0);
      const P = mkScr(cx, cy), k = mkK(cx, cy), mine = mode === 'play' && mk.weapon === it.t;
      ctx.save(); ctx.translate(P[0], P[1]); ctx.scale(k * 1.15, k * 1.15); ctx.globalAlpha = mine ? 0.35 : 1;
      ctx.strokeStyle = 'rgba(251,146,60,0.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(t * 4) * 2, 0, TAU); ctx.stroke();
      mkIcon(it.t); ctx.restore();
    }
    const S = mkStar();
    if (S && mockStarLocked()) { // ổ khoá trên star
      const P = mkScr(S.x, S.y), k = mkK(S.x, S.y);
      ctx.save(); ctx.translate(P[0], P[1]); ctx.scale(k, k);
      ctx.lineWidth = 5; ctx.strokeStyle = '#475569'; ctx.beginPath(); ctx.arc(0, -6, 9, Math.PI, 0); ctx.stroke();
      rr(-13, -6, 26, 21, 5); ctx.fillStyle = '#64748b'; ctx.fill();
      ctx.fillStyle = '#f1f5f9'; ctx.beginPath(); ctx.arc(0, 3, 4, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (mk.boss) mkDrawBoss(mk.boss);
    for (const s of mk.shots) {
      const P = mkScr(s.x, s.y), k = mkK(s.x, s.y);
      if (s.k === 'fire') {
        const d = s.vx >= 0 ? -1 : 1;
        for (let i = 3; i >= 1; i--) { ctx.fillStyle = 'rgba(251,146,60,' + (0.5 - i * 0.13) + ')'; ctx.beginPath(); ctx.arc(P[0] + d * i * 11 * k, P[1], (12 - i * 2.5) * k, 0, TAU); ctx.fill(); }
        ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.arc(P[0], P[1], 12 * k, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(P[0], P[1], 6 * k, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = '#94a3b8'; ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P[0], P[1], 9 * k, 0, TAU); ctx.fill(); ctx.stroke();

      const P = mkScr(p.x, p.y), k = mkK(p.x, p.y), u = p.t / p.max;
      ctx.globalAlpha = 1 - u; ctx.strokeStyle = p.col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(P[0], P[1], (12 + (p.big ? 46 : 26) * u) * k, 0, TAU); ctx.stroke();
      if (p.big) for (let i = 0; i < 6; i++) { const a = i * TAU / 6; text('★', P[0] + Math.cos(a) * 54 * u * k, P[1] + Math.sin(a) * 54 * u * k, 18, '#fde047'); }
      ctx.globalAlpha = 1;
    }
    if (mode === 'build' && !overlay) { // nút mở bảng Rules: góc trên trái màn chơi
      button(10, BAR + 10, 136, 52, '#fffdf7', '#f59e0b', function() { overlay = 'rules'; sel = null; noise('click'); });
      ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#b45309'; ctx.beginPath();
      for (let i = 0; i < 3; i++) { ctx.moveTo(28, BAR + 26 + i * 10); ctx.lineTo(48, BAR + 26 + i * 10); }
      ctx.stroke();
      text('Rules', 96, BAR + 37, 22, '#b45309');
    }
  }
  function mockDrawAttack() { // nút thứ tư trên dải nút Play, ngay bên trái Jump
    const R = CTRL.attack; let on = mk.keyAtk; ptrs.forEach(p => { if (p.role === 'attack') on = true; });
    const has = !!mk.weapon;
    rr(R.x, R.y, R.w, R.h, 26); ctx.fillStyle = !has ? '#eef2f6' : on ? '#fdba74' : '#fff7ed'; ctx.fill();

  }
  function mockDrawRules() {
    panel(202, 130, 620, 470);
    text('Rules for this level', WW / 2, 180, 34, '#b45309'); closeX(782, 168);
    const on = !!level.bossStar;
    button(242, 222, 540, 96, on ? '#fef3c7' : '#ffffff', on ? '#f59e0b' : '#e2e8f0', function() { level.bossStar = !level.bossStar; persist(); noise('click'); }, 1);
    text('Boss guards the star', 266, 254, 24, '#334155', 'left');
    text(on ? 'Beat the boss first, then the star unlocks.' : 'No boss. Just grab the star.', 266, 288, 16, '#64748b', 'left', '600');
    rr(672, 248, 84, 44, 22); ctx.fillStyle = on ? '#22c55e' : '#cbd5e1'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(on ? 734 : 694, 270, 17, 0, TAU); ctx.fill();
    text('When a weapon hits an enemy:', 242, 356, 22, '#334155', 'left');
    const isKill = level.hitMode !== 'bounce';
    for (const o of [{ i: 0, id: 'kill', label: 'Kill', sub: 'The enemy is gone.' }, { i: 1, id: 'bounce', label: 'Bounce', sub: 'The enemy only bounces away.' }]) {
      const x = 242 + o.i * 280, pick = (o.id === 'kill') === isKill;
      button(x, 384, 260, 110, pick ? '#fef3c7' : '#ffffff', pick ? '#f59e0b' : '#e2e8f0', function() { level.hitMode = o.id; persist(); noise('click'); }, 1);
      rr(x + 18, 402, 40, 40, 8); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = pick ? '#16a34a' : '#94a3b8'; ctx.stroke();
      if (pick) { ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#16a34a'; ctx.beginPath(); ctx.moveTo(x + 26, 423); ctx.lineTo(x + 35, 432); ctx.lineTo(x + 51, 411); ctx.stroke(); }

  if (TEST) window.__mk = { s: function() { return mk; }, fire: mkFire, items: mkItems, scr: mkScr, ctrl: function() { return CTRL; },
    rules: function(boss, hit) { level.bossStar = !!boss; level.hitMode = hit; persist(); mockReset(); }, level: function() { return level; } };

  // ================= KIỂM THỬ (?test) — gọi vào CHÍNH code game, không chép lại logic =================
  if (TEST) {
    window.__g = {
      get: function() { return { mode: mode, overlay: overlay, slot: save.cur, char: hero.id, tool: tool, sel: sel ? clone(sel) : null,
        hero: { x: hero.x, y: hero.y, vx: hero.vx, vy: hero.vy, grounded: hero.grounded, ouchT: hero.ouchT, face: hero.face,

        got: got.size, total: starObjs.length, won: won, ouches: ouches, camX: camX, camY: camY, rows: level.rows, cols: level.cols, maxCam: maxCam(),

      ui: function() { return { pal: PALETTE.slice(), palUI: Object.assign({}, PAL_UI), reset: resetRect(), tall: Object.assign({}, TALL_UI), arw: JSON.parse(JSON.stringify(ARW)) }; },
      setCamY: setCamY, taller: makeTaller,

      setCam: setCam, longer: makeLonger,
      toScreenWorld: function(x, y) { const b = c.getBoundingClientRect(); return [b.left + OX + (x - camX) * SC, b.top + OY + (y - camY) * SC]; },

      hold: function(on) { testHold = !!on; },
      input: function(o) { if ('left' in o) keys.left = !!o.left; if ('right' in o) keys.right = !!o.right; syncHold(); if (o.jump) inp.jumpPressed = true; },
      step: function(n) { for (let i = 0; i < n; i++) physStep(DT); },
      // chạy tới khi thắng: ctl(state) trả về {left,right,jump} mỗi khung 1/120s
      run: function(ctlSrc, maxSteps) {
        const ctl = new Function('s', ctlSrc);
        for (let i = 0; i < maxSteps; i++) {
          const s = { x: hero.x, y: hero.y, vx: hero.vx, vy: hero.vy, g: hero.grounded, got: got.size, i: i, ouch: hero.ouchT > 0 };
          const o = ctl(s) || {};

      },

      sfx: function() { return SFX.log.slice(); },

      // hình 3D: đang bật không · vì sao chưa bật · số liệu của phần 3D · điểm (x, y) của game hiện ở đâu trên màn hình theo máy quay 3D

      w3project: function(x, y) { if (!W3) return null; const p = W3.project(x, y), b = glc.getBoundingClientRect(); return [b.left + p[0] * b.width, b.top + p[1] * b.height]; },
      w3quality: function(q) { if (W3) W3.setQuality(q); },
