<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bon's Smash</title>
<style>
  :root { --ink:#1d2b3a; --accent:#ff7a1a; --blue:#2f80ed; --panel:#ffffff; }
  html, body { margin:0; height:100%; background:#9fd3ff; overflow:hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink);
               -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas { position:fixed; inset:0; display:block; width:100vw; height:100vh; touch-action:none; }
  button { font-family:inherit; color:var(--ink); -webkit-tap-highlight-color:transparent; }
  .hidden { display:none !important; }

  /* ---- danh sách màn ---- */
  #menu { position:fixed; inset:0; overflow:auto; background:linear-gradient(#9fd3ff,#eaf7ff); z-index:20; padding:calc(var(--ti, env(safe-area-inset-top)) + 14px) 16px 30px; box-sizing:border-box; }
  #menu h1 { margin:4px 0 2px; font-size:40px; text-align:center; color:#ff7a1a; -webkit-text-stroke:2px #fff; paint-order:stroke; letter-spacing:1px; }
  #menu .cast { display:flex; justify-content:center; gap:6px; margin-bottom:6px; }
  #menu .cast canvas { position:static; width:84px; height:84px; }
  #menu h2 { font-size:22px; margin:16px 4px 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr)); gap:10px; max-width:1000px; margin:0 auto; }
  .lv { position:relative; height:72px; border-radius:18px; border:3px solid #ffffff; background:#fff; font-size:28px; font-weight:800; box-shadow:0 3px 0 #0002; cursor:pointer; }
  .lv.done { background:#e6f7e2; border-color:#7cc46a; }
  .lv.done::after { content:'✓'; position:absolute; right:7px; top:3px; font-size:17px; color:#3a9a2a; }
  .lv:active { transform:translateY(2px); box-shadow:none; }
  .bonrow { max-width:1000px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px; }
  .bcard { display:flex; align-items:center; gap:6px; background:#fff; border-radius:18px; padding:6px 8px; box-shadow:0 3px 0 #0002; }
  .bcard b { font-size:22px; min-width:44px; text-align:center; }
  .bcard button, .newb { height:54px; min-width:54px; border-radius:14px; border:2px solid #dfe6ee; background:#f6f9fc; font-size:24px; cursor:pointer; }
  .newb { padding:0 18px; font-size:22px; font-weight:800; background:#fff1e6; border-color:var(--accent); height:68px; }
  .homeb { position:absolute; left:16px; top:calc(var(--ti, env(safe-area-inset-top)) + 14px); width:56px; height:56px; border-radius:16px; border:none; background:#fff; font-size:28px; box-shadow:0 3px 0 #0002; }

  /* ---- nút trên màn chơi ---- */
  .hud { position:fixed; top:calc(var(--ti, env(safe-area-inset-top)) + 10px); right:12px; display:flex; gap:10px; z-index:5; }
  .hud button, .hudl button { width:64px; height:64px; border-radius:18px; border:none; background:#fff; font-size:30px; box-shadow:0 3px 0 #0002; cursor:pointer; }
  .hud button:active, .hudl button:active { transform:translateY(2px); box-shadow:none; }
  .hudl { position:fixed; top:calc(var(--ti, env(safe-area-inset-top)) + 10px); left:12px; display:flex; gap:10px; align-items:center; z-index:5; }
  .hudl .lbl { background:#ffffffd0; padding:8px 14px; border-radius:14px; font-size:22px; font-weight:800; }

  /* ---- thắng ---- */
  #win { position:fixed; inset:0; background:#0006; z-index:15; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; }
  #win .big { font-size:min(64px, 11vw); font-weight:900; color:#ff7a1a; -webkit-text-stroke:3px #fff; paint-order:stroke; text-align:center; }
  #win .row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #win button { font-size:26px; font-weight:800; padding:14px 26px; border-radius:20px; border:none; background:#fff; box-shadow:0 4px 0 #0003; cursor:pointer; }
  #win button.go { background:var(--accent); color:#fff; }

  /* ---- Bon tự xếp màn ---- */
  #tools { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:8px; padding:8px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) 10px; background:#ffffffe8; overflow-x:auto; box-shadow:0 -2px 8px #0002; }
  #tools button { flex:none; min-width:64px; height:64px; border-radius:16px; border:3px solid #dfe6ee; background:#f6f9fc; font-size:28px; cursor:pointer; padding:0 6px; }
  #tools button canvas { position:static; width:48px; height:48px; pointer-events:none; }
  #tools button.on { border-color:var(--accent); background:#fff1e6; }
  #tools button.play { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:800; font-size:24px; padding:0 14px; }
  #tools button.play.off { opacity:0.45; }
  #tools .sep { width:2px; background:#dfe6ee; flex:none; margin:4px 2px; }
  .hint { position:fixed; left:50%; transform:translateX(-50%); bottom:100px; background:#ffffffe6; padding:8px 16px; border-radius:14px; font-size:18px; z-index:7; pointer-events:none; text-align:center; max-width:90vw; }
  #ask { position:fixed; inset:0; background:#0006; z-index:30; display:flex; align-items:center; justify-content:center; }
  #ask .card { background:#fff; border-radius:22px; padding:22px 26px; text-align:center; font-size:24px; font-weight:800; }
  #ask .card div { display:flex; gap:14px; justify-content:center; margin-top:16px; }
  #ask button { font-size:24px; font-weight:800; padding:12px 26px; border-radius:16px; border:none; background:#eef2f6; }
  #ask button.yes { background:#e63946; color:#fff; }
</style>

<script>
/* 11-23: mở từ icon ngoài màn hình chính (standalone) thì thanh giờ/pin của iPad đè lên hàng nút trên cùng
   -> --ti = bề cao thanh đó (tối thiểu 24px, vì có máy báo env() = 0); __topInset() = cùng số đó tính ra px cho game vẽ bằng canvas.
   Mở trong Safari / trên máy tính thì không cộng thêm gì. Chỉ có trong bản đưa lên mạng, file gốc chạy trên máy không bị đụng. */
(function () {
  var st = navigator.standalone === true || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  var ti = st ? 'max(env(safe-area-inset-top), 24px)' : 'env(safe-area-inset-top)';
  document.documentElement.style.setProperty('--ti', ti);
  window.__topInset = function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;height:' + ti;
    (document.body || document.documentElement).appendChild(d);
    var v = d.getBoundingClientRect().height || 0; d.parentNode.removeChild(d); return v;
  };
})();
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <button class="homeb hidden" id="homeBtn" type="button">🏠</button>
  <h1>Bon's Smash</h1>
  <div class="cast" id="cast"></div>

<div class="hudl hidden" id="hudl"><button id="btnMenu" type="button">☰</button><span class="lbl" id="lbl"></span></div>

  <div class="big">You got them all!</div>
  <div class="row" id="winBtns"></div>
</div>

<!-- hình 4 bạn: dùng chung với game bay (Blender) -->
<script src="froggy3d/sprites.js"></script>
<script src="friends3d/sprites.js"></script>
<!-- vật lý 2D + tiếng Nam chọn + 50 màn có sẵn -->
<script src="bonsmash/matter.min.js"></script>
<script src="bonsmash/sounds.js"></script>
<script src="bonsmash/levels.js"></script>
<script>
(function () {
  'use strict';
  // Game 5 của Bon — vẽ hình trong ô nét đứt, buông tay → hình có sức nặng rơi xuống đập 4 bạn thú bông.
  // Trượt → em gần nhất cười chọc quê · trúng → hét + chóng mặt nằm đó · đập hết = qua màn. Không điểm, không thua.
  // Màn có sẵn (bonsmash/levels.js) + màn Bon tự xếp (lưu trong máy) dùng CHUNG 1 khuôn dữ liệu + 1 hàm dựng.
  const { Engine, Bodies, Body, Composite, Events } = Matter;
  const TAU = Math.PI * 2;

  // ================= Thế giới: toạ độ cố định 1000 x 700, co giãn theo màn hình =================
  const WW = 1000, WH = 700, GROUND = 640;
  const R = 32;                 // cỡ bạn
  const BEAD = 9;               // bán kính "hạt" tạo nên vật vẽ
  const HIT_SPEED = 2.2;        // vật vẽ chạm em nhanh hơn mức này mới tính trúng (mẫu 11-16)
  const RAMP_T = 16;            // độ dày dốc
  const ORDER = ['froggy', 'chicken', 'babyfrog', 'pillow'];
  const CHAR = { froggy: { bottom: 1.02, top: 1.22, name: 'Froggy' }, chicken: { bottom: 1.35, top: 1.3, name: 'Chicken Banana' },
                 babyfrog: { bottom: 1.1, top: 1.15, name: 'Baby Froggy' }, pillow: { bottom: 0.8, top: 0.8, name: 'Gối chút chút' } };

  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let scale = 1, offX = 0, offY = 0, dpr = 1, screen = 'menu';
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
    const bottomBar = screen === 'build' ? 88 : 0;   // màn xếp: chừa chỗ thanh công cụ dưới
    scale = Math.min(innerWidth / WW, (innerHeight - bottomBar) / WH);
    offX = (innerWidth - WW * scale) / 2; offY = Math.max(0, (innerHeight - bottomBar - WH * scale) / 2);
  }
  addEventListener('resize', resize); resize();
  const toWorld = (cx, cy) => ({ x: (cx - offX) / scale, y: (cy - offY) / scale });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const snap = v => Math.round(v / 10) * 10;

  // ================= Hình 4 bạn — tấm chụp Blender của game bay =================
  const FROG_IMG = {}, FRIEND_IMG = {}, FRIEND_META = {};
  for (const k of Object.keys(window.FROG_SPRITES || {})) { const im = new Image(); im.src = FROG_SPRITES[k]; FROG_IMG[k] = im; }
  for (const id of Object.keys(window.FRIEND_SPRITES || {})) {
    FRIEND_IMG[id] = {}; FRIEND_META[id] = FRIEND_SPRITES[id].meta;
    for (const k of Object.keys(FRIEND_SPRITES[id].img)) { const im = new Image(); im.src = FRIEND_SPRITES[id].img[k]; FRIEND_IMG[id][k] = im; }
  }
  const ok = im => im && im.complete && im.naturalWidth > 0;
  function part(c, id, name, x, z, ang, r) {
    const im = FRIEND_IMG[id][name], m = FRIEND_META[id][name];
    if (!ok(im) || !m) return;
    const sz = m[0] * r;
    c.save(); c.translate(x * r, -z * r); if (ang) c.rotate(ang);
    c.drawImage(im, m[1] * r - sz / 2, -m[2] * r - sz / 2, sz, sz);
    c.restore();
  }
  const PILLOW_POSE = { ouch: ['tense', 0.78, 1.2], laugh: ['sag', 1.16, 0.8], blink: ['idle', 1, 1], idle: ['idle', 1, 1], dizzy: ['idle', 1, 1] };
  // vẽ 1 bạn, tâm tại (0,0). face: idle | blink | laugh | ouch | dizzy
  function drawFriendAt(c, id, face, r, wob) {
    const f = face === 'laugh' ? 'wink' : face;
    if (id === 'froggy') {
      const im = FROG_IMG[f] || FROG_IMG.idle; if (!ok(im)) return;
      const sz = 3.4 * r; c.drawImage(im, -sz / 2, -sz / 2 - 0.15 * r, sz, sz);
    } else if (id === 'chicken') {
      for (let s = -1; s <= 1; s += 2) part(c, id, 'leg', s * 0.3, -0.9, (wob || 0) * s * 0.4, r);
      part(c, id, FRIEND_IMG.chicken[f] ? f : 'idle', 0, 0, 0, r);
      const petals = [Math.PI / 2 - 0.95, Math.PI / 2 - 0.32, Math.PI / 2 + 0.32, Math.PI / 2 + 0.95];
      c.save(); c.translate(0, 0.55 * r);
      petals.forEach((b, i) => part(c, id, i === 1 || i === 2 ? 'petalA' : 'petalB', 0, 0, b - Math.PI / 2 + (wob || 0) * (i < 2 ? -0.3 : 0.3), r));
      c.restore();
      part(c, id, 'hat', 0, 1.02 + Math.max(0, wob || 0) * 0.3, 0, r);
    } else if (id === 'babyfrog') {
      part(c, id, FRIEND_IMG.babyfrog[f] ? f : 'idle', 0, 0, 0, r);
      part(c, id, 'cup', 0.02, -0.32, (wob || 0) * 0.3, r);
      part(c, id, 'crown', 0, 0.84 + Math.max(0, wob || 0) * 0.3, 0, r);
    } else {
      const [pose, kx, kz] = PILLOW_POSE[face] || PILLOW_POSE.idle;
      for (const [n, sx, sz] of [['cornerTL', -1, 1], ['cornerTR', 1, 1], ['cornerBL', -1, -1], ['cornerBR', 1, -1]])
        part(c, id, n, sx * 0.98 * kx, sz * 0.56 * kz, -sx * (wob || 0) * 0.5, r);
      part(c, id, pose, 0, 0, 0, r);
    }
  }
  function thumb(id, size, face) {
    const cv = document.createElement('canvas'); cv.width = size * 2; cv.height = size * 2;
    const g = cv.getContext('2d'); g.translate(size, size * 1.08);
    const go = () => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height); g.restore(); drawFriendAt(g, id, face || 'idle', size * 0.6, 0); };  // 0.4 → 0.6: ảnh chụp 11-16 thấy hình bé
    go(); setTimeout(go, 200); setTimeout(go, 800);
    return cv;
  }

  // ================= Tiếng: Nam chọn cho từng em (bonsmash/sounds.js), giọng cao/thấp theo em =================
  const SFX = { ctx: null, buf: {}, mouth: null, log: [] };
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { try { SFX.ctx = new AC(); } catch (e) {} }
  const PITCH = { froggy: 0.85, chicken: 1.05, babyfrog: 1.3, pillow: 1.15 };
  function decode(key, dataUrl, cb) {
    if (SFX.buf[key]) { cb(SFX.buf[key]); return; }
    if (!SFX.ctx || !dataUrl) return;
    const bin = atob(dataUrl.split(',')[1]), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    SFX.ctx.decodeAudioData(arr.buffer, b => { SFX.buf[key] = b; cb(b); }, () => SFX.log.push('decodeErr:' + key));
  }
  function play(key, dataUrl, rate) {
    SFX.log.push(key);
    if (!SFX.ctx) return;
    if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
    decode(key, dataUrl, b => {
      if (SFX.mouth) { try { SFX.mouth.stop(); } catch (e) {} }
      const s = SFX.ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = rate || 1;
      s.connect(SFX.ctx.destination); s.start(); SFX.mouth = s;
    });
  }
  const SND = window.SMASH_SOUNDS || { laugh: {}, scream: {} };
  const sayLaugh = id => play(id + ':laugh', SND.laugh[id], PITCH[id]);
  const sayScream = id => play(id + ':scream', SND.scream[id], PITCH[id]);
  function unlockAudio() { if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume(); }
  addEventListener('pointerdown', unlockAudio, true);

  // ================= Lưu trong máy (màn của Bon + màn đã qua) =================
  const SAVE_KEY = 'bon_smash_v1';
  let save = { bonLevels: [], cleared: {} };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && Array.isArray(s.bonLevels)) save = Object.assign(save, s); } catch (e) {}
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

  // ================= Khuôn 1 màn =================
  // { box:{x,y,w,h}, ink, bricks:[{x,y,w,h}], ramps:[{x,y,w,a}], friends:[{id,x,y}] }
  // friends.y = chỗ "thả" em xuống: em rơi tới mặt đứng đầu tiên bên dưới (nóc gạch hoặc đất) → núp dưới mái thì y nằm dưới mái
  const BUILTIN = (window.SMASH_LEVELS || []);
  const blankLevel = () => ({ box: { x: 250, y: 30, w: 500, h: 210 }, ink: 900, bricks: [], ramps: [], friends: [] });
  function surfaceBelow(L, x, y) {
    let best = GROUND;
    for (const b of L.bricks) if (x >= b.x - 4 && x <= b.x + b.w + 4 && b.y >= y - 2 && b.y < best) best = b.y;
    return best;
  }
  function friendSpot(L, f) { const base = surfaceBelow(L, f.x, f.y); return { x: f.x, y: base - CHAR[f.id].bottom * R, base }; }
  function rampEnds(r) { const dx = Math.cos(r.a) * r.w / 2, dy = Math.sin(r.a) * r.w / 2; return [{ x: r.x - dx, y: r.y - dy }, { x: r.x + dx, y: r.y + dy }]; }

  // ================= Vật lý (màn chơi) =================
  let L = null, engine = null, friends = [], inks = [], shot = null, stroke = null, shots = 0, won = false, events = [], bubbles = [];
  let current = { kind: 'builtin', i: 0 };   // màn đang chơi
  function buildWorld(level) {
    L = JSON.parse(JSON.stringify(level));
    engine = Engine.create({ positionIterations: 10, velocityIterations: 8 }); engine.gravity.y = 1;
    const st = { isStatic: true, friction: 0.8, label: 'wall' };
    const bodies = L.bricks.map(b => Bodies.rectangle(b.x + b.w / 2, b.y + b.h / 2, b.w, b.h, st));
    for (const r of L.ramps) bodies.push(Bodies.rectangle(r.x, r.y, r.w, RAMP_T, Object.assign({ angle: r.a }, st)));
    bodies.push(Bodies.rectangle(WW / 2, GROUND + 40, WW * 3, 80, st));
    Composite.add(engine.world, bodies);
    friends = L.friends.map(fd => {
      const p = friendSpot(L, fd);
      const body = Bodies.circle(p.x, p.y + 0.1 * R, R * 1.05, { isStatic: true, label: 'friend', friction: 0.6 });
      Composite.add(engine.world, body);
      const f = { id: fd.id, x: p.x, y: p.y, body, state: 'idle', t: 0, blinkT: 1 + Math.random() * 3, side: p.x < WW / 2 ? -1 : 1 };
      body.plugin.friend = f; return f;
    });
    inks = []; shot = null; stroke = null; shots = 0; won = false; events = []; bubbles = [];
    Events.on(engine, 'collisionStart', onHit);
  }
  function onHit(e) {
    for (const p of e.pairs) {
      const a = p.bodyA, b = p.bodyB;
      const fa = a.plugin && a.plugin.friend, fb = b.plugin && b.plugin.friend;
      const fr = fa || fb, other = fa ? b : a;
      if (!fr || !other.parent || other.parent.label !== 'ink') continue;
      if ((fr.state === 'idle' || fr.state === 'laugh') && other.parent.speed > HIT_SPEED) hitFriend(fr, other.parent);
    }
  }
  function hitFriend(f, ink) {
    f.state = 'ouch'; f.t = 0; sayScream(f.id);
    if (shot && shot.body === ink) shot.hits++;
    events.push({ type: 'hit', id: f.id, speed: +ink.speed.toFixed(2) });
    bubble(f, 'OUCH!', '#d62828');
  }
  function bubble(f, text, color) { bubbles.push({ x: f.x, y: f.y - CHAR[f.id].top * R - 26, text, color, t: 0 }); }

  // nét → chuỗi hạt tròn cách đều → 1 vật cứng có sức nặng
  function dropInk(pts) {
    if (!pts.length || won) return;
    const beads = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const last = beads[beads.length - 1];
      if (Math.hypot(pts[i].x - last.x, pts[i].y - last.y) >= BEAD * 0.9) beads.push(pts[i]);
    }
    const parts = beads.map(p => Bodies.circle(p.x, p.y, BEAD, { friction: 0.6, restitution: 0.15, density: 0.002 }));
    const body = parts.length === 1 ? parts[0] : Body.create({ parts, friction: 0.6, restitution: 0.15 });
    body.label = 'ink';
    body.plugin.beads = beads.map(p => ({ x: p.x - body.position.x, y: p.y - body.position.y }));
    Composite.add(engine.world, body);
    inks.push(body); shots++;
    shot = { body, hits: 0, still: 0, age: 0 };
    events.push({ type: 'drop', beads: beads.length });
  }
  // vật đã đứng yên / rơi khỏi màn → cú này không trúng ai thì mấy em chưa trúng cười chọc quê (em gần nhất cười thành tiếng)
  function checkShot(dt) {
    if (!shot) return;
    const b = shot.body; shot.age += dt;

    if (f.state === 'dizzy') {
      face = 'dizzy'; const k = Math.min(1, f.t / 0.35);
      if (f.id === 'pillow') { sx = 1 + 0.18 * k; sy = 1 - 0.3 * k; ang = f.side * 0.15 * k; y = f.y + 0.2 * R * k; }
      else { ang = f.side * Math.PI / 2 * k; y = f.y + (C.bottom * R - 0.95 * R) * k; }
    }
    ctx.save(); ctx.translate(f.x, y); ctx.rotate(ang); ctx.scale(sx, sy); drawFriendAt(ctx, f.id, face, R, wob); ctx.restore();
    if (f.state === 'dizzy' && ok(FROG_IMG.star)) {
      const hy = y - 1.25 * R;
      for (let i = 0; i < 3; i++) {
        const an = time * 5 + i * TAU / 3, s = R * (1.0 + 0.3 * Math.sin(an));
        ctx.globalAlpha = 0.75 + 0.25 * Math.sin(an);
        ctx.drawImage(FROG_IMG.star, f.x + Math.cos(an) * R * 0.9 - s / 2, hy + Math.sin(an) * R * 0.3 - s / 2, s, s);
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawPlay(time) {
    drawBackdrop(); drawLevelStatic(L);
    for (const f of friends) drawFriend(f, time);
    for (const b of inks) drawInk(b.plugin.beads, b.position, b.angle);
    if (stroke) drawInk(stroke.pts, { x: 0, y: 0 }, 0, true);
    const B = L.box, used = stroke ? stroke.len : 0;   // thanh mực
    ctx.fillStyle = '#ffffffdd'; ctx.fillRect(B.x, B.y + B.h + 8, B.w, 14);
    ctx.fillStyle = used > L.ink * 0.85 ? '#e63946' : '#ff9f1c'; ctx.fillRect(B.x, B.y + B.h + 8, B.w * (1 - used / L.ink), 14);
    ctx.strokeStyle = '#3d5a80'; ctx.lineWidth = 2; ctx.strokeRect(B.x, B.y + B.h + 8, B.w, 14);
    for (const b of bubbles) {
      const k = Math.min(1, b.t * 6);
      ctx.save(); ctx.globalAlpha = Math.min(1, (1.2 - b.t) * 3); ctx.translate(b.x, b.y - b.t * 30); ctx.scale(k, k);
      ctx.font = '900 30px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#fff';
      ctx.strokeText(b.text, 0, 0); ctx.fillStyle = b.color; ctx.fillText(b.text, 0, 0); ctx.restore();
    }
  }
  function dot(x, y, color, txt) {
    ctx.beginPath(); ctx.arc(x, y, 18, 0, TAU); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    if (txt) { ctx.fillStyle = '#fff'; ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y + 1); ctx.textBaseline = 'alphabetic'; }
  }
  function drawBuild(time) {
    drawBackdrop(); drawLevelStatic(edit);
    for (const fd of edit.friends) { const p = friendSpot(edit, fd); ctx.save(); ctx.translate(p.x, p.y); drawFriendAt(ctx, fd.id, 'idle', R, 0); ctx.restore(); }
    if (sel) {
      const r = rectOfSel(sel);
      ctx.save(); ctx.strokeStyle = '#2f80ed'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      if (sel.kind === 'ramp') { ctx.translate(sel.ref.x, sel.ref.y); ctx.rotate(sel.ref.a); ctx.strokeRect(-sel.ref.w / 2 - 6, -18, sel.ref.w + 12, 36); }
      else ctx.strokeRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8);
      ctx.restore();
      const H = handles(sel);
      if (H.del) dot(H.del.x, H.del.y, '#e63946', '×');
      if (H.size) dot(H.size.x, H.size.y, '#2f80ed');
      if (H.rot) dot(H.rot.x, H.rot.y, '#7b4fd6', '↻');
    }
  }
  let last = performance.now(), acc = 0;
  function tick(now) {
    const time = now / 1000;
    if (screen === 'play' && engine) {
      acc += Math.min(100, now - last);
      while (acc >= STEP) { stepOnce(); acc -= STEP; }
      drawPlay(time);
    } else if (screen === 'build' && edit) drawBuild(time);
    last = now;
    requestAnimationFrame(tick);
  }

  showMenu();
  requestAnimationFrame(tick);

  // để máy tự chơi thử gọi THẲNG vào code game (không ảnh hưởng người chơi)
  window.__smash = {
    get screen() { return screen; }, get friends() { return friends.map(f => ({ id: f.id, state: f.state })); },
    get events() { return events; }, get won() { return won; }, get shotActive() { return !!shot; }, get sfx() { return SFX.log; },
    get level() { return L; }, get edit() { return edit; }, get save() { return save; }, get sel() { return sel && { kind: sel.kind }; },
    levels: BUILTIN, startPlay, startBuild, showMenu,
    playData(lv) { current = { kind: 'test', i: 0 }; buildWorld(lv); if (screen !== 'play') setScreen('play'); },  // bot thử màn nháp chưa vào levels.js
    dropStroke(pts) { dropInk(pts.map(p => clampBox(p))); },
    settle(max) { let n = 0; while (shot && n < (max || 900)) { stepOnce(); n++; } for (let i = 0; i < 60; i++) stepOnce(); return n; },
    toScreen: (x, y) => ({ x: offX + x * scale, y: offY + y * scale }),
    friendSpot: (lv, f) => friendSpot(lv, f),
  };
})();
</script>
</body>
