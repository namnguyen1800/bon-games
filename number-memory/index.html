<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bon's Number Memory</title>
<style>
  /* Game 3 của Bon: nhớ số. Toàn chữ/nút/danh sách → nút HTML thật (khác 2 game cũ vẽ hết lên canvas); chỉ bạn hỏi vẽ trên canvas nhỏ.
     Bố cục: cột trái = bạn hỏi + bảng / câu hỏi / điểm · cột phải = nút to (Nam chơi iPad tay phải). Màn < 600px: nút xuống đáy. */
  :root { color-scheme: light; --sky-top: #9adbe3; --sky: #70c5ce; --ink: #1f3b40; --edge: #2e6b73; --card: #ffffff;
          --yes: #22c55e; --no: #3b82f6; --go: #f59e0b; --right: #16a34a; --wrong: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(var(--sky-top), var(--sky)); color: var(--ink); font-family: -apple-system, "Segoe UI", sans-serif;
         -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  [hidden] { display: none !important; }
  #app { height: 100%; display: flex; flex-direction: column; gap: 8px;
         padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  button { font: inherit; color: inherit; border: 4px solid var(--edge); border-radius: 18px; background: var(--card); cursor: pointer;
           box-shadow: 0 5px 0 rgba(46,107,115,0.5); touch-action: manipulation; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(46,107,115,0.5); }
  button:disabled { opacity: 0.35; cursor: default; }
  /* thanh trên */
  #top { display: flex; align-items: center; gap: 10px; }
  #homeBtn, #muteBtn { width: 56px; height: 56px; font-size: 28px; border-radius: 16px; flex: none; }
  #faceBtn { width: 64px; height: 56px; padding: 0; border-radius: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  #faceCv { width: 52px; height: 48px; }
  #lvTitle { flex: 1; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 var(--edge); white-space: nowrap; }
  /* hàng level: ◀ + 10 số (điện thoại 5) + ▶ */
  #levelRow { display: flex; justify-content: center; gap: 6px; }
  #levelRow button { min-width: 50px; height: 50px; padding: 0 4px; font-size: 22px; font-weight: 800; border-width: 3px; border-radius: 12px;
                     box-shadow: 0 3px 0 rgba(46,107,115,0.5); }
  #levelRow .lv.on { background: #fde68a; border-color: #b45309; }
  /* sân chơi */
  #stage { flex: 1; min-height: 0; display: flex; gap: 14px; }
  #left { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; } /* min-height 0: không thì khung tự phình theo nội dung, chỗ bị cắt lọt ra ngoài */
  #leftIn { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0; }
  #right { width: clamp(200px, 30%, 300px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  #right button { width: 100%; min-height: 120px; font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  #startBtn, #nextBtn, #playBtn { background: var(--go); }
  #yesBtn { background: var(--yes); }
  #noBtn { background: var(--no); }
  #right #againBtn, #right #editBtn { background: var(--card); color: var(--ink); text-shadow: none; } /* #right để thắng màu chữ trắng của "#right button" */
  #right #againBtn, #right #nextBtn, #right #editBtn { font-size: 30px; white-space: nowrap; }
  /* Bon level: nút ⭐ trên hàng level (chữ "Bon" chỉ hiện khi màn rộng — iPad dọc/điện thoại không đủ chỗ) */
  #levelRow .bon { background: #fde68a; border-color: #b45309; padding: 0 10px; white-space: nowrap; }
  #levelRow .bon.on { background: var(--go); color: #fff; }
  @media (max-width: 899px) { #levelRow .bonWord { display: none; } }
  /* màn đặt bài */
  #setup { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 14px; }
  #setup .group { display: flex; flex-direction: column; gap: 2px; }
  #setup .label { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 var(--edge); margin-left: 4px; }
  #setup .slots { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 14px 6px 6px; }
  #setup .slot { position: relative; min-width: 84px; height: 84px; padding: 0 12px; display: flex; align-items: center; justify-content: center;
                 background: #fff; border: 4px solid var(--edge); border-radius: 18px; font-size: 44px; font-weight: 900; cursor: pointer; }
  #setup .slot.q { background: #eff6ff; }
  #setup .slot.empty { color: #9ca3af; }
  #setup .slot.sel { border-color: var(--go); box-shadow: 0 0 0 5px #fde68a; }
  #setup .slot.dup { background: #fee2e2; border-color: var(--wrong); }
  #setup .slot .x { position: absolute; top: -12px; right: -10px; width: 32px; height: 32px; padding: 0; border-width: 3px; border-radius: 50%;
                    font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: none; }
  #setup .plus { width: 84px; height: 84px; font-size: 48px; font-weight: 900; background: #fde68a; border-color: #b45309; }
  #setup .rowLine { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #setup .toggle { display: flex; }
  #setup .toggle button { height: 60px; padding: 0 18px; font-size: 24px; font-weight: 900; border-radius: 0; box-shadow: 0 4px 0 rgba(46,107,115,0.5); }
  #setup .toggle button:first-child { border-radius: 16px 0 0 16px; }
  #setup .toggle button:last-child { border-radius: 0 16px 16px 0; border-left: none; }
  #setup .toggle button.on { background: var(--edge); color: #fff; }
  #setup .stepper { display: flex; align-items: center; gap: 8px; }
  #setup .stepper button { width: 60px; height: 60px; font-size: 26px; font-weight: 900; }
  #setup .stepper .val { min-width: 70px; text-align: center; font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--edge); }
  /* bàn phím số (nút HTML, không dùng ô nhập → iPad không bật bàn phím của nó) */
  #right #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #right #pad button { min-height: 0; height: 66px; font-size: 34px; color: var(--ink); text-shadow: none; border-radius: 14px; box-shadow: 0 4px 0 rgba(46,107,115,0.5); }
  #right #pad .del { background: #fee2e2; }
  #right #pad .nx { background: #dbeafe; font-size: 28px; }
  /* bạn hỏi + bong bóng chữ */
  #host { display: flex; align-items: center; gap: 6px; }
  #hostCv { width: 130px; height: 130px; flex: none; }
  #bubble { background: #fff; border: 4px solid var(--edge); border-radius: 22px; padding: 10px 18px; font-size: 26px; font-weight: 800; max-width: 420px; }
  /* bảng số */
  .cells { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 660px; }
  .cell { min-width: 84px; height: 96px; padding: 0 10px; display: flex; align-items: center; justify-content: center;
          background: #fff; border: 4px solid var(--edge); border-radius: 18px; font-size: 52px; font-weight: 900; }
  /* câu hỏi: số cũ trượt ra / số mới trượt vào (CSS transition → trình duyệt phát transitionend, game + test đều dựa vào đó) */
  #askNum { font-size: 150px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 var(--edge); line-height: 1.1;
            transition: transform 0.15s ease, opacity 0.15s ease; }
  #askNum.leaving { transform: translateX(-80px); opacity: 0; }
  #askNum.entering { transform: translateX(80px); opacity: 0; transition: none; }
  /* điểm */
  #leftResult { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #scoreRow { display: flex; align-items: center; gap: 14px; }
  #score { font-size: 64px; font-weight: 900; color: #fff; text-shadow: 0 4px 0 var(--edge); }
  #stars { font-size: 40px; letter-spacing: 2px; max-width: 440px; } /* Bon level tới 20 câu → sao xuống dòng */
  #app[data-state="result"] #hostCv { width: 90px; height: 90px; } /* màn điểm nhiều thứ → bạn hỏi nhỏ lại cho vừa 1 màn */
  #resBoard { gap: 8px; }
  #resBoard .cell { min-width: 62px; height: 62px; padding: 0 6px; font-size: 32px; border-width: 3px; border-radius: 14px; }
  #asked { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 10px; } /* 5 câu xếp 2 cột → 3 hàng */
  #asked .row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.92); border-radius: 14px; padding: 2px 14px; font-size: 28px; font-weight: 900; }
  #asked .num { min-width: 84px; text-align: right; }
  #asked .chip { font-size: 18px; padding: 4px 10px; border-radius: 10px; color: #fff; }
  #asked .chip.yes { background: var(--yes); }
  #asked .chip.no { background: var(--no); }
  #asked .mark { font-size: 34px; min-width: 30px; text-align: center; }
  #asked .mark.right { color: var(--right); }
  #asked .mark.wrong { color: var(--wrong); }
  /* màn chọn người hỏi */
  #pick { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15,23,42,0.5); }
  #pick .panel { width: 100%; max-width: 760px; background: #fffdf7; border: 5px solid var(--go); border-radius: 26px; padding: 18px; text-align: center; }
  #pick h2 { font-size: 34px; color: #b45309; margin-bottom: 12px; }
  #pickTiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  #pick .pickTile { width: 160px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 20px; font-weight: 800; }
  #pick .pickTile canvas { width: 130px; height: 130px; }
  #pick .pickTile.on { background: #fef3c7; border-color: #f59e0b; }
  /* điện thoại: nút xuống đáy, đứng ngang hàng */
  @media (max-width: 599px) {
    #stage { flex-direction: column; gap: 10px; }
    #right { width: 100%; flex-direction: row; gap: 10px; }
    #right button { flex: 1; min-height: 96px; font-size: 30px; }
    #right #againBtn, #right #nextBtn, #right #editBtn { font-size: 22px; }
    /* màn đặt bài điện thoại: bàn phím + Play xếp dọc ở đáy, mọi thứ nhỏ lại */
    #app[data-state="setup"] #right { flex-direction: column; gap: 8px; }
    #app[data-state="setup"] #right #playBtn { flex: none; min-height: 60px; font-size: 26px; }
    #right #pad { gap: 6px; }
    #right #pad button { flex: none; height: 44px; font-size: 24px; border-width: 3px; }
    #setup { gap: 8px; }
    #setup .label { font-size: 20px; }
    #setup .slots { gap: 10px; padding-top: 12px; }
    #setup .slot, #setup .plus { min-width: 56px; height: 56px; font-size: 30px; border-width: 3px; }
    #setup .plus { width: 56px; }
    #setup .slot .x { width: 28px; height: 28px; font-size: 14px; top: -11px; right: -8px; }
    #setup .toggle button { height: 50px; font-size: 20px; padding: 0 12px; }
    #setup .stepper button { width: 50px; height: 50px; }
    #setup .stepper .val { font-size: 34px; min-width: 50px; }
    #stars { max-width: 300px; }
    #app[data-state="result"] #hostCv { width: 72px; height: 72px; }
    #levelRow { gap: 4px; }
    #levelRow button { min-width: 48px; height: 48px; font-size: 20px; }
    #lvTitle { font-size: 24px; }
    #hostCv { width: 96px; height: 96px; }
    #bubble { font-size: 20px; padding: 8px 12px; }
    .cell { min-width: 64px; height: 76px; font-size: 38px; }
    #askNum { font-size: 110px; }
    #score { font-size: 48px; }
    #stars { font-size: 30px; }
    #resBoard .cell { min-width: 52px; height: 52px; font-size: 24px; }
    #asked .row { font-size: 22px; padding: 2px 8px; gap: 8px; }
    #asked .num { min-width: 60px; }
    #asked .chip { font-size: 15px; padding: 3px 6px; }
    #pick .pickTile { width: 140px; }
  }
</style>

  <header id="top">
    <button id="homeBtn" aria-label="Home">🏠</button>
    <div id="lvTitle">Level 1</div>
    <button id="faceBtn" aria-label="Who asks"><canvas id="faceCv"></canvas></button>

  <nav id="levelRow"></nav>

    <section id="left"><div id="leftIn">
      <div id="host"><canvas id="hostCv"></canvas><div id="bubble">Remember these numbers!</div></div>
      <!-- Bon level (Nam 11-09): người nhà tự đặt bảng + số câu, câu hỏi random hoặc tự bấm -->
      <div id="setup" hidden>
        <div class="group">
          <div class="label">Numbers</div>
          <div class="slots" id="numSlots"></div>
        </div>
        <div class="group">
          <div class="rowLine">
            <div class="label">Questions</div>
            <div class="toggle"><button id="modeRandom">🎲 Random</button><button id="modePick">✋ I choose</button></div>
            <div class="stepper" id="stepper"><button id="qMinus" aria-label="Fewer">◀</button><div class="val" id="qVal">5</div><button id="qPlus" aria-label="More">▶</button></div>
          </div>
        </div>

          <div class="label">Ask these numbers</div>
          <div class="slots" id="qSlots"></div>
        </div>
      </div>

          <div id="scoreRow"><span id="score"></span><span id="stars"></span></div>

      <div id="pad" hidden></div>

      <button id="againBtn" hidden>Play again</button>

<!-- hình 4 baby dùng chung với game Flappy (Blender nặn → embed_sprites.py) -->

<!-- tiếng kêu 4 baby (friends3d/build_sounds.py) -->
<script src="friends3d/sounds.js"></script>
<script>
(function(){
  'use strict';
  // Game 3 của Bon: hiện vài số → Bon tự xem rồi bấm Start → bảng biến mất → hỏi 5 câu "số này có trên bảng không" (YES/NO)
  // → hết 5 câu mới hiện điểm + sao + bảng cũ + từng câu ✓/✗. Level do Nam tự đổi (Next level / hàng số level), game không tự lên.
  // Chữ trong game = tiếng Anh (trừ tên "Gối chút chút"). Plan: ~/.claude/plans/m-nh-mu-n-t-o-th-m-zesty-feather.md
  const TEST = /[?&]test/.test(location.search);
  const HOME = location.protocol !== 'file:'; // nút 🏠 về trang chủ bon-games/ — mở file trên máy thì không có trang chủ → giấu
  const TAU = Math.PI * 2;
  const $ = function(id) { return document.getElementById(id); };

  const CHARS = [
    { id: 'froggy',   name: 'Froggy' },
    { id: 'chicken',  name: 'Chicken Banana' },
    { id: 'babyfrog', name: 'Baby Froggy' },
    { id: 'pillow',   name: 'Gối chút chút' },
  ];

  // ================= LEVEL =================
  // Nam 11-02: "độ khó cần tăng đều" + bảng to ra được → mỗi level khó hơn level trước ĐÚNG 1 nấc, không level nào chỉ đổi số.
  // Level 1 = 3 số 1 chữ số; mỗi chữ cái dưới đây = 1 nấc để lên level kế:
  //   A thêm 1 ô số 1 chữ số · U 1 số 1 chữ số → 2 chữ số · V 1 số 2 chữ số → 3 chữ số
  //   L thêm 1 câu No "giống" số trên bảng (chỉ khác chữ số cuối ±1/±2) · M bảng không xếp thứ tự
  // Ô 1 chữ số tối đa 6 (1…9 phải còn ≥3 số cho câu No). Level 50 = 16 số 3 chữ số, cả 3 câu No đều "giống", bảng xáo trộn.
  const LADDER = 'AAA' + 'UUUUUU' + 'AU' + 'L' + 'AU' + 'L' + 'M' + 'VVVVVVVV' + 'L' + 'AUV'.repeat(8);
  const LEVELS = [];
  (function() {
    const s = { d: [3, 0, 0], alike: 0, mixed: false };
    const push = function() { LEVELS.push({ n: s.d[0] + s.d[1] + s.d[2], d: s.d.slice(), alike: s.alike, mixed: s.mixed }); };
    push();
    for (const op of LADDER) {
      if (op === 'A') s.d[0]++;
      else if (op === 'U') { s.d[0]--; s.d[1]++; }
      else if (op === 'V') { s.d[1]--; s.d[2]++; }
      else if (op === 'L') s.alike++;
      else if (op === 'M') s.mixed = true;
      push();
    }
  })();
  const MAX_LEVEL = LEVELS.length; // 50
  const ROUND_Q = 5;               // lượt nào cũng hỏi 5 câu → điểm luôn tính trên 5

  // ================= LƯU TRÊN MÁY =================
  // Lưu bị chặn / trình duyệt tự xoá → game vẫn chạy, lần sau về Level 1 + hỏi chọn bạn lại. Tắt giữa lượt → mở lại ra bảng mới cùng level.
  const SAVE_KEY = 'bon_numbermemory_v1';
  // Bon level: số lưu dạng CHUỖI chữ số (dài tới 12 chữ số, không lo làm tròn), không số 0 đứng đầu.
  const C_MAXSLOT = 20, C_MAXQ = 20, C_MAXLEN = 12;
  function okNum(v) { return typeof v === 'string' && /^[1-9][0-9]{0,11}$/.test(v); }
  function okSlot(v) { return v === '' || okNum(v); }
  const save = { level: 1, char: 'froggy', picked: false, mute: false, inCustom: false,
                 custom: { board: ['12', '5', '347'], mode: 'random', q: 5, picks: [''] } };
  (function loadSave() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!s) return;
      if (Number.isInteger(s.level) && s.level >= 1 && s.level <= MAX_LEVEL) save.level = s.level;
      if (CHARS.some(function(c) { return c.id === s.char; })) save.char = s.char;
      save.picked = !!s.picked; save.mute = !!s.mute;
      const c = s.custom; // dữ liệu lưu hỏng ở chỗ nào thì bỏ đúng chỗ đó, game vẫn mở
      if (c && typeof c === 'object') {
        if (Array.isArray(c.board) && c.board.length >= 1 && c.board.length <= C_MAXSLOT && c.board.every(okSlot)) save.custom.board = c.board.slice();
        if (Array.isArray(c.picks) && c.picks.length >= 1 && c.picks.length <= C_MAXQ && c.picks.every(okSlot)) save.custom.picks = c.picks.slice();
        if (c.mode === 'random' || c.mode === 'pick') save.custom.mode = c.mode;
        if (Number.isInteger(c.q) && c.q >= 1 && c.q <= C_MAXQ) save.custom.q = c.q;
      }
      save.inCustom = s.inCustom === true;
    } catch (e) {}
  })();
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  let askedPersist = false;
  function askPersist() { // xin trình duyệt đừng tự xoá dữ liệu (Safari không hứa, nhưng có báo là giúp được)
    if (askedPersist) return; askedPersist = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch (e) {}
  }

  // Khối chép nguyên từ draw_run.html (từ "HÌNH 4 BABY" tới hết khối SFX) — dựa vào 3 tên bên ngoài: ctx, TAU, save.mute.
  let ctx = null; // canvas đang vẽ: bạn hỏi / nút mặt bạn / màn chọn — gán trước mỗi lần vẽ (drawOn)

  // ================= HÌNH 4 BABY (chép cách vẽ của flappy_bon_3d.html) =================
  const FROG_IMG = {}; let frogReady = false;
  (function() {
    const src = window.FROG_SPRITES || {}, keys = Object.keys(src); let left = keys.length;

  function openSetup() {
    clearTimeout(leaveTimer); clearTimeout(settleTimer); onLeft = null; readyAt = Infinity;
    save.inCustom = true; persist();
    state = 'setup';
    sel = save.custom.mode === 'pick' ? { list: 'picks', i: save.custom.picks.length - 1 } : { list: 'board', i: save.custom.board.length - 1 };
    render();
  }
  function slotEl(name, i, v, dup) {
    const L = slotList(name), d = document.createElement('div');
    d.className = 'slot' + (name === 'picks' ? ' q' : '') + (v === '' ? ' empty' : '') + (sel.list === name && sel.i === i ? ' sel' : '') + (dup ? ' dup' : '');
    d.dataset.list = name; d.dataset.i = i;
    d.appendChild(document.createTextNode(v === '' ? '?' : v));
    d.addEventListener('click', function() { sel = { list: name, i: i }; drawSetup(); });
    if (L.length > 1) { // còn 1 ô thì không cho bỏ (bảng / câu hỏi không được trống trơn)
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove');
      x.addEventListener('click', function(e) { e.stopPropagation(); noise('click'); L.splice(i, 1); if (sel.list === name) sel.i = Math.min(sel.i, L.length - 1); persist(); drawSetup(); });
      d.appendChild(x);
    }
    return d;
  }
  function plusEl(name) {
    const L = slotList(name), p = document.createElement('button'); p.className = 'plus'; p.textContent = '+'; p.dataset.list = name;
    p.addEventListener('click', function() { noise('click'); L.push(''); sel = { list: name, i: L.length - 1 }; persist(); drawSetup(); });
    return p;
  }
  function drawSetup() {
    const c = save.custom, seen = {}, dup = {};
    c.board.forEach(function(v) { if (v === '') return; if (seen[v]) dup[v] = 1; seen[v] = 1; });
    const ns = $('numSlots'); ns.textContent = '';
    c.board.forEach(function(v, i) { ns.appendChild(slotEl('board', i, v, !!dup[v])); });
    if (c.board.length < C_MAXSLOT) ns.appendChild(plusEl('board'));
    $('modeRandom').classList.toggle('on', c.mode === 'random');
    $('modePick').classList.toggle('on', c.mode === 'pick');
    $('stepper').hidden = c.mode !== 'random'; // "I choose": bấm bao nhiêu ô câu hỏi = hỏi bấy nhiêu câu
    $('qVal').textContent = c.q;
    $('qMinus').disabled = c.q <= 1; $('qPlus').disabled = c.q >= C_MAXQ;
    $('pickGroup').hidden = c.mode !== 'pick';
    const qs = $('qSlots'); qs.textContent = '';
    if (c.mode === 'pick') {
      c.picks.forEach(function(v, i) { qs.appendChild(slotEl('picks', i, v, false)); });
      if (c.picks.length < C_MAXQ) qs.appendChild(plusEl('picks'));
    }
    $('playBtn').disabled = !customReady();
    const on = document.querySelector('#setup .slot.sel'); // ô đang gõ luôn nằm trong chỗ thấy (bảng dài phải kéo)
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }
  function padKey(k) {
    if (state !== 'setup') return;
    const L = slotList(sel.list), cap = slotCap(sel.list);
    noise('click');
    if (k === '→') { // sang ô kế; đang ở ô cuối thì thêm ô mới
      if (sel.i >= L.length - 1 && L.length < cap) L.push('');
      sel.i = Math.min(sel.i + 1, L.length - 1);
    } else {
      if (sel.i < 0 || sel.i >= L.length) sel.i = L.length - 1;
      let v = L[sel.i];
      if (k === '⌫') v = v.slice(0, -1);
      else if (!(k === '0' && v === '') && v.length < C_MAXLEN) v += k; // không cho số bắt đầu bằng 0
      L[sel.i] = v;
    }
    persist(); drawSetup();
  }
  (function buildPad() {
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '→']) {
      const b = document.createElement('button'); b.textContent = k; b.dataset.key = k;
      if (k === '⌫') { b.className = 'del'; b.setAttribute('aria-label', 'Delete'); }
      if (k === '→') { b.className = 'nx'; b.setAttribute('aria-label', 'Next box'); }
      b.addEventListener('click', function() { padKey(k); });
      $('pad').appendChild(b);
    }
  })();
  $('modeRandom').addEventListener('click', function() { noise('click'); save.custom.mode = 'random'; if (sel.list === 'picks') sel = { list: 'board', i: save.custom.board.length - 1 }; persist(); drawSetup(); });
  $('modePick').addEventListener('click', function() { noise('click'); save.custom.mode = 'pick'; sel = { list: 'picks', i: save.custom.picks.length - 1 }; persist(); drawSetup(); });
  $('qMinus').addEventListener('click', function() { noise('click'); save.custom.q = Math.max(1, save.custom.q - 1); persist(); drawSetup(); });
  $('qPlus').addEventListener('click', function() { noise('click'); save.custom.q = Math.min(C_MAXQ, save.custom.q + 1); persist(); drawSetup(); });
  $('playBtn').addEventListener('click', function() { if (state !== 'setup' || !customReady()) return; noise('ding'); askPersist(); newRound(); });
  $('editBtn').addEventListener('click', function() { noise('click'); openSetup(); });

  // ================= CHỌN NGƯỜI HỎI =================
  const tiles = [];
  (function buildPick() {
    for (const ch of CHARS) {
      const b = document.createElement('button'); b.className = 'pickTile'; b.dataset.id = ch.id;
      const cv = document.createElement('canvas'), nm = document.createElement('span'); nm.textContent = ch.name;
      b.append(cv, nm); $('pickTiles').appendChild(b);
      b.addEventListener('click', function() { choose(ch.id); });
      tiles.push({ el: b, cv: cv, actor: makeActor(ch.id, 30) });
    }
  })();
  function openPick() {
    pickOpen = true; $('pick').hidden = false;
    for (const t of tiles) t.el.classList.toggle('on', t.actor.id === save.char);
  }
  function choose(id) {
    save.char = id; save.picked = true; persist(); askPersist();
    say(id, 'hello');
    pickOpen = false; $('pick').hidden = true;
  }

  // ================= VẼ BẠN HỎI (canvas nhỏ) =================
  // khung cao h → bán kính r = h / K: gà có mũ cao nên K lớn (vẽ nhỏ hơn), 3 bạn kia thấp người nên vẽ to hơn cho rõ mặt
  const FIT_K = { froggy: 3.3, chicken: 4.4, babyfrog: 3.0, pillow: 3.4 };
  function drawOn(cv, a, lift) {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return; // đang ẩn
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    a.r = h / (FIT_K[a.id] || 4.4);
    ctx.translate(w / 2, h * 0.58 - (lift || 0) * h);
    drawActor(a);
  }
  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; clock += dt;
    if (hostFaceT > 0) hostFaceT -= dt;
    if (cheerT > 0) cheerT -= dt;
    const blink = (clock % 3.2) < 0.14;
    host.id = face.id = save.char;
    host.face = hostFaceT > 0 ? hostFace : (blink ? 'blink' : 'idle');
    drawOn($('hostCv'), host, cheerT > 0 ? Math.abs(Math.sin(clock * 9)) * 0.12 : Math.sin(clock * 2) * 0.015);
    face.face = 'idle'; drawOn($('faceCv'), face, 0);
    if (pickOpen) tiles.forEach(function(t, i) {
      t.actor.face = (clock + i * 0.8) % 3.2 < 0.14 ? 'blink' : 'idle';
      drawOn(t.cv, t.actor, Math.sin(clock * 2 + i) * 0.02);
    });
    requestAnimationFrame(frame);
  }

  // ================= NÚT =================
  document.addEventListener('pointerdown', sfxUnlock, true); // iOS: tiếng chỉ chạy sau cú chạm đầu
  document.addEventListener('keydown', sfxUnlock, true);
  $('startBtn').addEventListener('click', start);
  $('yesBtn').addEventListener('click', function() { answer(true); });
  $('noBtn').addEventListener('click', function() { answer(false); });
  $('againBtn').addEventListener('click', function() { noise('click'); newRound(); });
  $('nextBtn').addEventListener('click', function() { noise('click'); setLevel(save.level + 1); newRound(); });
  $('faceBtn').addEventListener('click', function() { if (state !== 'ask') openPick(); });
  $('muteBtn').addEventListener('click', function() { save.mute = !save.mute; persist(); render(); if (!save.mute) noise('click'); });
  $('homeBtn').addEventListener('click', function() { location.href = '../'; });
  let lastSize = pageSize();
  window.addEventListener('resize', function() { const s = pageSize(); if (s !== lastSize) { lastSize = s; lvPage = Math.floor((save.level - 1) / s); levelRow(); } });

  // ================= KIỂM THỬ (?test) — gọi vào CHÍNH code game, không chép lại logic =================
  if (TEST) {
    window.__g = {
      get: function() {
        return { state: state, level: save.level, board: round.board.slice(), questions: round.questions.map(function(q) { return { v: q.v, ans: q.ans }; }),
                 answers: answers.slice(), char: save.char, home: HOME, locked: performance.now() < readyAt, readyAt: readyAt, draws: round.draws,
                 picked: save.picked, mute: save.mute, pick: pickOpen };
      },
      LEVELS: LEVELS, makeRound: makeRound, alikeLures: alikeLures, makeCustomRound: makeCustomRound,
      custom: function() { return JSON.parse(JSON.stringify(save.custom)); }, inCustom: function() { return save.inCustom; },
      forceBoards: function(list) { forced = list.map(function(b) { return b.slice(); }); },
      setLevel: function(n) { setLevel(n); newRound(); },
      answer: function(yn, force) { return answer(yn === 'yes' || yn === true, force); },
      openPick: openPick,
      homeBtnRect: function() { const b = $('homeBtn'); if (b.hidden) return null; const r = b.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; },
      sprites: function() { return { frog: frogReady, chicken: !!friendReady.chicken, babyfrog: !!friendReady.babyfrog, pillow: !!friendReady.pillow }; },
      sfx: function() { return SFX.log.slice(); },
      stored: function() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
    };
  }

  newRound();
  if (save.inCustom) openSetup(); // lần trước đang ở Bon level → mở lại màn đặt bài với bảng đã đặt
  if (!save.picked && !TEST) openPick();
  requestAnimationFrame(frame);
})();
</script>
</body>
