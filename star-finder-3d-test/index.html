<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root { --ui: ui-rounded, "SF Pro Rounded", "Fredoka", "Segoe UI Rounded", "Arial Rounded MT Bold", -apple-system, "Segoe UI", sans-serif; }
  html, body { margin: 0; height: 100%; background: #0b1224; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font-family: var(--ui); }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; pointer-events: none; color: #f8fafc; }
  #top { top: 0; height: 64px; background: linear-gradient(180deg, rgba(10,18,40,.94) 0%, rgba(14,26,56,.82) 70%, rgba(14,26,56,.55) 100%); box-shadow: 0 2px 0 rgba(255,255,255,.06) inset, 0 6px 18px rgba(0,0,0,.25); display: flex; align-items: center; padding: 0 16px 0 20px; gap: 14px; }
  #title b { display: block; font-size: 22px; font-weight: 700; letter-spacing: .6px; background: linear-gradient(180deg, #ffe58a 0%, #fbbf24 55%, #f59e0b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(120,53,15,.55)); line-height: 1.05; }
  #title span { color: #a9b6cc; font-size: 13px; font-weight: 500; }
  #boss { flex: 1; text-align: center; visibility: hidden; }
  #boss b { display: block; font-size: 19px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(180deg, #fff3b0, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); }
  #hearts { display: inline-flex; gap: 12px; margin-top: 2px; }
  #hearts svg { width: 22px; height: 20px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); transition: transform .2s, opacity .2s; }
  #hearts svg.off { opacity: .28; filter: grayscale(1); transform: scale(.85); }
  #fps { background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 3px 14px 4px; text-align: center; font-weight: 700; font-size: 19px; line-height: 1.1; }
  #fps small { display: block; font-size: 11px; color: #a9b6cc; font-weight: 500; }
  #mute { pointer-events: auto; width: 50px; height: 46px; border-radius: 13px; border: 1px solid rgba(255,255,255,.18); background: linear-gradient(180deg, #3b4b6b, #243250); box-shadow: 0 3px 0 #111a2e, 0 1px 0 rgba(255,255,255,.2) inset; display: flex; align-items: center; justify-content: center; padding: 0; }
  #mute svg { width: 26px; height: 26px; }
  #bottom { bottom: 0; height: 132px; background: linear-gradient(rgba(8,14,30,0), rgba(8,14,30,.55)); }
  .btn { pointer-events: auto; position: absolute; bottom: 12px; width: 142px; height: 106px; border-radius: 24px; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: linear-gradient(180deg, #4a5a7a 0%, #2c3954 52%, #222c44 100%); border: 3px solid #7f8fb0;
    box-shadow: 0 6px 0 #141b2e, 0 10px 18px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.28) inset, 0 -8px 16px rgba(0,0,0,.25) inset; transition: transform .06s, box-shadow .06s; }
  .btn svg { width: 54px; height: 54px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); }
  .btn small { font-size: 21px; font-weight: 700; text-shadow: 0 2px 2px rgba(0,0,0,.45); letter-spacing: .3px; }
  .btn.on { transform: translateY(4px); box-shadow: 0 2px 0 #141b2e, 0 4px 10px rgba(0,0,0,.4), 0 2px 0 rgba(255,255,255,.3) inset, 0 -6px 14px rgba(0,0,0,.2) inset; filter: brightness(1.18); }
  #bL { left: 16px; } #bR { left: 172px; } #bJ { right: 16px; width: 150px; }
  #bJ svg { width: 46px; height: 40px; }
  #bF { right: 182px; width: 152px; display: none; background: linear-gradient(180deg, #ffb347 0%, #fb7a1c 50%, #e85d0c 100%); border-color: #ffd29a; box-shadow: 0 6px 0 #9a3a07, 0 10px 18px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.45) inset, 0 -8px 16px rgba(150,40,0,.35) inset; }
  #bF.on { box-shadow: 0 2px 0 #9a3a07, 0 4px 10px rgba(0,0,0,.4), 0 2px 0 rgba(255,255,255,.45) inset; }
  #bF svg { width: 44px; height: 50px; }
  #status { position: absolute; left: 340px; right: 350px; bottom: 40px; text-align: center; font-size: 27px; font-weight: 700; color: #f8fafc; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.55); }
  #hint { top: 80px; text-align: center; transition: opacity .3s; }
  #hint span { display: inline-block; background: linear-gradient(180deg, rgba(22,32,58,.92), rgba(12,20,40,.88)); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.12) inset; padding: 9px 26px 10px; border-radius: 26px; font-size: 23px; font-weight: 600; }
  #banner { top: 32%; text-align: center; opacity: 0; transform: scale(.6); transition: opacity .35s, transform .35s; }
  #banner div { display: inline-block; background: linear-gradient(180deg, rgba(24,30,64,.92), rgba(10,14,34,.9)); border: 4px solid #fde68a; border-radius: 26px; padding: 16px 44px 18px; box-shadow: 0 0 40px rgba(253,230,138,.35); }
  #banner b { display: flex; align-items: center; gap: 14px; justify-content: center; font-size: 44px; font-weight: 700; color: #fde68a; }
  #banner b svg { width: 34px; height: 44px; }
  #banner span { font-size: 21px; font-weight: 600; }
  #banner.show { opacity: 1; transform: scale(1); }
  #win { position: fixed; inset: 0; background: rgba(10,18,40,.5); display: none; align-items: center; justify-content: center; }
  #win div { background: linear-gradient(180deg, #fffdf5, #fff4d6); border: 4px solid #f59e0b; border-radius: 28px; padding: 32px 58px; text-align: center; color: #334155; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  #win b { display: block; font-size: 34px; font-weight: 700; color: #b45309; margin-bottom: 8px; } #win span { font-size: 21px; font-weight: 600; display: block; margin-bottom: 22px; }
  #win button { font: inherit; font-size: 25px; font-weight: 700; padding: 16px 50px; border-radius: 18px; border: 3px solid #16a34a; background: linear-gradient(180deg, #4ade80, #22c55e); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); box-shadow: 0 5px 0 #15803d; }
  #load { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, #1d3160, #0b1224); color: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7deea"/></linearGradient>
    <linearGradient id="gFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset=".45" stop-color="#ffb020"/><stop offset="1" stop-color="#e8350c"/></linearGradient>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a85"/><stop offset=".6" stop-color="#ef2b3c"/><stop offset="1" stop-color="#b3121f"/></linearGradient>
    <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>

<div class="hud" id="top">
  <div id="title"><b>STAR FINDER</b><span>mẫu 3D thật · chỉ để so hình &amp; tiếng</span></div>
  <div id="boss"><b>THUNDER KING</b><span id="hearts"></span></div>
  <div id="fps"><span id="fpsN">--</span> fps<small id="fpsS">low -- · Q3</small></div>
  <button id="mute" aria-label="sound"></button>
</div>
<div class="hud" id="hint"><span id="hintT"></span></div>
<div class="hud" id="banner"><div><b><svg viewBox="0 0 24 32"><path d="M14 0 L2 18 H11 L8 32 L22 12 H13 Z" fill="url(#gBolt)" stroke="#92400e" stroke-width="1.2"/></svg>THUNDER KING<svg viewBox="0 0 24 32"><path d="M14 0 L2 18 H11 L8 32 L22 12 H13 Z" fill="url(#gBolt)" stroke="#92400e" stroke-width="1.2"/></svg></b><span>Everyone is angry now. Shoot the cloud!</span></div></div>
<div class="hud" id="bottom">
  <div class="btn" id="bL"><svg viewBox="0 0 64 64"><path d="M46 10 Q50 8 50 13 V51 Q50 56 46 54 L14 35 Q10 32 14 29 Z" fill="url(#gWhite)"/></svg></div>
  <div class="btn" id="bR"><svg viewBox="0 0 64 64"><path d="M18 10 Q14 8 14 13 V51 Q14 56 18 54 L50 35 Q54 32 50 29 Z" fill="url(#gWhite)"/></svg></div>
  <div id="status"></div>
  <div class="btn" id="bF"><svg viewBox="0 0 44 52"><path d="M22 2 C26 12 38 18 38 32 C38 43 31 50 22 50 C13 50 6 43 6 33 C6 25 11 20 14 15 C15 21 17 24 20 25 C19 16 20 9 22 2 Z" fill="url(#gFlame)" stroke="#fff3c4" stroke-width="1.5"/><path d="M22 26 C25 31 30 34 30 40 C30 45 26 48 22 48 C18 48 14 45 14 40 C14 35 18 33 22 26 Z" fill="#fff3a0" opacity=".85"/></svg><small>Attack</small></div>
  <div class="btn" id="bJ"><svg viewBox="0 0 46 40"><path d="M23 3 Q25 2 27 5 L44 34 Q45 38 41 38 H5 Q1 38 2 34 L19 5 Q21 2 23 3 Z" fill="url(#gWhite)"/></svg><small>Jump</small></div>
</div>
<div id="win"><div><b>You beat the Thunder King!</b><span id="winS"></span><button id="again">Play again</button></div></div>

<script src="three.min.js"></script>
<script src="pp/CopyShader.js"></script>
<script src="pp/LuminosityHighPassShader.js"></script>
<script src="pp/EffectComposer.js"></script>
<script src="pp/RenderPass.js"></script>
<script src="pp/ShaderPass.js"></script>
<script src="pp/UnrealBloomPass.js"></script>
<script src="pp/BufferGeometryUtils.js"></script>
<script src="GLTFLoader.js"></script>
<script src="froggy_glb.js"></script>
<script src="chicken_glb.js"></script>
<script src="babyfrog_glb.js"></script>
<script src="friends_sounds.js"></script>
<script src="mau_core.js"></script>
<script src="mau_audio.js"></script>
<script src="v2_gfx.js"></script>
<script>
(function () {
  'use strict';
  const G = window.SFG, scene = G.scene, camera = G.camera, renderer = G.renderer, TEX = G.TEX, TAU = Math.PI * 2;
  const BGU = THREE.BufferGeometryUtils;
  const sim = StarCore.create({ hero: 'froggy' });
  const S = sim.S, hero = sim.hero, inp = sim.inp, C = sim.C, U = sim.util;
  const CELL = C.CELL, LVB = C.LVB, RC = C.RC, RV = C.RV;
  const clamp = U.clamp, approach = U.approach;
  const TEST = /[?&]test/.test(location.search), GALLERY = /[?&]gallery/.test(location.search);
  const X = px => px / CELL, Y = py => (LVB - py) / CELL;
  const $ = id => document.getElementById(id);
  const rnd = G.rnd, fbm = G.fbm;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lin = hex => new THREE.Color(hex);              // hex = sRGB, đổi sang tuyến tính (ColorManagement bật)
  const LV = sim.level, DEPTH = 5, ZF = DEPTH / 2;
  const groundTops = LV.objs.filter(o => o.t === 'block');
  const QI = {}; // khối nhân bản nào giảm được số lượng khi máy yếu (cỏ, rừng xa)

  // ================= KHUNG VẼ + HẬU KỲ =================
  G.resize(); G.buildComposer(); G.resize();
  window.addEventListener('resize', G.resize);

  // ================= HOẠ TIẾT THÊM =================
  TEX.cloudN = G.pixelTex(256, 256, function (u, v) { // nhiễu lặp được (trời bão, nước)
    const f = (a, b) => G.fbm(a, b, 5);
    const n = f(u * 6, v * 6) * (1 - u) * (1 - v) + f(u * 6 - 6, v * 6) * u * (1 - v) + f(u * 6, v * 6 - 6) * (1 - u) * v + f(u * 6 - 6, v * 6 - 6) * u * v;
    const g = clamp((n - 0.2) * 1.6, 0, 1) * 255; return [g, g, g]; }, { repeat: true, srgb: false });
  TEX.needle = G.canvasTex(256, 256, function (g, w, h) { // lá thông: sợi kim đậm nhạt
    g.fillStyle = '#e8eee6'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1400; i++) { const x = rnd(i * 3.1) * w, y = rnd(i * 5.7) * h, l = 10 + rnd(i * 1.3) * 22, a = -0.35 + rnd(i * 2.9) * 0.7, k = rnd(i * 7.7);
      g.strokeStyle = k < 0.5 ? 'rgba(40,70,40,' + (0.25 + k * 0.5) + ')' : 'rgba(255,255,230,' + (k - 0.5) * 0.9 + ')'; g.lineWidth = 1 + k * 1.5;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.sin(a) * l, y + Math.cos(a) * l); g.stroke(); } }, { repeat: true });
  TEX.bark = G.pixelTex(64, 256, function (u, v) { const n = G.fbm(u * 6, v * 30, 4), s = 0.5 + 0.5 * Math.sin(u * 40 + n * 6); const k = 0.55 + n * 0.5 - s * 0.15; return [120 * k, 78 * k, 46 * k]; }, { repeat: true });
  TEX.rays = G.canvasTex(512, 512, function (g, w, h) { // tia nắng
    g.translate(w / 2, h / 2);
    for (let i = 0; i < 26; i++) { const a = rnd(i * 9.1) * TAU, wd = 0.03 + rnd(i * 3.3) * 0.07, al = 0.08 + rnd(i * 2.2) * 0.22;
      const gr = g.createLinearGradient(0, 0, Math.cos(a) * 256, Math.sin(a) * 256); gr.addColorStop(0, 'rgba(255,250,225,' + al + ')'); gr.addColorStop(1, 'rgba(255,250,225,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 256, a - wd, a + wd); g.closePath(); g.fill(); }
    const r = g.createRadialGradient(0, 0, 0, 0, 0, 256); r.addColorStop(0, 'rgba(255,252,235,0.9)'); r.addColorStop(0.12, 'rgba(255,245,210,0.45)'); r.addColorStop(0.5, 'rgba(255,240,200,0.08)'); r.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = r; g.fillRect(-256, -256, 512, 512); });
  TEX.cloud = G.pixelTex(128, 128, function (u, v) { const d = Math.hypot(u - 0.5, v - 0.5) * 2, n = G.fbm(u * 4 + 1, v * 4 + 5, 4), a = clamp((1 - d - (1 - n) * 0.32) * 2.6, 0, 1), sh = 0.78 + 0.22 * clamp((0.62 - v) * 2.2, 0, 1) + (n - 0.5) * 0.12; const g = clamp(sh, 0, 1) * 255; return [g, g, Math.min(255, g * 1.04), a * 255]; });
  TEX.star4 = G.pixelTex(64, 64, function (u, v) { const dx = Math.abs(u - 0.5) * 2, dy = Math.abs(v - 0.5) * 2, a = Math.pow(Math.max(0, 1 - Math.sqrt(dx) - Math.sqrt(dy)), 1.2) * 3 + Math.pow(Math.max(0, 1 - Math.hypot(dx, dy) * 2.6), 2); return [255, 255, 255, Math.min(1, a) * 255]; });
  TEX.drop = G.pixelTex(16, 128, function (u, v) { const a = Math.max(0, 1 - Math.abs(u - 0.5) * 2) * Math.pow(v, 1.6); return [255, 255, 255, a * 255]; }, { srgb: false });
  TEX.z = G.canvasTex(128, 128, function (g) { g.font = '700 104px "Fredoka", "Arial Rounded MT Bold", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 14; g.strokeStyle = '#1e2a48'; g.strokeText('Z', 64, 68); g.fillStyle = '#e8f0ff'; g.fillText('Z', 64, 68); });
  TEX.daisy = G.canvasTex(128, 128, function (g) { g.translate(64, 64);
    for (let i = 0; i < 12; i++) { g.save(); g.rotate(i / 12 * TAU); g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(0, -34, 11, 26, 0, 0, TAU); g.fill(); g.restore(); }
    const c = g.createRadialGradient(0, -4, 2, 0, 0, 18); c.addColorStop(0, '#fff7a8'); c.addColorStop(1, '#f59e0b'); g.fillStyle = c; g.beginPath(); g.arc(0, 0, 16, 0, TAU); g.fill(); });

  // ================= TRỜI =================
  const SUN_DIR = new THREE.Vector3(0.40, 0.17, -0.89).normalize();
  const skyU = { uStorm: { value: 0 }, uFlash: { value: 0 }, uTime: G.shared.uTime, uSun: { value: SUN_DIR }, uN: { value: TEX.cloudN } };
  const SKY_FRAG = [
    'uniform float uStorm, uFlash, uTime; uniform vec3 uSun; uniform sampler2D uN; varying vec3 vDir;',
    'void main(){',
    '  vec3 d = normalize(vDir); float h = d.y;',
    '  float t = clamp(h / 0.135, 0.0, 1.0);',
    '  vec3 hor = vec3(0.34, 0.60, 1.0), mid = vec3(0.11, 0.33, 0.92), zen = vec3(0.04, 0.17, 0.72);',
    '  vec3 c = mix(hor, mid, smoothstep(0.0, 0.45, t)); c = mix(c, zen, smoothstep(0.45, 1.0, t));',
    '  if (h < 0.0) c = mix(hor, vec3(0.30, 0.50, 0.62), clamp(-h * 6.0, 0.0, 1.0));',
    '  float s = max(dot(d, uSun), 0.0);',
    '  c += vec3(1.0, 0.86, 0.6) * (pow(s, 6.0) * 0.28 + pow(s, 60.0) * 0.6 + pow(s, 900.0) * 14.0) * (1.0 - uStorm);',
    '  vec2 uv = d.xz / (abs(d.y) + 0.12) * 0.11 + vec2(uTime * 0.004, 0.0);',
    '  float n = texture2D(uN, uv).r * 0.65 + texture2D(uN, uv * 2.7 + 0.37).r * 0.35;',
    '  vec3 sz = vec3(0.014, 0.024, 0.065), sh = vec3(0.06, 0.10, 0.19);',
    '  vec3 sc = mix(sh, sz, smoothstep(0.0, 1.0, t)); sc *= 0.5 + n * 1.3;',
    '  c = mix(c, sc, uStorm); c += uFlash * vec3(0.55, 0.62, 0.85) * uStorm * (0.4 + n);',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'].join('\n');
  const skyMat = new THREE.ShaderMaterial({ uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: SKY_FRAG });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(390, 48, 24), skyMat); sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);
  const rays = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.rays, color: G.hdr(0xfff4d8, 1.0), blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true, fog: false }));
  rays.scale.set(130, 130, 1); rays.renderOrder = -5; scene.add(rays);

  // mây bông: mỗi đám = nhiều cụm khói chồng lên, dưới đáy ngả xám xanh
  const clouds = [];
  (function () {
    for (let i = 0; i < 14; i++) {
      const g = new THREE.Group(), w = 16 + rnd(i + 1) * 20, n = 6 + Math.floor(rnd(i + 2) * 4);
      const add = function (x, y, r, shade, zz) { const m = new THREE.SpriteMaterial({ map: TEX.cloud, color: new THREE.Color(), transparent: true, depthWrite: false, fog: false });
        const s = new THREE.Sprite(m); s.position.set(x, y, zz); s.scale.set(r * 2.6, r * 2.1, 1); s.userData.shade = shade; g.add(s); };
      for (let k = 0; k < n; k++) { const t = k / (n - 1), r = (4.6 + rnd(i * 13 + k) * 2.6) * (1 - Math.abs(t - 0.5) * 0.7); add((t - 0.5) * w, 0, r, 1.0, 0); }                 // hàng đáy: phẳng, hơi xám xanh
      for (let k = 0; k < n - 2; k++) { const t = (k + 0.5) / (n - 2), r = (5.2 + rnd(i * 17 + k) * 3.0) * (1 - Math.abs(t - 0.5) * 1.1); add((t - 0.5) * w * 0.7, 2.4 + r * 0.3, r, 1.3, 0.5); } // tầng trên: trắng sáng, đùn cao ở giữa
      for (let k = 0; k < 3; k++) { const r = 4.2 + rnd(i * 19 + k) * 2.4; add((rnd(i * 23 + k) - 0.5) * w * 0.35, 5.0 + rnd(i * 29 + k) * 2.4, r, 1.5, 1); }
      g.position.set(-90 + (i / 14) * 280 + rnd(i + 70) * 14, 20 + rnd(i + 80) * 15, -235 - rnd(i + 90) * 50);
      g.userData.v = 0.4 + rnd(i + 95) * 0.6; scene.add(g); clouds.push(g);
    }
  })();

  // ================= NÚI TUYẾT =================
  const fogDay = new THREE.Color(0xb8d4ec), fogStorm = new THREE.Color(0x18294a);
  scene.fog = new THREE.Fog(fogDay.clone(), 45, 900);

    if (boss.face === 'dizzy' && boss.root.visible) for (let s = 0; s < 5 && di < dizzy.length; s++, di++) { const a = clock * 4 + s * TAU / 5, m = dizzy[di], R = boss.R * boss.scaleK; m.visible = true; m.scale.setScalar(1.8); m.position.set(boss.root.position.x + Math.cos(a) * R * 1.3, boss.root.position.y + R * 1.25, Math.sin(a) * R * 0.8); m.rotation.z = a; }
    for (; di < dizzy.length; di++) { dizzy[di].visible = false; dizzy[di].scale.setScalar(1); }
    // món nhặt
    gunItem.visible = !sim.gotGun() && !GALLERY; gunItem.position.y = 18 - sim.gun.y - 0.5 + Math.sin(clock * 3) * 0.12; gunItem.rotation.y = clock * 1.6;
    wingItem.visible = !sim.gotWing() && !GALLERY; wingItem.position.y = 18 - sim.wing.y - 0.5 + Math.sin(clock * 3 + 1) * 0.12; wingItem.rotation.y = Math.sin(clock * 1.2) * 0.5;
    const wf = Math.sin(clock * 6) * 0.25; wingItem.userData.pair.userData.L.rotation.z = -0.5 - wf; wingItem.userData.pair.userData.R.rotation.z = 0.5 + wf;
    const showStar = S.starShown && !S.got; starItem.visible = starGlow.visible = showStar;
    if (showStar) { const e = 1 - Math.pow(1 - S.starDrop, 3), fy = 18 - sim.star.y - 0.5; starItem.position.set(sim.star.x + 0.5, 20 + (fy - 20) * e + Math.sin(clock * 3) * 0.1, 0); starItem.rotation.y = clock * 2.2; starGlow.position.copy(starItem.position); starGlow.scale.setScalar(4.5 + Math.sin(clock * 5) * 0.6); }
    // boss
    if (gloatT > 0) gloatT -= dt;
    drawBoss(dt);
    // sét báo trước (vòng sáng trên đất)
    for (const L of S.lightning) if (L.phase === 'warn') {
      let r = rings.get(L);
      if (!r) { r = new THREE.Group(); const ring = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.35, 40), new THREE.MeshBasicMaterial({ color: G.hdr(0xfff3a0, 2), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; r.add(ring);
        const disc = new THREE.Mesh(new THREE.CircleGeometry(1.0, 32), new THREE.MeshBasicMaterial({ map: TEX.soft, color: G.hdr(0xfff3a0, 1.5), transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false })); disc.rotation.x = -Math.PI / 2; r.add(disc);
        const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.9, 12, 20, 1, true), new THREE.MeshBasicMaterial({ color: G.hdr(0xfff7c2, 1.2), transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); beam.position.y = 6; r.add(beam);
        r.userData = { ring: ring, disc: disc, beam: beam }; r.position.set(X(L.x), Y(L.y) + 0.09, 0); r.renderOrder = 4; scene.add(r); rings.set(L, r); }
      const kk = 1 - L.warn / 0.85, pulse = 0.5 + 0.5 * Math.sin(clock * 25 * (0.5 + kk));
      r.userData.ring.scale.setScalar(1.5 - 0.5 * kk); r.userData.ring.material.opacity = (0.35 + 0.6 * pulse) * (0.3 + 0.7 * kk); r.userData.disc.material.opacity = 0.12 + 0.4 * kk * pulse; r.userData.beam.material.opacity = 0.04 + 0.12 * kk;
    }
    rings.forEach(function (r, L) { if (L.phase !== 'warn' || S.lightning.indexOf(L) < 0) { scene.remove(r); rings.delete(L); } });
    for (let i = bolts.length - 1; i >= 0; i--) { const b = bolts[i]; b.t -= dt; const kk = clamp(b.t / 0.32, 0, 1); b.g.traverse(o => { if (o.material) o.material.opacity = (o.material.blending === THREE.AdditiveBlending ? 0.5 : 1) * kk * (Math.random() < 0.2 ? 0.4 : 1); }); if (b.t <= 0) { scene.remove(b.g); b.g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); bolts.splice(i, 1); } }
    for (let i = scorches.length - 1; i >= 0; i--) { const s = scorches[i]; s.t -= dt; s.m.material.opacity = 0.7 * Math.min(1, s.t / 2); if (s.t <= 0) { scene.remove(s.m); scorches.splice(i, 1); } }
    // đạn lửa: lõi trắng nóng + quầng cam + vệt sao lấp lánh
    for (let i = 0; i < fireMeshes.length; i++) {
      const f = S.fireballs[i], m = fireMeshes[i]; m.visible = !!f && !GALLERY;
      if (f) { m.position.set(X(f.x), Y(f.y), 0.3); const sgn = Math.sign(f.vx); m.scale.setScalar(1 + Math.sin(clock * 30 + i) * 0.12);
        for (let n = 0; n < 2; n++) psAdd.add({ x: m.position.x - sgn * (0.2 + Math.random() * 0.4), y: m.position.y + (Math.random() - 0.5) * 0.3, z: 0.3, vx: -sgn * 2 + (Math.random() - 0.5), vy: 0.8 + Math.random() * 1.4, vz: (Math.random() - 0.5), col: FIRE_COLS[n % 3], size: 0.42, life: 0.3, a: 0.7 });
        if (Math.random() < 0.5) psSpark.add({ x: m.position.x - sgn * (0.3 + Math.random() * 0.6), y: m.position.y + (Math.random() - 0.5) * 0.5, z: 0.4, vx: -sgn * (1 + Math.random()), vy: (Math.random() - 0.5) * 1.5, vz: 0, col: '#ffc030', size: 0.5 + Math.random() * 0.35, life: 0.55, spin: 1 }); }
      if (i < 2) { const l = fireLights[i]; if (f) { l.position.set(X(f.x), Y(f.y), 1.2); l.intensity = 2.6; } else l.intensity = 0; }
    }
    // hạt lơ lửng: bụi nắng (ngày) / đom đóm (bão); mưa rơi lộp độp xuống đất
    if (Math.random() < dt * 9) psSpark.add({ x: camX + (Math.random() - 0.5) * 22, y: 4.4 + Math.random() * 5, z: -3 + Math.random() * 5, vx: (Math.random() - 0.5) * 0.4, vy: 0.15 + Math.random() * 0.2, vz: 0, col: k > 0.5 ? '#ffc94a' : '#ffd98a', size: 0.12 + Math.random() * 0.12, life: 3, a: 0.6, fadeIn: true, spin: 0.5 });
    if (k > 0.2) for (let n = 0; n < 3; n++) if (Math.random() < dt * 40 * k) { const sx = camX + (Math.random() - 0.5) * 22, sz = (Math.random() - 0.3) * 5, gy = Y(sim.groundYAt(sx * CELL)); burst(psNorm, sx, gy + 0.05, 3, '#c9dcff', 1.6, { size: 0.12, life: 0.3, grav: 14, up: 1.6, z: sz, a: 0.7 }); }
    // gió: lá bay
    const wd = S.wind.dir * S.wind.str / 170;
    if (S.wind.dir && S.wind.str > 50 && Math.random() < dt * 16) psNorm.add({ x: camX - S.wind.dir * 16, y: 4.5 + Math.random() * 9, z: (Math.random() - 0.5) * 5, vx: S.wind.dir * (7 + Math.random() * 6), vy: -1 - Math.random() * 2, vz: 0, col: ['#86efac', '#fbbf24', '#fb923c'][Math.floor(Math.random() * 3)], size: 0.3, life: 3.5, grav: 0.5 });
    // mưa
    for (const rm of [rainNear, rainFar]) { rm.uniforms.uA.value = k > 0.1 ? k : 0; rm.uniforms.uCam.value.set(camX, camY); rm.uniforms.uSlant.value = 0.18 + wd * 0.35; }
    psAdd.update(dt); psSpark.update(dt); psNorm.update(dt); psPuff.update(dt);
    // camera: theo baby; boss ra mắt thì lia sang + tiến gần; rung
    let tx = X(hero.x) + 2.4, ty = 7.2 + clamp((Y(hero.y) - 8) * 0.45, 0, 3.5), tz = 1;
    if (B && B.state === 'intro') { tx = X(B.x); ty = 9.5; tz = 0.8; }
    else if (B && B.state === 'fight') { tx = (tx + X(B.x)) / 2 + 1; ty = 8.2; tz = 1.04; }
    tx = clamp(tx, 10.5, sim.level.cols - 10.5);
    if (GALLERY) { tx = 30; ty = 7.6; tz = 0.9; }
    const sp = B && B.state === 'intro' ? 2.5 : 5;
    camX += (tx - camX) * Math.min(1, dt * sp); camY += (ty - camY) * Math.min(1, dt * 4); camZoom += (tz - camZoom) * Math.min(1, dt * 2.5);
    let sx = 0, sy = 0; if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - 0.5) * shakeAmp * 2; sy = (Math.random() - 0.5) * shakeAmp * 2; } else shakeAmp = 0;
    const cd = G.camDist() * camZoom;
    camera.position.set(camX + sx, camY + 3.6 * camZoom + sy, cd); camera.lookAt(camX + sx * 0.5, camY, 0);
    sun.position.set(camX + 16, 30, 14); sun.target.position.set(camX, 4, 0); sun.target.updateMatrixWorld();
  }
  let galleryStorm = 0.85; const tmpC = new THREE.Color();
  // ----- tự giảm tải: máy không giữ nổi ~42 khung hình trong 3 giây thì hạ 1 nấc (chỉ hạ, không tăng lại để khỏi nhấp nháy) -----
  // Q3 đủ · Q2 ảnh trong 85% + cỏ 60% · Q1 ảnh trong 75%, cỏ 35%, rừng xa 50%, tắt bóng đổ thật · Q0 thêm: tắt quầng sáng, ảnh trong 65%
  const QFORCE = (location.search.match(/[?&]q=(\d)/) || [])[1], QAUTO = QFORCE === undefined && (!TEST || /[?&]auto/.test(location.search));
  let quality = 3, qWarm = 6, qBad = 0, fpsLow = 999;
  function setQuality(q) {
    quality = clamp(q, 0, 3);
    QI.grass.count = Math.round(QI.grassN * [0.35, 0.35, 0.6, 1][quality]); QI.forest.count = Math.round(QI.forestN * [0.5, 0.5, 1, 1][quality]);
    G.setScale([0.65, 0.75, 0.85, 1][quality]); G.setBloom(quality > 0);
    const sh = quality >= 2; if (sun.castShadow !== sh) { sun.castShadow = sh; scene.traverse(function (o) { if (o.material && o.receiveShadow) o.material.needsUpdate = true; }); }
    qWarm = 4; qBad = 0; fpsLow = 999; showLow();
  }
  function showLow() { $('fpsS').textContent = 'low ' + (fpsLow > 900 ? '--' : Math.round(fpsLow)) + ' · Q' + quality; }
  function qualityTick(f) { // gọi mỗi nửa giây
    if (qWarm > 0) { qWarm--; return; }
    if (f < fpsLow) fpsLow = f;
    if (QAUTO && quality > 0) { qBad = f < 42 ? qBad + 1 : 0; if (qBad >= 6) { setQuality(quality - 1); return; } }
    showLow();
  }

  if (TEST || GALLERY) window.__m = {
    sim: sim, S: S, hero: hero, inp: inp, fps: function () { return fpsShow; }, ready: function () { return ready; },
    info: function () { return { tris: renderer.info.render.triangles, calls: renderer.info.render.calls, ps: psAdd.count() + psNorm.count() + psSpark.count() + psPuff.count(), post: G.info() }; },
    quality: function () { return { q: quality, low: fpsLow > 900 ? null : Math.round(fpsLow * 10) / 10, auto: QAUTO, grass: QI.grass.count, forest: QI.forest.count, scale: G.scale(), pr: renderer.getPixelRatio() }; }, setQuality: setQuality,
    audio: StarAudio.state, bossFace: function () { return boss ? boss.face : null; }, faces: BOSS_FACES,
    forceFace: function (f, st) { forceFace = f || null; if (st !== undefined) galleryStorm = st; }, galleryCam: function (x) { camX = x; } };
  loadAll(start);
  requestAnimationFrame(frame);
})();
